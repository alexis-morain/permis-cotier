cours: barre-route
resume: >-
  Devant une rencontre, cherche d’abord s’il y a un rattrapant, un chenal étroit ou de la brume : ces
  règles passent avant les autres. Sinon, regarde les types de navires, puis le côté d’où vient l’autre.
sections:
  - titre: Qui s’écarte, rencontre par rencontre
    notions: [barre-rattrapant, barre-routes-opposees, barre-routes-croisees, barre-voiliers, barre-hierarchie-privileges]
    blocs:
      - tableau:
          colonnes: [Rencontre, Qui s’écarte, Qui maintient]
          lignes:
            - [Un navire en rattrape un autre, "Celui qui rattrape, quel que soit son type", Celui qui est rattrapé]
            - ["Deux navires à moteur, routes opposées", "Les deux : chacun vient sur tribord", "On se croise bâbord contre bâbord"]
            - ["Deux navires à moteur, routes qui se croisent", Celui qui voit l’autre sur tribord, "L’autre, qui te voit sur son bâbord"]
            - ["Deux voiliers, bords différents", Celui qui reçoit le vent de bâbord, Le voilier tribord amures]
            - ["Deux voiliers, même bord", Celui qui est au vent, Celui qui est sous le vent]
            - [Deux navires de types différents, Celui qui est le plus bas dans l’échelle, Celui qui le précède dans l’échelle]

  - titre: Veiller et voir le risque
    largeur: demie
    notions: [barre-veille-vitesse, barre-risque-abordage]
    blocs:
      - regles:
          - Veille visuelle et auditive permanente, par tous les moyens.
          - "Vitesse de sécurité : pouvoir éviter un abordage et s’arrêter à temps. Pas de chiffre."
          - Relèvement constant et distance qui diminue, il y a risque.
          - Dans le doute, le risque existe.
      - piege: >-
          « Vitesse de sécurité » ne veut pas dire « vitesse lente » : par brume épaisse très faible, par temps clair et mer libre élevée.

  - titre: Manœuvrer tôt et franchement
    largeur: demie
    notions: [barre-manoeuvre-evitement, barre-privilegie-non-privilegie]
    blocs:
      - regles:
          - Manœuvre franche, largement à temps, assez grande pour être vue.
          - Changer de cap seul est souvent le plus efficace.
          - On contrôle jusqu’à ce que l’autre soit paré et clair.
          - "Règle 16 : celui qui s’écarte le fait tôt et franchement. Règle 17 : l’autre maintient cap et vitesse."
          - Le privilégié manœuvre seul dès que l’autre ne fait rien, et le doit quand l’autre seul ne suffit plus.
      - piege: >-
          « Maintenir » ne veut pas dire foncer jusqu’au choc.

  - titre: Dans un chenal étroit
    largeur: demie
    notions: [barre-chenal-etroit]
    blocs:
      - regles:
          - On tient sa droite, sans danger. On se croise bâbord contre bâbord.
          - "Moins de 20 mètres, voilier, pêche : on ne gêne pas un navire qui ne peut naviguer que dans le chenal."
          - On ne traverse pas si on gêne, on évite d’y mouiller.
          - On annonce un dépassement au signal sonore et on attend l’accord. Signal du coude à l’approche.
      - piege: >-
          Le chenal renverse la hiérarchie : le voilier ne passe pas avant un navire qui ne peut pas en sortir.

  - titre: Deux navires à moteur, le feu dit qui s’écarte
    notions: [barre-routes-opposees, barre-routes-croisees]
    blocs:
      - schema:
          fichier: barre-route-croisement.svg
          alt: >-
            Vue de dessus. Ton navire, au centre en bas, fait route vers le haut. Un navire vient de la droite,
            cap vers la gauche, avec un feu rouge sur le côté qui te fait face. Un autre vient de la gauche,
            cap vers la droite, avec un feu vert sur le côté qui te fait face.
      - galerie:
          - visuel: situations/routes-opposees.svg
            alt: Vue de dessus. Ton bateau fait route vers le haut, un navire à moteur vient droit sur lui, étrave contre étrave.
            nom: Routes opposées
            lignes: [Chacun vient sur tribord]
          - visuel: situations/routes-croisees-tribord.svg
            alt: Vue de dessus. Ton bateau fait route vers le haut, un navire à moteur vient de la droite et coupera ta route devant toi.
            nom: Il vient de ta droite
            lignes: [Tu t’écartes, derrière lui]
          - visuel: situations/routes-croisees-babord.svg
            alt: Vue de dessus. Ton bateau fait route vers le haut, un navire à moteur vient de la gauche et coupera ta route devant toi.
            nom: Il vient de ta gauche
            lignes: [Tu maintiens]
      - regles:
          - Celui qui s’écarte évite, si possible, de croiser sur l’avant de l’autre.
      - piege: >-
          Ces règles ne valent qu’entre deux navires à moteur. Face à un voilier, tu t’écartes, quelle que soit sa position.

  - titre: Entre voiliers, le vent décide
    largeur: demie
    notions: [barre-voiliers]
    blocs:
      - galerie:
          - visuel: situations/voiliers-amures-contraires.svg
            alt: Deux voiliers convergent, vent venant de la droite. Le voilier du bas porte sa voile à bâbord, celui de droite la porte à tribord.
            nom: Bords différents
            lignes: [Bâbord amures s’écarte]
          - visuel: situations/voiliers-memes-amures.svg
            alt: Deux voiliers convergent, vent venant de la droite, voiles portées du même côté. L’un est plus près du vent que l’autre.
            nom: Même bord
            lignes: [Celui au vent s’écarte]
      - regles:
          - Le vent vient du côté opposé à la grand-voile.
          - Dans le doute sur les amures de l’autre, bâbord amures s’écarte.

  - titre: Le rattrapant s’écarte toujours
    largeur: demie
    notions: [barre-rattrapant]
    blocs:
      - galerie:
          - visuel: situations/secteur-rattrapant.svg
            alt: Vue de dessus d’un navire et du secteur qui s’ouvre derrière lui, de part et d’autre, au-delà de 22,5 degrés sur l’arrière de son travers.
            nom: Le secteur
            lignes: [Plus de 22,5° sur l’arrière du travers]
          - visuel: situations/tu-rattrapes.svg
            alt: Vue de dessus. Ton bateau gagne sur un navire à moteur plus lent qui le précède, légèrement sur sa droite.
            nom: Tu rattrapes
            lignes: [Tu t’écartes]
          - visuel: situations/tu-es-rattrape.svg
            alt: Vue de dessus. Un navire arrive derrière ton bateau et gagne sur lui.
            nom: Tu es rattrapé
            lignes: [Tu maintiens]
      - regles:
          - Dans le doute, tu te considères comme rattrapant, jusqu’à être paré et clair.
      - piege: >-
          « La voile est prioritaire » est faux ici : le voilier qui rattrape s’écarte.

  - titre: La hiérarchie entre navires
    largeur: demie
    notions: [barre-hierarchie-privileges]
    blocs:
      - schema:
          fichier: barre-route-hierarchie.svg
          alt: >-
            Une échelle de six cases numérotées de 1 à 6, du navire non maître de sa manœuvre au navire à
            propulsion mécanique. Une flèche monte le long de l’échelle.
      - piege: >-
          La hiérarchie ne joue qu’en mer libre, entre navires en vue : les règles 9, 10 et 13 passent devant.

  - titre: Par visibilité réduite
    largeur: demie
    notions: [barre-visibilite-reduite]
    blocs:
      - schema:
          fichier: barre-route-visibilite-reduite.svg
          alt: >-
            Vue de dessus. Un navire fait route vers le haut, une ligne pointillée le coupe par le travers.
            Un point devant à droite et un point derrière à droite figurent des échos. Deux flèches courbes
            barrées de rouge partent du navire, l’une vers la gauche, l’autre vers le point arrière.
      - regles:
          - Vitesse de sécurité, machine prête à manœuvrer. Personne n’est privilégié.
          - "Écho radar avant du travers : pas sur bâbord, sauf si on rattrape. Par le travers ou sur l’arrière : pas vers lui."
          - Signal de brume sur l’avant du travers, vitesse au minimum, extrême précaution.
      - piege: >-
          « Je le vois au radar » n’est pas « en vue » : aucune priorité.

meta:
