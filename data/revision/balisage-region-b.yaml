cours: balisage-region-b
resume: >-
  Une seule chose change en région B : la couleur des marques latérales. Les formes, le sens conventionnel
  et toutes les autres marques restent les mêmes.
sections:
  - titre: Bâbord vert, tribord rouge, le sens reste le même
    notions: [region-b-lateral]
    blocs:
      - schema:
          fichier: balisage-region-b-chenal.svg
          alt: >-
            Un chenal vu du ciel, du large en bas au port en haut. À gauche, trois bouées vertes
            cylindriques ; à droite, trois bouées rouges coniques. Une flèche monte vers le port.
      - tableau:
          colonnes: [Marque, Couleur, Forme]
          lignes:
            - - visuel: balisage/laterale-babord-region-b.svg
                alt: Une bouée à corps vert, de forme cylindrique, surmontée d’un voyant en cylindre vert.
              - Bâbord, vert
              - Cylindre, voyant cylindrique
            - - visuel: balisage/laterale-tribord-region-b.svg
                alt: Une bouée à corps rouge, de forme conique, surmontée d’un voyant en cône rouge pointe en haut.
              - Tribord, rouge
              - Cône, voyant conique
      - regles:
          - "Le sens conventionnel va du large vers le port : en rentrant, tu laisses le vert à gauche et le rouge à droite."
      - astuce: >-
          Si tu doutes de la couleur, la forme te remet dans le bon sens.
      - piege: >-
          La question se joue sur un seul mot, la couleur. Formes, voyants et sens conventionnel sont
          identiques.

  - titre: Quelles côtes sont en région B
    largeur: demie
    notions: [region-b-lateral]
    blocs:
      - regles:
          - "Région B : Saint-Pierre-et-Miquelon, Guyane, Martinique, Guadeloupe. On y navigue sans quitter la France."
          - "Région A : France métropolitaine, Mayotte, la Réunion, Wallis-et-Futuna, Nouvelle-Calédonie, Polynésie française, TAAF."

  - titre: Le reste ne change pas
    largeur: demie
    notions: [region-b-invariants]
    blocs:
      - schema:
          fichier: balisage-region-b-invariants.svg
          alt: >-
            Sept bouées en ligne. Cinq à gauche, une cardinale noire et jaune, un danger isolé, des eaux
            saines, une spéciale jaune, un danger nouveau bleu et jaune. À droite, une bouée verte
            cylindrique et une bouée rouge conique.
      - piege: >-
          Une cardinale ou un danger isolé en région B ne se contourne pas à l’envers. Il n’y a rien à
          inverser, seules les latérales changent.

meta:
  cree_le: '2026-10-31'
  genere_par: claude
