id: ecluses-0006
option: cotier
theme: ecluses
notion: ecluses-passage
statut: publie
difficulte: 1
enonce: >-
  Dans quel état doivent être les ancres de ton bateau à l'intérieur d'une écluse ?
propositions:
  - id: a
    texte: Mouillées, pour tenir le bateau pendant le remplissage
  - id: b
    texte: En position complètement relevée
  - id: c
    texte: Prêtes à mouiller, pendues au davier
reponses:
  - b
explication: >-
  Dans une écluse, les ancres doivent être complètement relevées. Une ancre qui pend
  accroche le radier, le seuil ou les dispositifs de protection. C'est pareil dans les
  garages, tant que les ancres n'y servent pas. Les défenses sont aussi obligatoires, et
  flottantes quand elles sont amovibles.
sources:
  - texte: Code des transports, article A. 4241-53-30
    ref: rgpni-ecluses
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
