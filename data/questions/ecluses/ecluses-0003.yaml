id: ecluses-0003
option: cotier
theme: ecluses
statut: publie
difficulte: 1
enonce: >-
  Tu arrives à une écluse dont aucun feu n'est allumé et qui ne porte aucun panneau. Que
  fais-tu ?
propositions:
  - id: a
    texte: Tu entres, l'absence de signal vaut autorisation
  - id: b
    texte: Tu entres si aucun autre bateau ne se présente
  - id: c
    texte: 'Tu n''entres pas : sans feu ni panneau, l''accès est interdit, sauf ordre
      du personnel de l''écluse'
  - id: d
    texte: Tu entres après avoir émis un son prolongé au sifflet
reponses:
  - c
explication: >-
  Le règlement retourne l'intuition : l'absence de signal n'est pas une permission, c'est
  une interdiction. Sans feux et sans panneaux, l'accès comme la sortie des écluses sont
  interdits, et seul un ordre spécial du personnel chargé de la manœuvre, éventuellement
  donné par un système électronique du gestionnaire, permet de passer.
sources:
  - texte: Code des transports, article A. 4241-53-31, 4
    ref: rgpni-ecluses
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-04'
