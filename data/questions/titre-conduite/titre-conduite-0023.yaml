id: titre-conduite-0023
option: cotier
theme: titre-conduite
notion: titre-obligation
statut: publie
difficulte: 2
enonce: >-
  Tu as dix-sept ans et aucun titre de conduite. Dans lequel de ces cadres le décret te
  permet-il de piloter un véhicule nautique à moteur ?
propositions:
  - id: a
    texte: Seul, dès lors que tu restes à moins d'un mille d'un abri
  - id: b
    texte: Seul, de jour, dans la bande des 300 mètres du rivage
  - id: c
    texte: En initiation ou en randonnée encadrée par un moniteur diplômé
  - id: d
    texte: Aucun, il te faut attendre tes dix-huit ans
reponses:
  - c
explication: >-
  L'article 10 permet aux personnes de plus de seize ans qui ne sont pas titulaires d'un
  titre de conduite de pratiquer l'initiation à la conduite des véhicules nautiques à
  moteur, et la randonnée à bord de ces véhicules encadrée par un moniteur diplômé, selon
  des dispositions fixées par arrêté. Ce qui ouvre la conduite, c'est l'encadrement, pas
  une distance au rivage ni l'heure du jour. Et rien n'oblige à attendre dix-huit ans.
sources:
  - texte: Décret n° 2007-1167 du 2 août 2007, article 10
    ref: decret-2007-1167
