id: titre-conduite-0010
option: cotier
theme: titre-conduite
notion: titre-sanctions
statut: publie
difficulte: 2
enonce: >-
  Pour quels motifs un permis de conduire les bateaux de plaisance peut-il être retiré
  ?
propositions:
  - id: a
    texte: L'inobservation des règlements de police de la circulation
  - id: b
    texte: La conduite en état d'ébriété ou après consommation de stupéfiants
  - id: c
    texte: Le défaut d'assurance du bateau au moment du contrôle
  - id: d
    texte: Le défaut de présentation immédiate du permis lors d'un contrôle
reponses:
  - a
  - b
explication: >-
  Le décret énumère trois familles de motifs : l'inobservation des règlements de police
  afférents à la circulation en eaux maritimes ou intérieures ; la négligence ou
  l'imprudence grave de nature à compromettre la sécurité du conducteur, des passagers ou
  des tiers ; et la conduite en état d'ébriété ou après consommation de stupéfiants.
  L'assurance n'y figure pas, et ne pas présenter ses pièces sur place est autre chose : une
  contravention de la 2e classe, article 18 du même décret, pas un motif de retrait.
sources:
  - texte: Décret n° 2007-1167 du 2 août 2007, article 6
    ref: decret-2007-1167
  - texte: Décret n° 2007-1167 du 2 août 2007, article 18
    ref: decret-2007-1167
