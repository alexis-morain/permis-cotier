id: titre-conduite-0010
option: cotier
theme: titre-conduite
statut: publie
difficulte: 2
enonce: >-
  Pour quels motifs un permis de conduire les bateaux de plaisance peut-il être retiré
  ?
propositions:
  - id: a
    texte: L'inobservation des règlements de police de la circulation en eaux maritimes
      ou intérieures
  - id: b
    texte: La conduite en état d'ébriété ou après consommation de stupéfiants
  - id: c
    texte: Le défaut d'assurance du bateau
  - id: d
    texte: L'absence de visite technique annuelle
reponses:
  - a
  - b
explication: >-
  Le décret énumère trois familles de motifs : l'inobservation des règlements de police
  afférents à la circulation en eaux maritimes ou intérieures ; la négligence ou l'imprudence
  grave de nature à compromettre la sécurité du conducteur, des passagers ou des tiers
  ; et la conduite en état d'ébriété ou après consommation de stupéfiants. Ni l'assurance
  ni une visite technique n'y figurent : ce sont d'autres obligations, qui ne se sanctionnent
  pas par le retrait du titre.
sources:
  - texte: Décret n° 2007-1167 du 2 août 2007, article 6
    ref: decret-2007-1167
meta:
