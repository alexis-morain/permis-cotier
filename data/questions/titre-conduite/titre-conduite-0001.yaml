id: titre-conduite-0001
option: cotier
theme: titre-conduite
notion: titre-examen
statut: publie
difficulte: 2
enonce: >-
  Tu passes l'épreuve théorique de l'option « côtière », qui comporte quarante questions.
  Combien d'erreurs sont admises ?
propositions:
  - id: a
    texte: Trois erreurs.
  - id: b
    texte: Cinq erreurs.
  - id: c
    texte: Six erreurs.
reponses:
  - b
explication: >-
  L'épreuve théorique de l'option « côtière » compte quarante questions, avec cinq erreurs
  admises. Au delà de cinq réponses fausses, elle est manquée. Le piège tient aux valeurs
  voisines : trois ou six erreurs sonnent plausible, mais seul cinq est correct.
sources:
  - texte: Arrêté du 28 septembre 2007, article 1, point 1.1
    ref: arrete-2007-09-28
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
