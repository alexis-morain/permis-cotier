id: titre-conduite-0006
option: cotier
theme: titre-conduite
notion: titre-obligation
statut: publie
difficulte: 2
enonce: >-
  Tu navigues en mer sur un voilier de 10 mètres équipé d'un moteur auxiliaire de 20 kilowatts.
  Te faut-il un permis ?
propositions:
  - id: a
    texte: Oui, le moteur auxiliaire dépasse 4,5 kilowatts, seuil du permis côtier
  - id: b
    texte: Non, en mer un voilier n'exige pas de permis, même avec un moteur auxiliaire
reponses:
  - b
explication: >-
  En eaux maritimes, conduire un bateau de plaisance à voile, même avec un moteur
  auxiliaire, n'exige pas de permis. La dispense tient au bateau, pas au mode de propulsion
  du moment : un voilier qui avance au moteur reste un voilier. Attention, un bateau à
  propulsion vélique dont le rapport entre voilure et masse est trop faible est classé
  bateau à moteur.
sources:
  - texte: Décret n° 2007-1167 du 2 août 2007, article 2
    ref: decret-2007-1167
