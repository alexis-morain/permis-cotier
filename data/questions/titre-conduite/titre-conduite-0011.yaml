id: titre-conduite-0011
option: cotier
theme: titre-conduite
notion: titre-conditions
statut: publie
difficulte: 2
enonce: >-
  Quelle est la durée minimale de la formation théorique en salle, en présence du formateur
  ?
propositions:
  - id: a
    texte: Trois heures
  - id: b
    texte: Cinq heures
  - id: c
    texte: Huit heures
reponses:
  - b
explication: >-
  La durée de formation théorique en salle et en présence du formateur, qui peut être
  collective, ne peut être inférieure à cinq heures. Les candidats déjà titulaires de
  l'option eaux intérieures, ou d'un titre équivalent, en sont dispensés : ils ont déjà
  suivi la partie commune du programme.
sources:
  - texte: Arrêté du 28 septembre 2007, article 1er, point 1.3
    ref: arrete-2007-09-28
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
