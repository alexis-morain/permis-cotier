id: environnement-0011
option: cotier
theme: environnement
notion: env-faune-flore
statut: publie
difficulte: 2
enonce: >-
  Tu pars pêcher pour le loisir. Quels moyens n'as-tu pas le droit de détenir à bord
  pour prendre du poisson ?
propositions:
  - id: a
    texte: Un fusil de chasse
  - id: b
    texte: Une eau de javel diluée versée dans les trous de rocher
  - id: c
    texte: Un casier à crustacés
reponses:
  - a
  - b
explication: >-
  L'article L. 945-4, I, 7° punit de 22 500 euros d'amende le fait de détenir à bord
  ou d'utiliser pour la pêche des explosifs, des armes à feu, des substances soporifiques
  ou toxiques de nature à détruire ou altérer les animaux, les végétaux marins et leur
  milieu. Le fusil de chasse est une arme à feu, la javel une substance toxique : les
  deux tombent sous la même règle, parce que l'un et l'autre tuent bien au-delà de la
  prise. Casier et ligne traînante sont des engins de pêche autorisés, encadrés ailleurs.
sources:
  - texte: Code rural et de la pêche maritime, article L. 945-4, I, 7°
    ref: peche-loisir
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
