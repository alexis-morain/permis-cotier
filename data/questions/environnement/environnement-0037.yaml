id: environnement-0037
option: cotier
theme: environnement
notion: env-peche-loisir
statut: publie
difficulte: 2
enonce: >-
  Tu viens de remonter un bar et tu veux vérifier qu'il a la taille. Entre quels points
  le mesures-tu ?
propositions:
  - id: a
    texte: De la pointe du museau à la naissance de la nageoire caudale
  - id: b
    texte: De l'œil à l'extrémité de la nageoire caudale
  - id: c
    texte: De la pointe du museau à l'extrémité de la nageoire caudale
reponses:
  - c
explication: >-
  L'annexe II de l'arrêté du 26 octobre 2012 rappelle la règle européenne : la taille d'un
  poisson se mesure de la pointe du museau à l'extrémité de la nageoire caudale, sur
  l'Atlantique comme en Méditerranée. On prend donc la longueur totale, queue comprise.
  Seuls les grands migrateurs comme le thon se mesurent autrement, à la fourche.
sources:
  - texte: Arrêté du 26 octobre 2012, annexe II, A. 1 et B. 1
    ref: arrete-2012-10-26
meta:
  cree_le: '2026-10-03'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-03'
