id: environnement-0004
option: cotier
theme: environnement
statut: publie
difficulte: 3
enonce: >-
  Tu pêches à la ligne depuis ton bateau de plaisance. Combien d'hameçons peux-tu mettre
  en action de pêche en même temps ?
propositions:
  - id: a
    texte: Douze au maximum sur l'ensemble des lignes, un leurre comptant pour un hameçon
  - id: b
    texte: Douze par ligne, sans limite du nombre de lignes
  - id: c
    texte: Trente, comme sur une palangre
  - id: d
    texte: Aucune limite, la restriction ne vise que les filets
reponses:
  - a
explication: >-
  La limite porte sur l'ensemble des lignes utilisées en action de pêche, pas sur chaque
  ligne : douze hameçons au total, un leurre équivalant à un hameçon. Un arrêté ministériel
  peut abaisser cette limite à cinq hameçons par personne dans les cas qu'il prévoit.
  À bord, sont par ailleurs seuls autorisés deux palangres de trente hameçons chacune,
  deux casiers, une foëne et une épuisette.
sources:
  - texte: Code rural et de la pêche maritime, article R. 921-88
    ref: peche-loisir
