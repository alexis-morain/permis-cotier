id: environnement-0038
option: cotier
theme: environnement
notion: env-peche-loisir
statut: publie
difficulte: 2
enonce: >-
  Tu ramasses des palourdes à marée basse. Sur quelle dimension se juge leur taille
  minimale ?
propositions:
  - id: a
    texte: Le poids de chaque coquillage
  - id: b
    texte: La plus grande dimension de la coquille
  - id: c
    texte: La largeur de la coquille à la charnière
reponses:
  - b
explication: >-
  Pour les mollusques bivalves, palourdes, coques, praires ou huîtres, l'annexe II de l'arrêté
  du 26 octobre 2012 retient la plus grande dimension de la coquille. On pose le coquillage
  dans sa plus grande longueur contre la règle. Le poids ne sert qu'à quelques espèces de
  l'annexe I, comme le poulpe.
sources:
  - texte: Arrêté du 26 octobre 2012, annexe II, A. 7 et B. 5
    ref: arrete-2012-10-26
meta:
  cree_le: '2026-10-03'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-03'
