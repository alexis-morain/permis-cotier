id: environnement-0021
option: cotier
theme: environnement
notion: env-aires-protegees
statut: publie
difficulte: 2
enonce: >-
  Lesquelles de ces zones le code de l'environnement range-t-il parmi les aires marines
  protégées ?
propositions:
  - id: a
    texte: Les parcs nationaux ayant une partie maritime
  - id: b
    texte: Les réserves naturelles ayant une partie maritime
  - id: c
    texte: Les zones de mouillage organisé des ports de plaisance
  - id: d
    texte: Les chenaux traversiers des plages
reponses:
  - a
  - b
explication: >-
  L'article L. 334-1 liste les aires marines protégées : parcs nationaux et réserves naturelles
  ayant une partie maritime, parcs naturels marins, sites Natura 2000 en mer, arrêtés
  de protection de biotope, et d'autres. Un mouillage organisé ou un chenal de plage n'en
  sont pas.
sources:
  - texte: Code de l'environnement, article L. 334-1
    ref: code-environnement
