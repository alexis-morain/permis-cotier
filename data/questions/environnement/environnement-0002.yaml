id: environnement-0002
option: cotier
theme: environnement
notion: env-peche-sous-marine
statut: publie
difficulte: 1
enonce: >-
  À partir de quel âge peut-on pratiquer la pêche sous-marine au fusil-harpon ?
propositions:
  - id: a
    texte: Douze ans
  - id: b
    texte: Seize ans
  - id: c
    texte: Dix-huit ans
reponses:
  - b
explication: >-
  L'exercice de la pêche sous-marine au moyen d'un fusil-harpon est interdit aux personnes
  âgées de moins de seize ans. La règle vise l'engin, pas la plongée : la chasse sans
  fusil et la simple apnée ne sont pas concernées par cette limite d'âge.
sources:
  - texte: Code rural et de la pêche maritime, article R. 921-90
    ref: peche-loisir
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
