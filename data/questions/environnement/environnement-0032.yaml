id: environnement-0032
option: cotier
theme: environnement
notion: env-peche-loisir
statut: publie
difficulte: 2
enonce: >-
  Tu prends un thon rouge en pêche de loisir. Quel minimum l'annexe I fixe-t-elle pour
  cette espèce ?
propositions:
  - id: a
    texte: 15 kg ou 100 cm
  - id: b
    texte: 30 kg ou 150 cm
  - id: c
    texte: 30 kg ou 115 cm
reponses:
  - c
explication: >-
  Le thon rouge est la seule espèce dont le minimum s'exprime en poids ou en longueur
  : 30 kg, ou 115 cm mesurés à la fourche. Cette valeur est la même sur toutes les façades.
  Un seul des deux chiffres ne suffit pas, c'est le couple qu'il faut retenir.
sources:
  - texte: Arrêté du 26 octobre 2012, annexe I, poissons
    ref: arrete-2012-10-26
meta:
  cree_le: '2026-10-03'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-03'
