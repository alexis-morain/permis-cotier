id: environnement-0027
option: cotier
theme: environnement
notion: env-peche-sous-marine
statut: publie
difficulte: 3
enonce: >-
  Ton neveu de quinze ans veut descendre en apnée ramasser des coquillages à la main,
  sans fusil. Le code rural et de la pêche maritime le lui interdit-il ?
propositions:
  - id: a
    texte: Non, l'interdiction avant seize ans ne vise que le fusil-harpon
  - id: b
    texte: Oui, toute pêche sous-marine est interdite avant seize ans
  - id: c
    texte: Oui, sauf si un adulte plonge avec lui
reponses:
  - a
explication: >-
  Le texte est écrit sur l'engin : « l'exercice de la pêche sous-marine au moyen d'un
  fusil-harpon est interdit aux personnes âgées de moins de seize ans ». Nager, descendre
  en apnée et remonter des coquillages à la main ne tombe pas sous cette limite d'âge.
  Le reste de la réglementation de la pêche de loisir, tailles et périodes, continue
  évidemment de s'appliquer.
sources:
  - texte: Code rural et de la pêche maritime, article R. 921-90
    ref: peche-loisir
meta:
  cree_le: '2026-09-08'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-09'
