id: environnement-0016
option: cotier
theme: environnement
notion: env-peche-loisir
famille: env-engins-electriques
statut: publie
difficulte: 3
enonce: >-
  Tu veux remonter tes lignes plus facilement. Quels engins électriques la pêche de loisir
  t'autorise-t-elle ?
propositions:
  - id: a
    texte: Trois moulinets électriques au plus, de 800 watts chacun au maximum
  - id: b
    texte: Un vire-casier électrique, de 800 watts au plus par navire
  - id: c
    texte: Aucun, les engins électriques sont tous interdits en pêche de loisir
reponses:
  - a
explication: >-
  Vire-casiers, vire-filets, treuils et potences mécanisées sont interdits à bord d'un
  bateau de pêche de loisir. Seuls sont admis les vire-lignes ou moulinets électriques,
  dans la limite de trois engins par navire d'une puissance maximale de 800 watts chacun.
sources:
  - texte: Code rural et de la pêche maritime, article R. 921-89
    ref: peche-loisir
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-10-02'
