id: environnement-0006
option: cotier
theme: environnement
statut: publie
difficulte: 2
enonce: >-
  Quel engin de pêche t'est autorisé à bord selon la façade maritime ?
propositions:
  - id: a
    texte: Une grappette à dents en Méditerranée
  - id: b
    texte: Un filet maillant calé ou un trémail de 50 mètres au plus en mer du Nord, Manche
      ou Atlantique
  - id: c
    texte: Deux filets de 100 mètres partout
  - id: d
    texte: Un chalut de fond de petite taille
reponses:
  - a
  - b
explication: >-
  Deux engins ne sont autorisés que sur une façade. La grappette à dents l'est en Méditerranée.
  Le filet maillant calé ou le trémail l'est en mer du Nord, en Manche et en Atlantique,
  dans la limite de 50 mètres de long et de 2 mètres de haut en pêche, et hors des estuaires
  en amont d'une limite fixée par arrêté. Le chalut, lui, n'est en aucun cas un engin
  de pêche de loisir.
sources:
  - texte: Code rural et de la pêche maritime, article R. 921-88
    ref: peche-loisir
