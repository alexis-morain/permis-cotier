id: environnement-0012
option: cotier
theme: environnement
notion: env-faune-flore
famille: env-peche-amende-22500
statut: publie
difficulte: 2
enonce: >-
  Une espèce est protégée sur ta zone pendant sa période de reproduction. Tu la pêches
  quand même, au loisir. Que risques-tu ?
propositions:
  - id: a
    texte: Rien, l'interdiction ne vise que les pêcheurs professionnels
  - id: b
    texte: Une amende de 22 500 euros
reponses:
  - b
explication: >-
  Pêcher certaines espèces dans une zone, à une profondeur ou à une période où leur pêche
  est interdite est puni de 22 500 euros d'amende, sans distinction entre loisir et
  professionnel. Piège : croire que ces fermetures ne concernent que les métiers. Elles
  protègent la ressource, donc tout le monde. Avant de partir, vérifie l'arrêté en vigueur
  sur ta façade.
sources:
  - texte: Code rural et de la pêche maritime, article L. 945-4, I, 3°
    ref: peche-loisir
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
