id: environnement-0012
option: cotier
theme: environnement
notion: env-faune-flore
statut: publie
difficulte: 2
enonce: >-
  Une espèce est protégée sur ta zone pendant sa période de reproduction. Tu la pêches
  quand même, au loisir. Que risques-tu ?
propositions:
  - id: a
    texte: Rien, l'interdiction ne vise que les pêcheurs professionnels
  - id: b
    texte: Une amende de 22 500 euros
  - id: c
    texte: Rien si tu remets le poisson à l'eau vivant
  - id: d
    texte: La confiscation de la prise, sans autre suite
reponses:
  - b
explication: >-
  L'article L. 945-4, I, 3° punit de 22 500 euros d'amende le fait de pêcher certaines
  espèces dans une zone, à une profondeur ou à une période où leur pêche est interdite.
  Le texte ne distingue pas le loisir du professionnel. Le piège est de croire que ces
  fermetures ne concernent que les métiers : elles protègent la ressource, donc tout
  le monde. Avant de partir, on vérifie l'arrêté en vigueur sur sa façade.
sources:
  - texte: Code rural et de la pêche maritime, article L. 945-4, I, 3°
    ref: peche-loisir
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-09-04'
