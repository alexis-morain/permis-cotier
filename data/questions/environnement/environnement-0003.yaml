id: environnement-0003
option: cotier
theme: environnement
notion: env-peche-loisir
statut: publie
difficulte: 2
enonce: >-
  Les tailles minimales de capture applicables au pêcheur de loisir sont-elles les mêmes
  que celles des professionnels ?
propositions:
  - id: a
    texte: Non, elles sont plus souples pour le pêcheur de loisir
  - id: b
    texte: Oui, et les règles propres à la pêche de loisir ne peuvent jamais être plus
      favorables
reponses:
  - b
explication: >-
  La pêche maritime de loisir est soumise aux mêmes dispositions que les professionnels
  pour la taille minimale des captures, les engins, les modes et procédés, ainsi que les
  zones, périodes et interdictions. Le ministre peut fixer par arrêté des règles propres
  à la pêche de loisir, mais le texte le borde : elles ne peuvent pas être plus favorables
  que celles des professionnels.
sources:
  - texte: Code rural et de la pêche maritime, article R. 921-84
    ref: peche-loisir
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
