id: environnement-0024
option: cotier
theme: environnement
notion: env-antisalissures
famille: env-rejet-amende-100000
statut: publie
difficulte: 3
enonce: >-
  Les 100 000 euros d'amende de l'article L. 218-73 sont-ils un plafond que rien ne peut
  dépasser ?
propositions:
  - id: a
    texte: Oui, c'est un maximum absolu, quel que soit le gain tiré de l'infraction
  - id: b
    texte: Non, le montant peut être porté jusqu'au double de l'avantage tiré de l'infraction
  - id: c
    texte: Non, le juge peut le porter au triple de l'amende, sans autre condition
reponses:
  - b
explication: >-
  Les 100 000 euros sont le montant de base, mais il peut être porté jusqu'au double de
  l'avantage tiré de l'infraction. Le plafond n'est donc pas absolu : le gain tiré de
  l'infraction peut le relever.
sources:
  - texte: Code de l'environnement, article L. 218-73
    ref: code-environnement
meta:
  cree_le: '2026-09-08'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
