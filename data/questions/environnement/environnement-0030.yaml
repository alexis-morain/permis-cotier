id: environnement-0030
option: cotier
theme: environnement
notion: env-peche-loisir
statut: publie
difficulte: 2
enonce: >-
  Tu pêches à la ligne en Manche et tu remontes un bar commun. Quelle taille doit-il atteindre
  pour que tu puisses le garder ?
propositions:
  - id: a
    texte: 30 cm
  - id: b
    texte: 42 cm
  - id: c
    texte: 36 cm
reponses:
  - b
explication: >-
  L'annexe I de l'arrêté du 26 octobre 2012 fixe à 42 cm la taille minimale du bar commun
  pour la pêche de loisir en mer du Nord, Manche et Atlantique. En dessous, le poisson
  doit être remis à l'eau. Le piège est la valeur de 30 cm, qui est celle du bar en Méditerranée,
  pas en Manche.
sources:
  - texte: Arrêté du 26 octobre 2012, annexe I, I. Mer du Nord, Manche, Atlantique
    ref: arrete-2012-10-26
meta:
  cree_le: '2026-10-03'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-03'
