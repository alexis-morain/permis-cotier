id: environnement-0018
option: cotier
theme: environnement
notion: env-rejets
statut: publie
difficulte: 2
enonce: >-
  Au large, une avarie de ton réservoir laisse échapper du carburant à la mer. Que dit
  le code de l'environnement ?
propositions:
  - id: a
    texte: Hors eaux territoriales, un rejet dû à une avarie n'est pas une infraction,
      sous conditions MARPOL
  - id: b
    texte: Tout rejet est puni, quelle qu'en soit la cause, avarie comprise, au large
      comme près de la côte
reponses:
  - a
explication: >-
  Au-delà des eaux territoriales, un rejet qui vient d'une avarie du navire ou de son
  équipement n'est pas une infraction, sous les conditions de la convention MARPOL. Le rejet
  volontaire, lui, reste puni.
sources:
  - texte: Code de l'environnement, article L. 218-20
    ref: code-environnement
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
