id: environnement-0036
option: cotier
theme: environnement
notion: env-peche-loisir
statut: publie
difficulte: 2
enonce: >-
  Tu pêches pour le loisir depuis ton bateau de plaisance français, mais tu es au large
  d'un pays voisin. Les tailles minimales de capture françaises s'appliquent-elles encore ?
propositions:
  - id: a
    texte: Non, elles ne valent que dans les eaux françaises
  - id: b
    texte: Oui, elles suivent tout navire de plaisance français, quelle que soit la zone
      de capture
  - id: c
    texte: Oui, mais seulement si le pays voisin n'a fixé aucune taille
reponses:
  - b
explication: >-
  L'article 1er de l'arrêté du 26 octobre 2012 dit qu'il s'applique aux navires de plaisance
  battant pavillon français quelle que soit la zone de capture, et aux navires étrangers dans
  les eaux françaises. Le pavillon emporte la règle avec lui. Le même article précise que des
  règles plus contraignantes, internationales ou locales, s'appliquent par-dessus.
sources:
  - texte: Arrêté du 26 octobre 2012, article 1er
    ref: arrete-2012-10-26
meta:
  cree_le: '2026-10-03'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-03'
