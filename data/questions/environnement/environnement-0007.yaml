id: environnement-0007
option: cotier
theme: environnement
notion: env-rejets
statut: publie
difficulte: 2
enonce: >-
  Tu vides à la mer un bidon de produit d'entretien. Que risques-tu ?
propositions:
  - id: a
    texte: Une amende de 100 000 euros
  - id: b
    texte: Une simple contravention de quatrième classe
  - id: c
    texte: Rien si le rejet a lieu au-delà de trois milles
reponses:
  - a
explication: >-
  Jeter, déverser ou laisser écouler en mer des substances nuisibles pour la conservation
  ou la reproduction des mammifères marins, poissons, crustacés, coquillages, mollusques
  ou végétaux, ou de nature à les rendre impropres à la consommation, est puni de 100
  000 euros d'amende, montant qui peut être porté au double de l'avantage tiré de l'infraction.
  L'interdiction ne connaît pas de seuil de distance.
sources:
  - texte: Code de l'environnement, article L. 218-73
    ref: code-environnement
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
