id: environnement-0028
option: cotier
theme: environnement
notion: env-peche-sous-marine
statut: publie
difficulte: 2
enonce: >-
  À quel régime la chasse sous-marine se rattache-t-elle ?
propositions:
  - id: a
    texte: À la pêche maritime de loisir, qui s'exerce notamment en action de nage ou de
      plongée
  - id: b
    texte: À un régime propre, distinct de la pêche de loisir
  - id: c
    texte: À la pêche professionnelle dès qu'un fusil-harpon est employé
reponses:
  - a
explication: >-
  La pêche maritime de loisir s'exerce soit depuis une embarcation, soit en action de
  nage ou de plongée, soit à pied sur le domaine public maritime. La chasse sous-marine
  est l'un de ces trois cas, pas une activité à part : tout ce qui vaut pour la pêche
  de loisir vaut pour elle.
sources:
  - texte: Code rural et de la pêche maritime, article R. 921-83, II
    ref: peche-loisir
meta:
  cree_le: '2026-09-08'
  genere_par: claude
  relu_par: claude
