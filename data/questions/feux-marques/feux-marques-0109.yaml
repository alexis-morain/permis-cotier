id: feux-marques-0109
option: cotier
theme: feux-marques
notion: feux-peche
famille: feux-chalut-erre
statut: publie
difficulte: 2
enonce: >-
  Ce chalutier a son chalut à l'eau. De nuit, il te montre ces feux, et aucun autre. Que
  peux-tu en dire ?
visuel:
  fichier: navires/chalutier-sans-erre-nuit.svg
  alt: Navire vu de face. Sur le mât, deux feux superposés, vert au-dessus, blanc en dessous. Aucun autre feu.
  credit: code
propositions:
  - id: a
    texte: Il a de l'erre et vient vers toi
  - id: b
    texte: Il a de l'erre et s'éloigne de toi
  - id: c
    texte: Il a remonté son chalut
  - id: d
    texte: Il n'a pas d'erre
reponses:
  - d
explication: >-
  La règle 26 b) iii) ne donne les feux de côté et le feu de poupe au chalutier que
  lorsqu'il a de l'erre. Le vert au-dessus du blanc reste seul : il est stoppé, chalut à
  l'eau. Le piège est l'inverse : un chalutier qui a remonté son chalut ne montre plus ces
  deux feux, mais ceux d'un navire de sa longueur (règle 26 e).
sources:
  - texte: RIPAM, règle 26 b) iii)
    ref: decret-77-733
meta:
  cree_le: '2026-10-02'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-02'
