id: feux-marques-0021
option: cotier
theme: feux-marques
notion: feux-voile-aviron
statut: publie
difficulte: 2
enonce: >-
  Tu fais route à la voile avec ton moteur en marche : que montres-tu à l'avant ?
propositions:
  - id: a
    texte: Une marque de forme conique, la pointe en bas.
  - id: b
    texte: Une marque de forme conique, la pointe en haut.
  - id: c
    texte: Une marque de forme sphérique.
  - id: d
    texte: Deux marques coniques opposées par la pointe.
reponses:
  - a
explication: >-
  La règle 25 e) impose au navire qui fait route à la fois à la voile et au moyen de son
  appareil propulsif de montrer à l'avant, à l'endroit le plus visible, une marque de
  forme conique la pointe en bas. Le sens du cône est tout le piège : pointe en bas, et
  non pointe en haut. Cette marque prévient les autres que, malgré la voilure, tu es tenu
  aux règles du navire à propulsion mécanique.
sources:
  - texte: RIPAM, règle 25 e)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-04'
