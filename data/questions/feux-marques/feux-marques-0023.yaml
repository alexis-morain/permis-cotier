id: feux-marques-0023
option: cotier
theme: feux-marques
notion: feux-manoeuvre-restreinte
statut: publie
difficulte: 2
enonce: >-
  De jour, quelles marques superposées montre un navire à capacité de manœuvre restreinte
  ?
propositions:
  - id: a
    texte: Une boule, un bicône, une boule
  - id: b
    texte: Un bicône, une boule, un bicône
  - id: c
    texte: Trois boules
  - id: d
    texte: Deux boules
reponses:
  - a
explication: >-
  La règle 27 b) ii) prescrit trois marques superposées, les marques supérieure et inférieure
  étant des boules et celle du milieu un bicône. C'est la transposition de jour des trois
  feux rouge, blanc, rouge du paragraphe b) i). Deux boules seules désignent le navire
  qui n'est pas maître de sa manœuvre, et trois boules le navire qui effectue des opérations
  de déminage.
sources:
  - texte: RIPAM, règle 27 b) ii)
    ref: decret-77-733
