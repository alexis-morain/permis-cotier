id: feux-marques-0023
option: cotier
theme: feux-marques
notion: feux-manoeuvre-restreinte
famille: feux-capacite-restreinte-marques
statut: publie
difficulte: 2
enonce: >-
  De jour, quelles marques superposées montre un navire à capacité de manœuvre restreinte
  ?
propositions:
  - id: a
    texte: Une boule, un bicône, une boule
  - id: b
    texte: Un bicône, une boule, un bicône
  - id: c
    texte: Trois boules
  - id: d
    texte: Deux boules
reponses:
  - a
explication: >-
  De jour, le navire à capacité de manœuvre restreinte montre trois marques superposées :
  une boule, un bicône, une boule. C'est la transposition des trois feux rouge, blanc, rouge
  de nuit. Deux boules désignent le navire qui n'est pas maître de sa manœuvre, trois boules
  superposées le navire échoué. Les trois boules du déminage ne sont pas superposées : une
  en tête du mât de misaine, une à chaque extrémité de sa vergue.
sources:
  - texte: RIPAM, règle 27 b) ii)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
