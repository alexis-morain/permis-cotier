id: feux-marques-0038
option: cotier
theme: feux-marques
notion: feux-mouillage-echoue
statut: publie
difficulte: 2
enonce: >-
  De nuit, tu relèves un navire immobile qui ne montre que ce feu, à l'endroit le plus
  visible. Que peux-tu en dire ?
visuel:
  fichier: feux/au-mouillage-moins-de-50-m.svg
  alt: "Un feu blanc seul, visible sur tout l'horizon."
  credit: code
propositions:
  - id: a
    texte: Il est au mouillage et sa longueur est inférieure à 50 mètres
  - id: b
    texte: Il est au mouillage et sa longueur atteint ou dépasse 50 mètres
  - id: c
    texte: Il est au mouillage et sa longueur est inférieure à 7 mètres
  - id: d
    texte: Il fait route au moteur, sa longueur étant inférieure à 7 mètres et sa vitesse
      maximale ne dépassant pas 7 nœuds
reponses:
  - a
explication: >-
  Un navire au mouillage montre en principe deux feux blancs visibles sur tout l'horizon,
  l'un à l'avant, l'autre plus bas à l'arrière. En dessous de 50 mètres, il peut se contenter
  d'un seul feu blanc à l'endroit le plus visible : ce feu unique te renseigne donc à
  la fois sur ce qu'il fait et sur sa taille. Le seuil de 7 mètres est celui d'une tout
  autre exemption, qui dispense de montrer un feu de mouillage, sauf dans un chenal étroit,
  une voie d'accès, un ancrage ou sur une route fréquentée. Un navire échoué d'au moins
  12 mètres ajoute à ce feu blanc deux feux rouges superposés. Quant au navire à propulsion
  mécanique de moins de 7 mètres ne dépassant pas 7 nœuds, il montre bien lui aussi ce
  feu blanc seul : c'est l'immobilité qui te dit lequel des deux tu as devant toi.
sources:
  - texte: RIPAM, règle 30 b)
    ref: decret-77-733
  - texte: RIPAM, règle 30 a), d) et e)
    ref: decret-77-733
  - texte: RIPAM, règle 23 d) ii)
    ref: decret-77-733
