id: feux-marques-0112
option: cotier
theme: feux-marques
notion: feux-remorquage
famille: feux-remorque-200
statut: publie
difficulte: 2
enonce: >-
  De nuit, ce navire fait route et te montre ces feux. Que peux-tu en dire ?
visuel:
  fichier: navires/remorqueur-nuit.svg
  alt: Navire vu de son flanc gauche, l'avant à gauche, un câble tendu part de l'arrière vers la droite. Trois feux blancs superposés en haut du mât, un feu rouge sur le côté.
  credit: code
propositions:
  - id: a
    texte: Il remorque un train de 200 mètres au plus
  - id: b
    texte: Il fait route au moteur et mesure 50 mètres ou plus
  - id: c
    texte: Sa capacité de manœuvre est restreinte
  - id: d
    texte: Il remorque un train de plus de 200 mètres
reponses:
  - d
explication: >-
  Le navire qui remorque montre des feux de tête de mât superposés au lieu d'un seul,
  règle 24 a) i) : deux, et trois lorsque le train de remorque dépasse 200 mètres. Compte
  les blancs : ils sont trois. Le piège est le navire de 50 mètres et plus, dont les deux
  feux de tête de mât sont sur deux mâts, l'arrière plus haut.
sources:
  - texte: RIPAM, règle 24 a) i)
    ref: decret-77-733
meta:
  cree_le: '2026-10-02'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-02'
