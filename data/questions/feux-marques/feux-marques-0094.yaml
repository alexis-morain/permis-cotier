id: feux-marques-0094
option: cotier
theme: feux-marques
notion: feux-tirant-eau
famille: feux-tirant-eau-cylindre
statut: publie
difficulte: 2
enonce: >-
  De jour, ce navire porte cette marque. Que t'indique-t-elle ?
visuel:
  fichier: navires/tirant-d-eau-jour.svg
  alt: "Long navire vu de son flanc gauche, l'avant à gauche. Sur le mât avant, un cylindre noir dressé."
  credit: code
propositions:
  - id: a
    texte: Qu'il est handicapé par son tirant d'eau
  - id: b
    texte: Qu'il est au mouillage
  - id: c
    texte: Qu'il remorque un train de plus de 200 mètres
  - id: d
    texte: Que sa capacité de manœuvre est restreinte
reponses:
  - a
explication: >-
  La règle 28 permet au navire handicapé par son tirant d'eau de montrer une marque cylindrique à l'endroit le plus visible. C'est une faculté, pas une obligation : son absence ne prouve rien. Le piège est de prendre le cylindre pour une boule, celle du mouillage, ou pour un bicône, celui d'un long train de remorque.
sources:
  - texte: RIPAM, règle 28
    ref: decret-77-733
meta:
  cree_le: '2026-10-02'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-10-02'
