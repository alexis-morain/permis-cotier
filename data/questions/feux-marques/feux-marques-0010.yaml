id: feux-marques-0010
option: cotier
theme: feux-marques
notion: feux-moteur-route
statut: publie
difficulte: 2
enonce: >-
  Tu fais route au moteur sur un navire de 18 mètres : que dit la règle du second feu
  de tête de mât ?
propositions:
  - id: a
    texte: Il est obligatoire dès que le navire dépasse 12 mètres.
  - id: b
    texte: Il n'est pas obligatoire, mais le navire peut le montrer.
  - id: c
    texte: Il est interdit en dessous de 50 mètres de longueur.
  - id: d
    texte: Il remplace le feu de poupe quand le navire fait route.
reponses:
  - b
explication: >-
  La règle 23 a) ii) impose un second feu de tête de mât, placé à l'arrière du premier
  et plus haut que lui, mais elle dispense de ce feu les navires de longueur inférieure
  à 50 mètres, qui restent libres de le montrer. Un navire de 18 mètres est donc en dessous
  du seuil : le feu est facultatif. Le piège est de retenir le seuil de 12 mètres, qui
  appartient à une autre disposition de la règle, ou de lire la dispense comme une interdiction.
sources:
  - texte: RIPAM, règle 23 a) ii)
    ref: decret-77-733
