id: feux-marques-0118
option: cotier
theme: feux-marques
notion: feux-peche
famille: feux-peche-hors-chalut
statut: publie
difficulte: 3
enonce: >-
  De nuit, ce navire pêche au mouillage, son engin à moins de 150 mètres. Il te montre ces feux, et aucun autre. Que peux-tu en dire ?
visuel:
  fichier: navires/peche-mouillage-nuit.svg
  alt: Navire vu de son flanc gauche, l'avant à gauche. Sur le mât, deux feux superposés, rouge au-dessus, blanc en dessous. Aucun autre feu.
  credit: code
propositions:
  - id: a
    texte: Ses feux sont complets
  - id: b
    texte: Il lui manque son feu blanc de mouillage
  - id: c
    texte: Il lui manque ses feux de côté
  - id: d
    texte: Il montre les feux d'un chalutier, pas ceux de sa pêche
reponses:
  - a
explication: >-
  En pêche, le navire qui fait route ou qui est au mouillage ne montre que les feux de la
  règle 26, règle 26 a). Hors chalut, ce sont un rouge au-dessus d'un blanc, 26 c) i), et
  rien d'autre sans erre tant que l'engin ne s'étend pas à plus de 150 mètres, 26 c) ii). Le piège est le feu de mouillage de la règle 30, qu'il n'ajoute
  pas ; le chalutier montrerait un vert au-dessus du blanc.
sources:
  - texte: RIPAM, règle 26 a)
    ref: decret-77-733
meta:
  cree_le: '2026-10-02'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-10-02'
