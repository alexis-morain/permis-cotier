id: feux-marques-0113
option: cotier
theme: feux-marques
notion: feux-remorquage
famille: feux-remorque-200
statut: publie
difficulte: 2
enonce: >-
  Tu croises de nuit ce navire qui fait route. Que t'apprennent ses feux ?
visuel:
  fichier: navires/remorqueur-court-nuit.svg
  alt: Navire vu de son flanc gauche, l'avant à gauche, un câble tendu part de l'arrière vers la droite. Deux feux blancs superposés en haut du mât, un feu rouge sur le côté.
  credit: code
propositions:
  - id: a
    texte: Il remorque un train de plus de 200 mètres
  - id: b
    texte: Il remorque un train de 200 mètres au plus
  - id: c
    texte: Il fait route au moteur et mesure 50 mètres ou plus
  - id: d
    texte: Il n'est pas maître de sa manœuvre
reponses:
  - b
explication: >-
  La règle 24 a) i) donne au navire qui remorque deux feux de tête de mât superposés,
  trois si le train de remorque dépasse 200 mètres. Ici deux blancs sur le même mât, et le
  câble à l'arrière : la remorque fait 200 mètres au plus. Le piège est le navire de 50
  mètres et plus : ses deux feux de tête de mât sont sur deux mâts, celui de l'arrière
  plus haut, pas l'un au-dessus de l'autre.
sources:
  - texte: RIPAM, règle 24 a) i)
    ref: decret-77-733
meta:
  cree_le: '2026-10-02'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-10-02'
