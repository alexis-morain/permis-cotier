id: feux-marques-0116
option: cotier
theme: feux-marques
notion: feux-mouillage-echoue
famille: feux-mouillage-50-m
statut: publie
difficulte: 2
enonce: >-
  De nuit, tu longes ce navire, qui ne montre pas d'autre feu. Que peux-tu en dire ?
visuel:
  fichier: navires/mouillage-50-m-nuit.svg
  alt: Long navire vu de son flanc gauche, l'avant à gauche. Un feu blanc haut à l'avant, un feu blanc plus bas à l'arrière. Aucun autre feu.
  credit: code
propositions:
  - id: a
    texte: Il fait route au moteur
  - id: b
    texte: Il est échoué
  - id: c
    texte: Il est au mouillage, mais ses deux feux sont inversés
  - id: d
    texte: Il est au mouillage
reponses:
  - d
explication: >-
  Au mouillage, la règle 30 a) donne un feu blanc visible sur tout l'horizon à l'avant, et
  un second à l'arrière, plus bas. Le feu le plus haut est donc à l'avant, et c'est ce que
  tu vois. Le piège est le navire à moteur qui fait route : son second feu de tête de mât
  est à l'arrière et plus haut (règle 23 a) ii), et il montrerait ses feux de côté.
sources:
  - texte: RIPAM, règle 30 a)
    ref: decret-77-733
meta:
  cree_le: '2026-10-02'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-02'
