id: feux-marques-0045
option: cotier
theme: feux-marques
notion: feux-portee
statut: publie
difficulte: 2
enonce: >-
  Ton bateau mesure 8 mètres. Quelle portée minimale la règle 22 impose-t-elle à son feu
  de poupe ?
propositions:
  - id: a
    texte: 2 milles
  - id: b
    texte: 1 mille
  - id: c
    texte: 3 milles
reponses:
  - a
explication: >-
  Pour un navire de moins de 12 mètres, le feu de poupe, le feu de tête de mât et les
  feux visibles sur tout l'horizon portent 2 milles. Seuls les feux de côté se contentent
  d'un mille.
sources:
  - texte: RIPAM, règle 22 c)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-09-05'
