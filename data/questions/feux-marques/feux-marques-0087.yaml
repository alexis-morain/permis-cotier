id: feux-marques-0087
option: cotier
theme: feux-marques
notion: feux-mouillage-echoue
statut: publie
difficulte: 2
enonce: >-
  Ton voilier de 10 mètres est au mouillage de nuit, feu de mouillage allumé. Peux-tu
  aussi éclairer ton pont avec tes feux de travail ?
propositions:
  - id: a
    texte: Non, cet éclairage est réservé aux navires de 100 mètres et plus
  - id: b
    texte: Non, il se confondrait avec ton feu de mouillage
  - id: c
    texte: Oui, tout navire au mouillage peut éclairer ses ponts
  - id: d
    texte: Oui, à condition d'éteindre ton feu de mouillage
reponses:
  - c
explication: >-
  La règle 30 c) permet à tout navire au mouillage d'utiliser ses feux de travail disponibles,
  ou des feux équivalents, pour illuminer ses ponts, et cela en outre des feux de mouillage :
  l'éclairage du pont s'ajoute au feu, il ne le remplace pas. Le seuil de 100 mètres
  marque une obligation, pas une réserve : à partir de cette longueur, illuminer les ponts
  devient obligatoire.
sources:
  - texte: RIPAM, règle 30 c)
    ref: decret-77-733
meta:
  cree_le: '2026-09-26'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-26'
