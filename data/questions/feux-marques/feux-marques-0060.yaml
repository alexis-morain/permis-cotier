id: feux-marques-0060
option: cotier
theme: feux-marques
notion: feux-pilote
statut: publie
difficulte: 2
enonce: >-
  Un bateau-pilote rentre à sa station, sans pilote à conduire. Quels feux montre-t-il
  ?
propositions:
  - id: a
    texte: Ceux d'un navire de sa longueur
  - id: b
    texte: Un feu blanc au-dessus d'un feu rouge, comme en service
  - id: c
    texte: Deux feux rouges superposés
reponses:
  - a
explication: >-
  Le feu blanc au-dessus du feu rouge n'est montré qu'en service de pilotage. Un bateau-pilote
  qui n'est pas en service montre les feux ou marques prescrits pour un navire de sa longueur.
sources:
  - texte: RIPAM, règle 29 b)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-09-05'
