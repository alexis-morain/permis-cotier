id: feux-marques-0011
option: cotier
theme: feux-marques
statut: publie
difficulte: 2
enonce: >-
  Un aéroglisseur exploité sans tirant d'eau fait route : quel feu montre-t-il en plus
  des feux d'un navire à propulsion mécanique ?
propositions:
  - id: a
    texte: Un feu jaune à éclats visible sur tout l'horizon.
  - id: b
    texte: Un feu rouge à éclats de forte intensité visible sur tout l'horizon.
  - id: c
    texte: Un feu blanc à éclats visible sur tout l'horizon.
  - id: d
    texte: Deux feux rouges superposés visibles sur tout l'horizon.
reponses:
  - a
explication: >-
  La règle 23 b) ajoute aux feux ordinaires du navire à propulsion mécanique un feu jaune
  à éclats visible sur tout l'horizon, dès lors que l'aéroglisseur est exploité sans tirant
  d'eau. Le feu rouge à éclats de forte intensité appartient au paragraphe suivant, celui
  du navion qui décolle, atterrit ou vole près de la surface : c'est la confusion que
  tendent les distracteurs.
sources:
  - texte: RIPAM, règle 23 b)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-04'
