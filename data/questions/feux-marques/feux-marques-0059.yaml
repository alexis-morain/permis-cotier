id: feux-marques-0059
option: cotier
theme: feux-marques
notion: feux-tirant-eau
statut: publie
difficulte: 2
enonce: >-
  De jour, quelle marque peut montrer un navire handicapé par son tirant d'eau ?
propositions:
  - id: a
    texte: Un cylindre
  - id: b
    texte: Une boule
  - id: c
    texte: Un bicône
reponses:
  - a
explication: >-
  Le navire handicapé par son tirant d'eau peut montrer, outre ses feux de navire à propulsion
  mécanique, trois feux rouges superposés de nuit ou une marque cylindrique de jour. La
  boule est la marque du mouillage ; le bicône, deux cônes réunis par la base, celle d'un
  train de remorque de plus de 200 mètres (règle 24). La pêche montre deux cônes réunis par
  la pointe (règle 26), ce qui n'est pas un bicône.
sources:
  - texte: RIPAM, règle 28
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-02'
