id: feux-marques-0058
option: cotier
theme: feux-marques
notion: feux-manoeuvre-restreinte
statut: publie
difficulte: 2
enonce: >-
  Un navire montre deux feux rouges superposés. Est-ce un appel à l'assistance ?
propositions:
  - id: a
    texte: Non, les signaux de la règle 27 ne sont pas des signaux de détresse
  - id: b
    texte: Oui, deux feux rouges signifient toujours une détresse
reponses:
  - a
explication: >-
  La règle 27 h) le dit expressément : les signaux qu'elle prescrit ne sont pas des signaux
  de navires en détresse et demandant assistance. Un navire non maître de sa manœuvre
  demande qu'on s'écarte de lui, pas qu'on vienne à son secours. Les signaux de détresse
  sont à l'annexe IV.
sources:
  - texte: RIPAM, règle 27 h)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-05'
