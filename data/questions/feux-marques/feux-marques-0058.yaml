id: feux-marques-0058
option: cotier
theme: feux-marques
notion: feux-manoeuvre-restreinte
statut: publie
difficulte: 2
enonce: >-
  Un navire montre ces feux. Est-ce un appel à l'assistance ?
visuel:
  fichier: feux/non-maitre-de-sa-manoeuvre.svg
  alt: "Deux feux rouges superposés visibles sur tout l'horizon."
  credit: code
propositions:
  - id: a
    texte: Non, les signaux de la règle 27 ne sont pas des signaux de détresse
  - id: b
    texte: Oui, deux feux rouges signifient toujours une détresse
reponses:
  - a
explication: >-
  Non : un navire non maître de sa manœuvre demande qu'on s'écarte de lui, pas qu'on vienne
  à son secours. Ces signaux ne sont pas des signaux de détresse, qui forment une liste à
  part.
sources:
  - texte: RIPAM, règle 27 h)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-13'
