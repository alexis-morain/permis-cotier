id: feux-marques-0074
option: cotier
theme: feux-marques
notion: feux-portee
statut: publie
difficulte: 1
enonce: >-
  Les portées prescrites pour chaque feu, ce sont des distances de quelle nature ?
propositions:
  - id: a
    texte: Des distances minimales de visibilité
  - id: b
    texte: Des distances maximales de visibilité
reponses:
  - a
explication: >-
  Les feux doivent avoir l'intensité voulue pour être visibles aux distances minimales
  indiquées. C'est un plancher, pas un plafond : rien n'interdit qu'un feu se voie de plus
  loin par bonne visibilité, et rien ne garantit qu'il se voie de si loin par temps de
  brume.
sources:
  - texte: RIPAM, règle 22
    ref: decret-77-733
meta:
  cree_le: '2026-09-21'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-13'
