id: feux-marques-0041
option: cotier
theme: feux-marques
notion: feux-definitions
statut: publie
difficulte: 1
enonce: >-
  De quelle couleur est le feu de poupe, et où est-il placé ?
propositions:
  - id: a
    texte: Blanc, aussi près que possible de la poupe
  - id: b
    texte: Jaune, aussi près que possible de la poupe
  - id: c
    texte: Blanc, au sommet du mât
reponses:
  - a
explication: >-
  Le feu de poupe est un feu blanc placé aussi près que possible de la poupe, qui éclaire
  un arc de 135 degrés, soit 67,5 degrés de chaque bord à partir de l'arrière. Le feu
  jaune de mêmes caractéristiques est le feu de remorquage.
sources:
  - texte: RIPAM, règle 21 c)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-09-05'
