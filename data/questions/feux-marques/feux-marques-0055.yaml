id: feux-marques-0055
option: cotier
theme: feux-marques
notion: feux-manoeuvre-restreinte
famille: feux-capacite-restreinte-rythme
statut: publie
difficulte: 3
enonce: >-
  De nuit, cette drague au travail te montre ces feux. De quel côté passes-tu ?
visuel:
  fichier: navires/dragueur-nuit.svg
  alt: "Navire vu de face. En haut du mât un feu blanc, sous lui trois feux superposés, rouge, blanc puis rouge. Au bout d'une vergue, deux feux verts superposés à gauche, deux feux rouges superposés à droite. Plus bas, un feu vert à gauche et un feu rouge à droite."
  credit: code
propositions:
  - id: a
    texte: Du côté des deux feux verts
  - id: b
    texte: Du côté des deux feux rouges
  - id: c
    texte: Par l'arrière, au plus près
reponses:
  - a
explication: >-
  Un navire à capacité de manœuvre restreinte qui drague ou effectue des travaux sous-marins
  montre deux feux rouges, ou deux boules, du côté où se trouve l'obstruction, et deux
  feux verts, ou deux bicônes, du côté où un autre navire peut passer.
sources:
  - texte: RIPAM, règle 27 d)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-10-02'
