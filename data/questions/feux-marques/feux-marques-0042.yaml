id: feux-marques-0042
option: cotier
theme: feux-marques
notion: feux-definitions
statut: publie
difficulte: 2
enonce: >-
  Le brouillard tombe en plein après-midi. Dois-tu allumer tes feux de navigation ?
propositions:
  - id: a
    texte: Oui, les feux se montrent aussi de jour par visibilité réduite
  - id: b
    texte: Non, les feux ne se montrent que du coucher au lever du soleil
reponses:
  - a
explication: >-
  Les feux s'observent du coucher au lever du soleil, mais la règle 20 c) ajoute qu'ils
  doivent également être montrés du lever au coucher du soleil par visibilité réduite,
  et qu'ils peuvent l'être chaque fois que c'est jugé nécessaire.
sources:
  - texte: RIPAM, règle 20 c)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-09-05'
