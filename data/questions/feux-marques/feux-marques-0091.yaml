id: feux-marques-0091
option: cotier
theme: feux-marques
notion: feux-manoeuvre-restreinte
famille: feux-capacite-restreinte-marques
statut: publie
difficulte: 2
enonce: >-
  De jour, ce navire montre ces marques. Que t'indique-t-il ?
visuel:
  fichier: navires/capacite-restreinte-jour.svg
  alt: "Navire vu de son flanc gauche, l'avant à gauche. Sur le mât, trois marques noires superposées, une boule, deux cônes joints par leur base, une boule."
  credit: code
propositions:
  - id: a
    texte: Il n'est pas maître de sa manœuvre
  - id: b
    texte: Il est échoué
  - id: c
    texte: Sa capacité de manœuvre est restreinte
  - id: d
    texte: Il remorque un train de plus de 200 mètres
reponses:
  - c
explication: >-
  La règle 27 b) ii) donne au navire à capacité de manœuvre restreinte trois marques superposées, une boule en haut, une boule en bas et un bicône au milieu. Le piège est de compter les boules et d'oublier le bicône : deux boules seules désignent le navire qui n'est pas maître de sa manœuvre, trois boules le navire échoué. Le bicône seul, enfin, est la marque d'un train de remorque de plus de 200 mètres.
sources:
  - texte: RIPAM, règle 27 b) ii)
    ref: decret-77-733
meta:
  cree_le: '2026-10-02'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-10-02'
