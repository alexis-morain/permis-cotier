id: feux-marques-0014
option: cotier
theme: feux-marques
notion: feux-remorquage
statut: publie
difficulte: 2
enonce: >-
  Tu remorques de nuit et la longueur du train de remorque, mesurée de l'arrière de ton
  navire à l'extrémité arrière du train, dépasse 200 mètres : combien de feux de tête
  de mât superposés montres-tu ?
propositions:
  - id: a
    texte: Un seul
  - id: b
    texte: Deux
  - id: c
    texte: Trois
reponses:
  - c
explication: >-
  La règle 24 a) i) remplace le feu de tête de mât ordinaire par deux feux superposés
  pendant le remorquage, et impose un troisième feu superposé dès que le train de remorque
  dépasse 200 mètres. La longueur se mesure de l'arrière du navire remorquant à l'extrémité
  arrière du train, pas du seul câble. Le piège est de répondre « deux », qui est la réponse
  pour un train de remorque plus court.
sources:
  - texte: RIPAM, règle 24 a) i)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
