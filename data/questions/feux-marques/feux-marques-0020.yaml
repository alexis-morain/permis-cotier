id: feux-marques-0020
option: cotier
theme: feux-marques
notion: feux-voile-aviron
statut: publie
difficulte: 2
enonce: >-
  Tu fais route à la voile et tu montres, en plus de tes feux, deux feux superposés visibles
  sur tout l'horizon au sommet du mât : quelles sont leurs couleurs ?
propositions:
  - id: a
    texte: Rouge au-dessus, vert au-dessous.
  - id: b
    texte: Vert au-dessus, rouge au-dessous.
reponses:
  - a
explication: >-
  Le navire à voile qui fait route peut montrer en tête de mât deux feux superposés visibles
  sur tout l'horizon : rouge au-dessus, vert au-dessous. L'ordre est le piège, on inverse
  facilement les couleurs. Ces feux restent facultatifs et ne se montrent pas en même temps
  que le fanal unique.
sources:
  - texte: RIPAM, règle 25 c)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
