id: feux-marques-0077
option: cotier
theme: feux-marques
notion: feux-tirant-eau
statut: publie
difficulte: 2
enonce: >-
  Un navire handicapé par son tirant d'eau allume ses trois feux rouges superposés.
  Quels feux porte-t-il en plus ?
propositions:
  - id: a
    texte: Aucun, ces trois feux remplacent ses feux de route
  - id: b
    texte: Ceux d'un navire au mouillage
  - id: c
    texte: Ceux prescrits pour les navires à voile
  - id: d
    texte: Ceux prescrits pour les navires à propulsion mécanique
reponses:
  - d
explication: >-
  La règle 28 dit que ce navire peut montrer ses trois feux rouges « outre les feux
  prescrits pour les navires à propulsion mécanique par la règle 23 ». La signalisation
  s'ajoute, elle ne remplace rien : tu vois donc aussi son feu de tête de mât, ses feux
  de côté et son feu de poupe, qui seuls te disent sa route.
sources:
  - texte: RIPAM, règle 28
    ref: decret-77-733
meta:
  cree_le: '2026-09-21'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-21'
