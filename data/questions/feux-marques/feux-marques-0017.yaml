id: feux-marques-0017
option: cotier
theme: feux-marques
notion: feux-remorquage
statut: publie
difficulte: 3
enonce: >-
  Tu pousses un navire en avant de nuit, sans former avec lui une unité composite : quels
  feux montres-tu ?
propositions:
  - id: a
    texte: Deux feux de tête de mât superposés, des feux de côté et un feu de poupe
  - id: b
    texte: Deux feux de tête de mât superposés, des feux de côté, un feu de poupe et un
      feu de remorquage
  - id: c
    texte: Trois feux de tête de mât superposés, des feux de côté et un feu de poupe
reponses:
  - a
explication: >-
  Le navire qui pousse en avant ou remorque à couple montre deux feux de tête de mât
  superposés, des feux de côté et un feu de poupe, sans feu de remorquage : celui-ci est
  réservé au remorquage à la traîne. Les trois feux superposés ne valent que pour un train
  de plus de 200 mètres. Pousseur et poussé reliés par un raccordement rigide forment une
  unité composite et montrent les feux d'un navire à propulsion mécanique ordinaire.
sources:
  - texte: RIPAM, règle 24 c)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
