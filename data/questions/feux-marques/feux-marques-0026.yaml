id: feux-marques-0026
option: cotier
theme: feux-marques
notion: feux-mouillage-echoue
statut: publie
difficulte: 2
enonce: >-
  Au mouillage de nuit, en dessous de quelle longueur un navire peut-il se contenter d'un
  seul feu blanc visible sur tout l'horizon ?
propositions:
  - id: a
    texte: 50 mètres
  - id: b
    texte: 100 mètres
  - id: c
    texte: 12 mètres
reponses:
  - a
explication: >-
  Un navire au mouillage de moins de 50 mètres peut montrer un seul feu blanc visible sur
  tout l'horizon, à l'endroit le plus visible, au lieu de deux feux. Le piège vient des
  autres longueurs : 100 mètres est le seuil à partir duquel l'illumination des ponts
  devient obligatoire, et 12 mètres celui en dessous duquel un navire échoué est dispensé
  des feux et marques d'échouement.
sources:
  - texte: RIPAM, règle 30 b)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
