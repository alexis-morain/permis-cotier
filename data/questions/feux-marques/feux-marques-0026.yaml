id: feux-marques-0026
option: cotier
theme: feux-marques
statut: publie
difficulte: 2
enonce: >-
  Au mouillage de nuit, en dessous de quelle longueur un navire peut-il se contenter d'un
  seul feu blanc visible sur tout l'horizon ?
propositions:
  - id: a
    texte: 20 mètres
  - id: b
    texte: 50 mètres
  - id: c
    texte: 100 mètres
  - id: d
    texte: 12 mètres
reponses:
  - b
explication: >-
  La règle 30 b) autorise un navire au mouillage de longueur inférieure à 50 mètres à
  montrer un seul feu blanc visible sur tout l'horizon, à l'endroit le plus visible, au
  lieu des deux feux du paragraphe a). Le piège vient des autres longueurs de la même
  règle : 100 mètres est le seuil à partir duquel l'illumination des ponts devient obligatoire,
  et 12 mètres celui de la dispense des marques d'échouement.
sources:
  - texte: RIPAM, règle 30 b)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-04'
