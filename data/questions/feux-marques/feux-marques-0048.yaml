id: feux-marques-0048
option: cotier
theme: feux-marques
notion: feux-moteur-route
statut: publie
difficulte: 2
enonce: >-
  De nuit, tu vois un feu blanc au-dessus d'un feu vert, et rien d'autre. Que peux-tu
  en dire ?
propositions:
  - id: a
    texte: Un navire à propulsion mécanique fait route et te présente son tribord
  - id: b
    texte: Un navire chalute
  - id: c
    texte: Un navire à voile fait route et te présente son bâbord
reponses:
  - a
explication: >-
  Un feu de tête de mât blanc au-dessus d'un feu de côté vert, c'est un navire à propulsion
  mécanique faisant route vu par son tribord. Le chalutier montre un vert au-dessus d'un
  blanc, l'ordre inverse, et le voilier ne porte pas de feu de tête de mât.
sources:
  - texte: RIPAM, règle 23 a)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-05'
