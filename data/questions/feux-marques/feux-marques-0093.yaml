id: feux-marques-0093
option: cotier
theme: feux-marques
notion: feux-mouillage-echoue
famille: feux-mouillage-boule
statut: publie
difficulte: 2
enonce: >-
  De jour, ce navire est immobile et porte cette marque. Que fait-il ?
visuel:
  fichier: navires/mouillage-jour.svg
  alt: "Navire vu de son flanc droit, l'avant à droite. Une boule noire hissée à l'avant, sur un mâtereau."
  credit: code
propositions:
  - id: a
    texte: Il n'est pas maître de sa manœuvre
  - id: b
    texte: Il est au mouillage
  - id: c
    texte: Il est échoué
  - id: d
    texte: Il fait route à la voile et au moteur
reponses:
  - b
explication: >-
  La règle 30 a) i) donne au navire au mouillage une boule, à l'avant, à l'endroit le plus visible. Les boules se comptent : deux superposées, il n'est pas maître de sa manœuvre, trois, il est échoué. Le piège de la position est le cône pointe en bas, lui aussi à l'avant, qui désigne le voilier qui marche au moteur.
sources:
  - texte: RIPAM, règle 30 a) i)
    ref: decret-77-733
meta:
  cree_le: '2026-10-02'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-10-02'
