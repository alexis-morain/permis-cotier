id: feux-marques-0033
option: cotier
theme: feux-marques
notion: feux-portee
statut: publie
difficulte: 2
enonce: >-
  Ton bateau mesure moins de 12 mètres. À quelle distance minimale ses feux de côté
  doivent-ils être visibles ?
propositions:
  - id: a
    texte: 1 mille.
  - id: b
    texte: 2 milles.
  - id: c
    texte: 3 milles.
reponses:
  - a
explication: >-
  La règle 22 c) fixe les portées minimales sous 12 mètres : 1 mille pour les feux de côté,
  2 milles pour le feu de tête de mât, le feu de poupe, le feu de remorquage et tout feu
  visible sur tout l'horizon. Le feu de côté est le seul à 1 mille, et c'est ce qui se
  retient : il est aussi le moins puissant, alors qu'il porte l'information la plus utile,
  le côté par lequel tu vois l'autre.
sources:
  - texte: RIPAM, règle 22 c)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
