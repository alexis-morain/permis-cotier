id: feux-marques-0085
option: cotier
theme: feux-marques
notion: feux-voile-aviron
statut: publie
difficulte: 3
enonce: >-
  Ton voilier de 12 mètres fait route et tu allumes en tête de mât le feu rouge au-dessus
  du feu vert. Peux-tu éteindre tes feux de côté et ton feu de poupe ?
propositions:
  - id: a
    texte: Oui, ces deux feux les remplacent au-delà de 7 mètres de longueur
  - id: b
    texte: Non, ils viennent en plus des feux de côté et du feu de poupe
  - id: c
    texte: Oui, ces deux feux les remplacent, comme le fait le fanal unique en tête de
      mât
reponses:
  - b
explication: >-
  Non : le feu rouge au-dessus du feu vert s'ajoute aux feux de côté et au feu de poupe, il
  ne les remplace jamais. Seul le fanal unique en tête de mât les réunit vraiment, et c'est
  de cette confusion que vient le piège. Il est d'ailleurs interdit de montrer le rouge et
  le vert en même temps que ce fanal.
sources:
  - texte: RIPAM, règle 25 c)
    ref: decret-77-733
meta:
  cree_le: '2026-09-21'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
