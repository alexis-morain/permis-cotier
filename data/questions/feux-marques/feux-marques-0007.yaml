id: feux-marques-0007
option: cotier
theme: feux-marques
notion: feux-definitions
statut: publie
difficulte: 2
enonce: >-
  Tu navigues sur un bateau de 15 mètres : que te permet la règle pour tes feux de côté
  ?
propositions:
  - id: a
    texte: Tu peux les combiner en un seul fanal placé dans l'axe longitudinal du navire.
  - id: b
    texte: Tu peux les remplacer par un feu blanc visible sur tout l'horizon.
  - id: c
    texte: Tu dois garder deux fanaux séparés, la combinaison n'est permise qu'en dessous
      de 12 mètres.
reponses:
  - a
explication: >-
  La règle 21 b) autorise, à bord des navires de longueur inférieure à 20 mètres, la combinaison
  des feux de côté en un seul fanal placé dans l'axe longitudinal du navire. Avec 15 mètres,
  tu es sous ce seuil. Le piège est la valeur voisine : la limite est bien 20 mètres,
  pas 12, et la règle ne dit rien d'une combinaison avec le feu de poupe ni d'un remplacement
  par un feu blanc.
sources:
  - texte: RIPAM, règle 21 b)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
