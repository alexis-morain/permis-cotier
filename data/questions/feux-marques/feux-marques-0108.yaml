id: feux-marques-0108
option: cotier
theme: feux-marques
notion: feux-peche
famille: feux-chalut-erre
statut: publie
difficulte: 2
enonce: >-
  Ce chalutier a son chalut à l'eau. De nuit, il te montre ces feux. Que peux-tu en dire ?
visuel:
  fichier: navires/chalutier-nuit.svg
  alt: Navire vu de face. Sur le mât, deux feux superposés, vert au-dessus, blanc en dessous. Plus bas, un feu vert à gauche et un feu rouge à droite.
  credit: code
propositions:
  - id: a
    texte: Il est stoppé, sans erre
  - id: b
    texte: Il a de l'erre et vient vers toi
  - id: c
    texte: Il a de l'erre et s'éloigne de toi
  - id: d
    texte: Il est au mouillage
reponses:
  - b
explication: >-
  Le chalutier montre toujours le vert au-dessus du blanc (règle 26 b) i). Il n'y ajoute
  ses feux de côté et son feu de poupe que lorsqu'il a de l'erre, règle 26 b) iii). Ici tu
  vois ses deux feux de côté : il avance, et vers toi. S'il s'éloignait, tu verrais son
  feu de poupe, pas ses feux de côté.
sources:
  - texte: RIPAM, règle 26 b) iii)
    ref: decret-77-733
meta:
  cree_le: '2026-10-02'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-02'
