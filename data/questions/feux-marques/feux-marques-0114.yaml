id: feux-marques-0114
option: cotier
theme: feux-marques
notion: feux-remorquage
famille: feux-remorquage-poupe
statut: publie
difficulte: 2
enonce: >-
  De nuit, tu vois ce navire par son arrière. Que t'indiquent ces feux ?
visuel:
  fichier: navires/remorqueur-de-l-arriere-nuit.svg
  alt: Navire vu de trois quarts arrière par sa gauche, l'avant à gauche, un câble part de l'arrière vers la droite. À l'arrière, un feu jaune juste au-dessus d'un feu blanc. Aucun autre feu.
  credit: code
propositions:
  - id: a
    texte: Il remorque
  - id: b
    texte: C'est un aéroglisseur
  - id: c
    texte: Il pousse un navire en avant
  - id: d
    texte: Il est lui-même remorqué
reponses:
  - a
explication: >-
  Le navire qui remorque porte un feu de remorquage jaune à la verticale au-dessus de son
  feu de poupe, règle 24 a) iv) ; tous deux couvrent le secteur arrière (règle 21 c et d).
  Le piège est l'aéroglisseur, dont le feu jaune est à éclats et visible sur tout
  l'horizon (règle 23 b). Le navire qui pousse en avant et le navire remorqué n'ont pas de
  feu jaune (règle 24 c et e).
sources:
  - texte: RIPAM, règle 24 a) iv)
    ref: decret-77-733
meta:
  cree_le: '2026-10-02'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-10-02'
