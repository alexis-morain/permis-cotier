id: feux-marques-0027
option: cotier
theme: feux-marques
notion: feux-mouillage-echoue
statut: publie
difficulte: 2
enonce: >-
  Ton navire est échoué de nuit : que montres-tu en plus des feux de mouillage ?
propositions:
  - id: a
    texte: Deux feux rouges superposés visibles sur tout l'horizon
  - id: b
    texte: Un feu rouge au-dessus d'un feu blanc, visibles sur tout l'horizon
  - id: c
    texte: Trois feux rouges superposés visibles sur tout l'horizon
  - id: d
    texte: Deux feux rouges superposés visibles sur 225 degrés vers l'avant
reponses:
  - a
explication: >-
  La règle 30 d) impose au navire échoué les feux du mouillage, plus deux feux rouges
  superposés visibles sur tout l'horizon à l'endroit le plus visible. Le rouge sur blanc
  est le signal d'un navire en train de pêcher, pas d'un échouement. Trois éléments superposés
  existent bien dans la règle, mais ce sont les trois boules de jour, et le feu doit couvrir
  tout l'horizon, jamais un simple secteur avant.
sources:
  - texte: RIPAM, règle 30 d) i)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-04'
