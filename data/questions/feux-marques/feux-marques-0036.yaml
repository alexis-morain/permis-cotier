id: feux-marques-0036
option: cotier
theme: feux-marques
notion: feux-peche
statut: publie
difficulte: 2
enonce: >-
  Tu relèves ces feux de nuit. Que peux-tu en dire ?
visuel:
  fichier: feux/peche-hors-chalut.svg
  alt: "Deux feux superposés visibles sur tout l'horizon, le supérieur rouge, l'inférieur blanc."
  credit: code
propositions:
  - id: a
    texte: Ce navire pêche, autrement qu'au chalut
  - id: b
    texte: De jour, à la place de ces feux, il montrerait une marque formée de deux cônes
      superposés réunis par la pointe
  - id: c
    texte: Ce navire tire un chalut
reponses:
  - a
  - b
explication: >-
  Le même alinéa donne le feu et la marque, et c'est la couleur du feu supérieur qui
  sépare les deux familles. Rouge sur blanc, le navire pêche autrement qu'au chalut. Vert
  sur blanc, il chalute. Le feu inférieur est blanc dans les deux cas, il ne t'apprend
  rien : ne relève que celui du haut. De jour, les deux familles montrent en revanche
  la même marque, deux cônes superposés réunis par la pointe, et le dessin ne dit plus
  laquelle des deux pêches tu as devant toi. Le cône unique la pointe en haut existe
  bien, mais il ne remplace pas cette marque : il s'ajoute, dans l'alignement de l'engin,
  quand celui-ci est déployé à plus de 150 mètres du navire.
sources:
  - texte: RIPAM, règle 26 c) i)
    ref: decret-77-733
  - texte: RIPAM, règle 26 c) ii)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
