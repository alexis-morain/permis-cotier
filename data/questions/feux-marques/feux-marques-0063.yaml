id: feux-marques-0063
option: cotier
theme: feux-marques
notion: feux-mouillage-echoue
statut: publie
difficulte: 3
enonce: >-
  Ton bateau de 9 mètres s'est échoué de nuit. Es-tu tenu de montrer les deux feux rouges
  superposés du navire échoué ?
propositions:
  - id: a
    texte: Non, sous 12 mètres un navire échoué en est dispensé
  - id: b
    texte: Oui, seuls ceux de moins de 7 mètres en sont dispensés
reponses:
  - a
explication: >-
  Les navires de longueur inférieure à 12 mètres, lorsqu'ils sont échoués, ne sont pas
  tenus de montrer les deux feux rouges ni les trois boules de la règle 30 d). La dispense
  ne vaut que pour ces signaux d'échouement, pas pour le feu de mouillage, que la règle
  30 d) maintient : échoué, tu montres le feu blanc du navire au mouillage.
sources:
  - texte: RIPAM, règle 30 f)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-03'
