id: feux-marques-0002
option: cotier
theme: feux-marques
notion: feux-peche
famille: feux-peche-hors-chalut
statut: publie
difficulte: 2
enonce: >-
  De nuit, ce navire te montre ces feux. Que fait-il ?
visuel:
  fichier: navires/peche-nuit.svg
  alt: "Navire vu de face. Sur le mât, deux feux superposés, rouge au-dessus, blanc en dessous. Plus bas, un feu vert à gauche et un feu rouge à droite."
  credit: code
propositions:
  - id: a
    texte: Il pêche, mais pas au chalut
  - id: b
    texte: Il chalute
  - id: c
    texte: Il n'est pas en train de pêcher
reponses:
  - a
explication: >-
  La règle 26 c) i) réserve le feu rouge surmontant le feu blanc au navire en train de
  pêcher autrement qu'au chalut. Le chalutier, lui, montre du vert au-dessus du blanc,
  règle 26 b) i). Un navire qui ne pêche pas ne montre aucun de ces feux, règle 26 e),
  donc la dernière proposition tombe d'elle-même.
sources:
  - texte: RIPAM, règle 26 c) i)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-02'
