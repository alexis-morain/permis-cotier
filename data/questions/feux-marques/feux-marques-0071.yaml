id: feux-marques-0071
option: cotier
theme: feux-marques
notion: marques-jour
statut: publie
difficulte: 2
enonce: >-
  Tu viens de rentrer tes lignes et tu fais route sans pêcher. Que fais-tu de la marque
  de pêche restée hissée ?
propositions:
  - id: a
    texte: Tu la laisses en place tant que tu es en mer.
  - id: b
    texte: Tu l'amènes, elle ne se montre qu'en train de pêcher.
reponses:
  - b
explication: >-
  La règle 26 e) le dit dans les deux sens : un navire qui n'est pas en train de pêcher ne
  doit pas montrer les marques de cette règle, et ne montre que celles prescrites pour un
  navire de sa longueur. Laisser la marque hissée, c'est réclamer des égards qu'on ne te
  doit plus, et tromper celui qui manœuvre sur ta marque.
sources:
  - texte: RIPAM, règle 26 e)
    ref: decret-77-733
meta:
  cree_le: '2026-09-21'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-21'
