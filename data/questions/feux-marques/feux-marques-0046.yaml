id: feux-marques-0046
option: cotier
theme: feux-marques
notion: feux-moteur-route
statut: publie
difficulte: 2
enonce: >-
  Un navire de 60 mètres fait route au moteur de nuit. Combien de feux de tête de mât
  doit-il montrer ?
propositions:
  - id: a
    texte: Deux, le second à l'arrière du premier et plus haut
  - id: b
    texte: Un seul, à l'avant
  - id: c
    texte: Trois, superposés
reponses:
  - a
explication: >-
  Le second feu de tête de mât, à l'arrière du premier et plus haut que lui, est obligatoire
  à partir de 50 mètres. En dessous, le navire n'y est pas tenu mais peut le montrer.
  Trois feux superposés signalent un remorqueur dont le train dépasse 200 mètres.
sources:
  - texte: RIPAM, règle 23 a)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-05'
