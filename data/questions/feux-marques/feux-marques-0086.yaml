id: feux-marques-0086
option: cotier
theme: feux-marques
notion: feux-voile-aviron
statut: publie
difficulte: 2
enonce: >-
  Un navire à l'aviron est-il tenu de montrer les feux prescrits aux navires à voile ?
propositions:
  - id: a
    texte: "Non, la règle dit qu'il peut les montrer : c'est une faculté"
  - id: b
    texte: Oui, au même titre qu'un navire à voile qui fait route
  - id: c
    texte: Oui, dès que sa longueur atteint 7 mètres
reponses:
  - a
explication: >-
  Le navire à l'aviron « peut » montrer les feux des navires à voile : c'est une faculté,
  pas une obligation, à la différence du voilier qui fait route. La contrepartie, elle, est
  obligatoire : s'il ne les montre pas, il doit être prêt à montrer immédiatement, pour
  prévenir un abordage, une lampe électrique ou un fanal à feu blanc. Piège : chercher un
  seuil de longueur pour l'aviron, alors que les 7 mètres visent le voilier.
sources:
  - texte: RIPAM, règle 25 d) ii)
    ref: decret-77-733
