id: feux-marques-0086
option: cotier
theme: feux-marques
notion: feux-voile-aviron
statut: publie
difficulte: 2
enonce: >-
  Un navire à l'aviron est-il tenu de montrer les feux que la règle 25 prescrit aux navires
  à voile ?
propositions:
  - id: a
    texte: "Non, la règle dit qu'il peut les montrer : c'est une faculté"
  - id: b
    texte: Oui, au même titre qu'un navire à voile qui fait route
  - id: c
    texte: Oui, dès que sa longueur atteint 7 mètres
reponses:
  - a
explication: >-
  La règle 25 d) ii) écrit que le navire à l'aviron « peut » montrer les feux prescrits
  pour les navires à voile : le verbe marque une faculté, pas une obligation, à la différence
  du paragraphe a) qui impose ses feux au voilier faisant route. La contrepartie est ailleurs
  dans la même phrase, et elle n'est pas facultative. Le piège est de confondre obligation
  d'emport et faculté d'usage, et d'aller chercher un seuil de longueur que ce texte ne
  pose pas pour l'aviron.
sources:
  - texte: RIPAM, règle 25 d) ii)
    ref: decret-77-733
