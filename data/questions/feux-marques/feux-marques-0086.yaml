id: feux-marques-0086
option: cotier
theme: feux-marques
notion: feux-voile-aviron
statut: publie
difficulte: 2
enonce: >-
  Un navire à l'aviron est-il tenu de montrer les feux que la règle 25 prescrit aux navires
  à voile ?
propositions:
  - id: a
    texte: "Non, la règle dit qu'il peut les montrer : c'est une faculté"
  - id: b
    texte: Oui, au même titre qu'un navire à voile qui fait route
  - id: c
    texte: Oui, dès que sa longueur atteint 7 mètres
reponses:
  - a
explication: >-
  La règle 25 d) ii) écrit que le navire à l'aviron « peut » montrer les feux prescrits pour
  les navires à voile : le verbe marque une faculté, pas une obligation, à la différence du
  paragraphe a) qui impose ses feux au voilier faisant route. La contrepartie est dans la
  même phrase, et elle n'est pas facultative : s'il ne les montre pas, il doit être prêt à
  montrer immédiatement, pour prévenir un abordage, une lampe électrique ou un fanal à feu
  blanc. Le piège est d'aller chercher un seuil de longueur que ce texte ne pose pas pour
  l'aviron : les 7 mètres du i) visent le voilier.
sources:
  - texte: RIPAM, règle 25 d) ii)
    ref: decret-77-733
