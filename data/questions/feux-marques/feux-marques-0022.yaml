id: feux-marques-0022
option: cotier
theme: feux-marques
notion: feux-manoeuvre-restreinte
statut: publie
difficulte: 2
enonce: >-
  De nuit, un navire te montre à l'endroit le plus visible deux feux rouges superposés
  visibles sur tout l'horizon : que t'indique-t-il ?
propositions:
  - id: a
    texte: Qu'il est à capacité de manœuvre restreinte
  - id: b
    texte: Qu'il n'est pas maître de sa manœuvre
  - id: c
    texte: Qu'il est au mouillage
  - id: d
    texte: Qu'il est en train de pêcher au chalut
reponses:
  - b
explication: >-
  La règle 27 a) i) impose au navire qui n'est pas maître de sa manœuvre deux feux rouges
  superposés visibles sur tout l'horizon, placés à l'endroit le plus visible. Le piège
  est la règle voisine : le navire à capacité de manœuvre restreinte montre trois feux,
  rouge, blanc, rouge de haut en bas. Deux feux rouges seuls, c'est un navire qui ne peut
  plus manœuvrer.
sources:
  - texte: RIPAM, règle 27 a) i)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-04'
