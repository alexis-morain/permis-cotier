id: feux-marques-0034
option: cotier
theme: feux-marques
notion: marques-jour
statut: brouillon
difficulte: 2
enonce: >-
  De jour, un navire montre à l'avant un cône noir pointe en bas. Que t'indique-t-il ?
propositions:
  - id: a
    texte: Qu'il marche à la voile et au moteur à la fois.
  - id: b
    texte: Qu'il est au mouillage.
  - id: c
    texte: Qu'il est en train de pêcher.
  - id: d
    texte: Qu'il est handicapé par son tirant d'eau.
reponses:
  - a
explication: >-
  La règle 25 e) impose ce cône, pointe en bas, au navire à voile qui marche en même temps
  au moteur : pour le règlement, il est alors un navire à propulsion mécanique, et il perd
  le privilège du voilier. C'est la marque la plus utile au plaisancier, et la plus oubliée.
  Ne la confonds pas avec les deux cônes pointes jointes du navire en pêche, ni avec la
  boule du mouillage, ni avec le cylindre du navire handicapé par son tirant d'eau.
sources:
  - texte: RIPAM, règle 25 e)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
