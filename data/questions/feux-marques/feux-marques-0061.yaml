id: feux-marques-0061
option: cotier
theme: feux-marques
notion: feux-mouillage-echoue
famille: feux-mouillage-50-m
statut: publie
difficulte: 2
enonce: >-
  Un navire de 80 mètres est au mouillage de nuit. Quels feux montre-t-il ?
propositions:
  - id: a
    texte: Un feu blanc à l'avant, un second à l'arrière, plus bas
  - id: b
    texte: Un seul feu blanc visible sur tout l'horizon
  - id: c
    texte: Deux feux rouges superposés à l'endroit le plus visible
reponses:
  - a
explication: >-
  Au mouillage, un navire montre à l'avant un feu blanc visible sur tout l'horizon et,
  à l'arrière, un second feu blanc plus bas que le premier. Seuls les navires de moins
  de 50 mètres peuvent se contenter d'un feu unique. Les deux feux rouges sont ceux de
  l'échoué, en plus des feux de mouillage.
sources:
  - texte: RIPAM, règle 30 a)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-10-02'
