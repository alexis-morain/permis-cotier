id: feux-marques-0053
option: cotier
theme: feux-marques
notion: feux-peche
statut: publie
difficulte: 2
enonce: >-
  Un chalutier rentre au port de nuit, son chalut remonté à bord. Quels feux doit-il montrer
  ?
propositions:
  - id: a
    texte: Ceux d'un navire à propulsion mécanique de sa longueur
  - id: b
    texte: Un feu vert au-dessus d'un feu blanc, comme en pêche
  - id: c
    texte: Deux feux rouges superposés
reponses:
  - a
explication: >-
  Un navire qui n'est pas en train de pêcher ne doit pas montrer les feux de la règle
  26, mais seulement ceux prescrits pour un navire de sa longueur. Chalut remonté, c'est
  un navire à propulsion mécanique ordinaire, et il n'a plus aucun privilège.
sources:
  - texte: RIPAM, règle 26 e)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-05'
