id: barre-route-0007
option: cotier
theme: barre-route
notion: barre-routes-opposees
statut: publie
difficulte: 2
enonce: >-
  Tu barres un navire à propulsion mécanique et un autre navire à propulsion mécanique
  vient à ta rencontre sur une route directement opposée, de telle sorte qu'il existe
  un risque d'abordage. Que fais-tu ?
propositions:
  - id: a
    texte: Tu viens sur bâbord pour passer tribord à tribord.
  - id: b
    texte: Tu viens sur tribord pour passer bâbord à bâbord.
reponses:
  - b
explication: >-
  La règle 14 a) impose à chacun des deux navires de venir sur tribord pour passer par
  bâbord l'un de l'autre. La manœuvre est symétrique : aucun des deux n'est privilégié,
  les deux manœuvrent. Le piège est l'inversion, venir sur bâbord pour passer tribord
  à tribord, et l'idée fausse qu'un des deux navires conserve sa route comme dans une
  situation de routes qui se croisent.
sources:
  - texte: RIPAM, règle 14 a)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
