id: barre-route-0043
option: cotier
theme: barre-route
notion: barre-manoeuvre-evitement
statut: publie
difficulte: 2
enonce: >-
  Tu as de la place autour de toi et tu veux éviter une situation très rapprochée. Que
  dit la règle 8 du seul changement de cap ?
propositions:
  - id: a
    texte: Il peut être la manœuvre la plus efficace, s'il est fait largement à temps,
      franchement, et sans créer une autre situation rapprochée
  - id: b
    texte: Il est interdit sans réduction de vitesse
  - id: c
    texte: Il ne vaut que par visibilité réduite
reponses:
  - a
explication: >-
  Si le navire a suffisamment de place, le changement de cap à lui seul peut être la manœuvre
  la plus efficace pour éviter de se trouver en situation très rapprochée, à condition
  qu'il soit fait largement à temps, qu'il soit franc et qu'il n'aboutisse pas à une autre
  situation très rapprochée.
sources:
  - texte: RIPAM, règle 8 c)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-09-05'
