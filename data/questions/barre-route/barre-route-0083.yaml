id: barre-route-0083
option: cotier
theme: barre-route
notion: barre-chenal-etroit
statut: publie
difficulte: 2
enonce: >-
  Tu fais route près d'un dispositif de séparation du trafic, que tu n'utilises pas. Que
  te demande la règle 10 h) ?
propositions:
  - id: a
    texte: Le longer au plus près, tant que tu restes hors de ses voies.
  - id: b
    texte: T'en écarter aussi largement que possible.
  - id: c
    texte: Te tenir à au moins un mille de ses limites.
reponses:
  - b
explication: >-
  La règle 10 h) demande aux navires qui n'utilisent pas un dispositif de séparation du
  trafic de s'en écarter aussi largement que possible. Elle ne fixe aucune distance
  chiffrée, et il ne suffit pas de rester hors des voies de circulation.
sources:
  - texte: RIPAM, règle 10 h)
    ref: decret-77-733
meta:
  cree_le: '2026-10-09'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-09'
