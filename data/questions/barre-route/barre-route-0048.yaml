id: barre-route-0048
option: cotier
theme: barre-route
notion: barre-chenal-etroit
statut: publie
difficulte: 2
enonce: >-
  Tu cherches un endroit pour mouiller et passer la nuit. Que dit la règle 9 du mouillage
  dans un chenal étroit ?
propositions:
  - id: a
    texte: Tout navire doit, si les circonstances le permettent, éviter d'y mouiller
  - id: b
    texte: Le mouillage y est permis à condition de montrer un feu blanc
  - id: c
    texte: Le mouillage y est réservé aux navires de moins de 20 mètres
reponses:
  - a
explication: >-
  La règle 9 g) demande à tout navire, si les circonstances le permettent, d'éviter de
  mouiller dans un chenal étroit. Un bateau au mouillage au milieu d'un passage obligé
  gêne tout le monde, feu de mouillage ou non.
sources:
  - texte: RIPAM, règle 9 g)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-09-05'
