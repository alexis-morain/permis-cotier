id: barre-route-0015
option: cotier
theme: barre-route
statut: publie
difficulte: 2
enonce: >-
  Un navire en train de pêcher fait route. De la route de quels navires doit-il s'écarter,
  dans la mesure du possible ? Deux réponses.
propositions:
  - id: a
    texte: D'un navire qui n'est pas maître de sa manœuvre.
  - id: b
    texte: D'un navire à voile.
  - id: c
    texte: D'un navire à capacité de manœuvre restreinte.
  - id: d
    texte: D'un navire à propulsion mécanique.
reponses:
  - a
  - c
explication: >-
  La règle 18 c) ne cite que deux catégories : le navire qui n'est pas maître de sa manœuvre
  et le navire à capacité de manœuvre restreinte. Face à un navire à voile ou à un navire
  à propulsion mécanique, c'est l'inverse : ce sont eux qui s'écartent du navire en train
  de pêcher, selon les règles 18 a) iii) et 18 b) iii).
sources:
  - texte: RIPAM, règle 18 c)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-04'
