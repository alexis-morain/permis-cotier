id: barre-route-0081
option: cotier
theme: barre-route
notion: barre-chenal-etroit
statut: publie
difficulte: 2
enonce: >-
  Tu fais route près de l'extrémité d'un dispositif de séparation du trafic, là où les
  navires s'y engagent et en sortent. Que te demande la règle 10 f) ?
propositions:
  - id: a
    texte: Y réduire ta vitesse à cinq nœuds au plus.
  - id: b
    texte: Y mouiller pour laisser passer les navires qui entrent et sortent.
  - id: c
    texte: Y naviguer avec une vigilance particulière.
  - id: d
    texte: Rien, la règle 10 ne vaut qu'à l'intérieur des voies de circulation.
reponses:
  - c
explication: >-
  La règle 10 f) demande aux navires qui naviguent dans des zones proches des extrémités
  d'un dispositif de séparation du trafic de le faire avec une vigilance particulière. Elle
  vise donc aussi les abords du dispositif, pas seulement ses voies. Elle ne fixe aucune
  vitesse, et la règle 10 g) demande au contraire d'éviter de mouiller dans ces zones.
sources:
  - texte: RIPAM, règle 10 f)
    ref: decret-77-733
  - texte: RIPAM, règle 10 g)
    ref: decret-77-733
meta:
  cree_le: '2026-10-09'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-09'
