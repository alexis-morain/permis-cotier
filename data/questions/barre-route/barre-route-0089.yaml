id: barre-route-0089
option: cotier
theme: barre-route
notion: barre-visibilite-reduite
statut: publie
difficulte: 2
enonce: >-
  Au sens du RIPAM, quand deux navires sont-ils considérés comme en vue l'un de l'autre ?
propositions:
  - id: a
    texte: Quand chacun détecte l'autre sur son radar.
  - id: b
    texte: Quand ils entendent l'un l'autre leurs signaux sonores.
  - id: c
    texte: Quand l'un d'eux peut être observé visuellement par l'autre.
  - id: d
    texte: Quand moins d'un mille les sépare.
reponses:
  - c
explication: >-
  La règle 3 k) ne considère deux navires comme en vue l'un de l'autre que lorsque l'un
  d'eux peut être observé visuellement par l'autre. Un écho radar ou un signal entendu ne
  suffit pas, et la règle ne fixe aucune distance.
sources:
  - texte: RIPAM, règle 3 k)
    ref: decret-77-733
meta:
  cree_le: '2026-10-09'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-09'
