id: barre-route-0086
option: cotier
theme: barre-route
notion: barre-hierarchie-privileges
statut: publie
difficulte: 2
enonce: >-
  Tu fais route au moteur. Selon la règle 18 a), de la route de quels navires dois-tu
  t'écarter ?
propositions:
  - id: a
    texte: Un navire à propulsion mécanique plus grand que le tien.
  - id: b
    texte: Un navire en train de pêcher.
  - id: c
    texte: Un navire qui n'est pas maître de sa manœuvre.
  - id: d
    texte: Un navire à propulsion mécanique qui transporte des passagers.
reponses:
  - b
  - c
explication: >-
  La règle 18 a) dresse la liste des navires dont un navire à propulsion mécanique faisant
  route doit s'écarter : le navire qui n'est pas maître de sa manœuvre, le navire à
  capacité de manœuvre restreinte, le navire en train de pêcher et le navire à voile. La
  taille d'un autre navire à moteur, ou ce qu'il transporte, n'y figure pas. Cette liste
  vaut sauf dispositions contraires des règles 9, 10 et 13.
sources:
  - texte: RIPAM, règle 18 a)
    ref: decret-77-733
meta:
  cree_le: '2026-10-09'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-09'
