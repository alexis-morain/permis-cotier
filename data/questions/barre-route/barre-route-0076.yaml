id: barre-route-0076
option: cotier
theme: barre-route
notion: barre-routes-croisees
famille: barre-regle-15-champ
statut: publie
difficulte: 3
enonce: >-
  Tu barres un voilier qui fait route à la voile. Un autre voilier sous voiles arrive par
  ta tribord, vos routes se croisent et l'abordage est à craindre. Que te dit la règle 15 ?
propositions:
  - id: a
    texte: Tu dois t'écarter, puisque tu le vois sur ta tribord.
  - id: b
    texte: Vous venez tous les deux sur tribord pour passer bâbord à bâbord.
  - id: c
    texte: Rien, elle ne vise que deux navires à propulsion mécanique.
  - id: d
    texte: Tu dois éviter de croiser sa route sur l'avant.
reponses:
  - c
explication: >-
  La règle 15 commence par « lorsque deux navires à propulsion mécanique font des routes
  qui se croisent » : celui qui voit l'autre sur tribord s'écarte, mais seulement entre deux
  navires qui marchent au moteur. Entre deux voiliers à la voile, elle ne dit rien, c'est
  le bord d'où chacun reçoit le vent qui décide. Le piège est d'appliquer le réflexe
  « il vient de tribord, je m'écarte » sans regarder à qui la règle s'adresse.
sources:
  - texte: RIPAM, règle 15
    ref: decret-77-733
  - texte: RIPAM, règle 12
    ref: decret-77-733
meta:
  cree_le: '2026-09-26'
  genere_par: claude
  relu_par: claude
