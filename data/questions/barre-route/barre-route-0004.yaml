id: barre-route-0004
option: cotier
theme: barre-route
notion: barre-rattrapant
statut: publie
difficulte: 2
enonce: >-
  À partir de quel angle sur l'arrière du travers d'un navire es-tu considéré comme le
  rattrapant ?
propositions:
  - id: a
    texte: Plus de 22,5 degrés sur l'arrière de son travers.
  - id: b
    texte: Plus de 22,5 degrés sur l'avant de son travers.
  - id: c
    texte: Plus de 112,5 degrés sur l'arrière de son travers.
  - id: d
    texte: Plus de 135 degrés sur l'arrière de son travers.
reponses:
  - a
explication: >-
  La règle 13 b) définit le navire qui en rattrape un autre comme celui qui s'approche
  en venant d'une direction de plus de 22,5 degrés sur l'arrière du travers de l'autre.
  Le repère de nuit est le même : depuis cette position, tu ne verrais que le feu arrière
  du navire rattrapé, aucun de ses feux de côté. Les autres valeurs proposées sont des
  angles de secteurs de feux, pas la limite du rattrapage, et l'avant du travers correspond
  au cas inverse.
sources:
  - texte: RIPAM, règle 13 b)
    ref: decret-77-733
