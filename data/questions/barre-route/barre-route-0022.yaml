id: barre-route-0022
option: cotier
theme: barre-route
notion: barre-veille-vitesse
statut: publie
difficulte: 2
enonce: >-
  Qu'est-ce qui définit la vitesse de sécurité au sens de la règle 6 ?
propositions:
  - id: a
    texte: >-
      La vitesse qui te permet de prendre des mesures efficaces pour éviter un abordage et
      de t'arrêter sur une distance adaptée aux circonstances.
  - id: b
    texte: La vitesse maximale autorisée dans la zone où tu navigues.
  - id: c
    texte: La vitesse qui te permet de tenir ton cap sans embarder.
reponses:
  - a
explication: >-
  La règle 6 ne fixe aucun chiffre : la vitesse de sécurité se définit par sa fonction,
  pouvoir manœuvrer et s'arrêter à temps. Elle dépend de la visibilité, de la densité du
  trafic, de la capacité de manœuvre du navire, de l'arrière-plan lumineux la nuit, de
  l'état de la mer et du tirant d'eau. Le piège est de la confondre avec une limitation
  réglementaire de vitesse, qui est autre chose : on peut être sous la limite et au-dessus
  de la vitesse de sécurité.
sources:
  - texte: RIPAM, règle 6
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
