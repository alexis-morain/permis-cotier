id: barre-route-0046
option: cotier
theme: barre-route
notion: barre-chenal-etroit
statut: publie
difficulte: 2
enonce: >-
  Tu pêches à la ligne depuis ton bateau de 7 mètres dans un chenal étroit et un caboteur
  remonte le chenal. Que dit la règle 9 ?
propositions:
  - id: a
    texte: Tu ne dois pas gêner le passage d'un navire qui ne peut naviguer en sécurité
      qu'à l'intérieur du chenal
  - id: b
    texte: Le navire en pêche est prioritaire, le caboteur doit s'écarter de ta route
reponses:
  - a
explication: >-
  Deux raisons se cumulent. Un navire de moins de 20 mètres ne doit pas gêner le passage des
  navires qui ne peuvent naviguer en toute sécurité qu'à l'intérieur d'un chenal étroit,
  règle 9 b). Et tes lignes ne font pas de toi un navire en train de pêcher au sens de la
  règle 3 d) : elles ne réduisent pas ta capacité de manœuvre. Même un vrai navire de pêche
  n'aurait pas ici le privilège de la règle 18 : la règle 9 c) lui interdit de gêner le
  passage.
sources:
  - texte: RIPAM, règle 9 b) et c)
    ref: decret-77-733
  - texte: RIPAM, règle 3 d)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-03'
