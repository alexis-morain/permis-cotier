id: barre-route-0046
option: cotier
theme: barre-route
notion: barre-chenal-etroit
statut: publie
difficulte: 2
enonce: >-
  Tu pêches depuis ton bateau dans un chenal étroit et un caboteur remonte le chenal.
  Que dit la règle 9 ?
propositions:
  - id: a
    texte: Un navire en train de pêcher ne doit pas gêner le passage des navires qui naviguent
      dans le chenal
  - id: b
    texte: Le navire en pêche est prioritaire, le caboteur s'écarte
reponses:
  - a
explication: >-
  Dans un chenal étroit ou une voie d'accès, les navires en train de pêcher ne doivent
  pas gêner le passage des autres navires qui y naviguent. Le privilège du navire en pêche
  de la règle 18 cède ici devant la règle 9.
sources:
  - texte: RIPAM, règle 9 c)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-05'
