id: barre-route-0051
option: cotier
theme: barre-route
notion: barre-chenal-etroit
statut: publie
difficulte: 2
enonce: >-
  Ton voilier croise la voie de circulation d'un dispositif de séparation du trafic qu'un
  cargo remonte. Que t'impose la règle 10 ?
propositions:
  - id: a
    texte: Ne pas gêner le passage du navire à propulsion mécanique qui suit la voie de
      circulation
  - id: b
    texte: Rien, le voilier est privilégié sur le navire à moteur
reponses:
  - a
explication: >-
  Les navires de longueur inférieure à 20 mètres et les navires à voile ne doivent pas
  gêner le passage des navires à propulsion mécanique qui suivent une voie de circulation.
  Le privilège de la voile de la règle 18 s'efface dans un dispositif de séparation du
  trafic.
sources:
  - texte: RIPAM, règle 10 j)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-05'
