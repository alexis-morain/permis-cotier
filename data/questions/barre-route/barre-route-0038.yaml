id: barre-route-0038
option: cotier
theme: barre-route
notion: barre-manoeuvre-evitement
statut: publie
difficulte: 2
enonce: >-
  Tu manœuvres pour éviter l'abordage avec un navire qui s'approche. Que t'impose la règle
  8 d) ?
propositions:
  - id: a
    texte: Manœuvrer de manière à passer à une distance suffisante.
  - id: b
    texte: Contrôler l'effet de ta manœuvre jusqu'à ce que l'autre soit paré et clair.
  - id: c
    texte: Reprendre ta route initiale dès que l'autre navire a manœuvré.
  - id: d
    texte: Annoncer ta manœuvre au signal sonore avant de l'entreprendre.
reponses:
  - a
  - b
explication: >-
  La règle 8 d) demande deux choses de la même manœuvre : qu'elle fasse passer à une
  distance suffisante, et qu'on en surveille attentivement l'efficacité jusqu'à ce que
  l'autre navire soit définitivement paré et clair. Une manœuvre franche mais abandonnée
  trop tôt ne vaut rien. Reprendre sa route dès que l'autre a bougé, c'est justement lâcher
  ce contrôle avant l'heure.
sources:
  - texte: RIPAM, règle 8 d)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: alexis
