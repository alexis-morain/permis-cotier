id: barre-route-0035
option: cotier
theme: barre-route
notion: barre-voiliers
statut: publie
difficulte: 2
enonce: >-
  Tu es le voilier de droite et vous recevez le vent du même bord. Vos routes convergent
  de manière à faire craindre un abordage. Que fais-tu ?
visuel:
  fichier: situations/voiliers-memes-amures.svg
  alt: "Vue de dessus. Deux voiliers convergent vers le haut de l'image, vent venant de la droite, voiles portées du même côté, à bâbord. Ton voilier est à droite, l'autre à gauche."
  credit: code
propositions:
  - id: a
    texte: Tu t'écartes de sa route, tu es au vent de lui.
  - id: b
    texte: Tu maintiens ta route, c'est au voilier sous le vent de s'écarter.
  - id: c
    texte: Tu maintiens ta route tant qu'aucun de vous ne change d'amures.
reponses:
  - a
explication: >-
  Quand deux voiliers reçoivent le vent du même bord, la règle 12 a) ii) fait s'écarter
  celui qui est au vent. Le vent vient de la droite : ton voilier, à droite, est le plus
  près du vent, l'autre est sous le vent de toi. C'est donc à toi de t'écarter. Le piège
  est de chercher qui a l'autre sur tribord : entre voiliers, c'est le vent qui décide.
sources:
  - texte: RIPAM, règle 12 a) ii)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-03'
