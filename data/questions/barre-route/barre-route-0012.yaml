id: barre-route-0012
option: cotier
theme: barre-route
statut: publie
difficulte: 2
enonce: >-
  Tu barres un navire à propulsion mécanique et tu aperçois sur ta tribord un autre navire
  à propulsion mécanique, mais vos routes ne se croisent pas et il n'existe aucun risque
  d'abordage. Que t'impose la règle 15 ?
propositions:
  - id: a
    texte: Rien, elle ne joue pas dans cette situation.
  - id: b
    texte: T'écarter de sa route, puisqu'il est sur ta tribord.
  - id: c
    texte: Réduire ta vitesse tant qu'il est en vue.
  - id: d
    texte: Passer sur son arrière avant de reprendre ta route.
reponses:
  - a
explication: >-
  La règle 15 ne s'applique que lorsque deux navires à propulsion mécanique font des routes
  qui se croisent de telle sorte qu'il existe un risque d'abordage. Sans croisement de
  routes et sans risque d'abordage, aucune obligation de manœuvre n'en découle. Le piège
  est de retenir « l'autre sur tribord, je m'écarte » comme un réflexe détaché de sa condition.
sources:
  - texte: RIPAM, règle 15
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: alexis
