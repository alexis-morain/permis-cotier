id: barre-route-0077
option: cotier
theme: barre-route
notion: barre-privilegie-non-privilegie
statut: publie
difficulte: 2
enonce: >-
  Une règle impose à un autre navire de ne pas gêner ton passage. Vous vous rapprochez
  pourtant au point qu'un risque d'abordage existe. Que dit la règle 8 f) iii) de toi ?
propositions:
  - id: a
    texte: Tu gardes ton cap et ta vitesse jusqu'au bout, l'évitement lui revient en entier.
  - id: b
    texte: Tu restes pleinement tenu de te conformer aux règles de la partie B.
  - id: c
    texte: Tu dois t'écarter de sa route, puisqu'il n'a pas su éviter la situation.
  - id: d
    texte: Tu es dispensé de toute manœuvre tant qu'il ne t'a pas gêné.
reponses:
  - b
explication: >-
  La règle 8 f) iii) dit qu'un navire dont le passage ne doit pas être gêné reste
  pleinement tenu de se conformer aux règles de la partie B lorsque les deux navires se
  rapprochent de telle sorte qu'il existe un risque d'abordage. Être protégé par une
  obligation de l'autre ne dispense donc de rien : tu appliques les règles de barre comme
  tout navire. Le piège est de croire que l'évitement pèse sur l'autre seul, jusqu'au bout.
sources:
  - texte: RIPAM, règle 8 f) iii)
    ref: decret-77-733
meta:
  cree_le: '2026-09-26'
  genere_par: claude
  relu_par: alexis
