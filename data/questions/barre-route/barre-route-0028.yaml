id: barre-route-0028
option: cotier
theme: barre-route
notion: barre-privilegie-non-privilegie
statut: brouillon
difficulte: 1
enonce: >-
  Tu es tenu de t'écarter de la route d'un autre navire. Comment la règle 16 te demande-t-elle
  de manœuvrer ?
propositions:
  - id: a
    texte: De bonne heure et franchement, de manière à t'écarter largement.
  - id: b
    texte: Au dernier moment, pour ne pas gêner inutilement les autres navires.
  - id: c
    texte: Seulement après avoir signalé ton intention au sifflet.
  - id: d
    texte: En attendant de voir si l'autre navire manœuvre de son côté.
reponses:
  - a
explication: >-
  La règle 16 tient en une phrase : le navire non privilégié manœuvre de bonne heure,
  franchement, et s'écarte largement. Les trois mots comptent. Attendre pour voir, c'est
  précisément ce que la règle écarte, puisque l'autre navire est de son côté tenu de
  maintenir son cap et sa vitesse. Le signal sonore accompagne la manœuvre, il ne la
  conditionne pas.
sources:
  - texte: RIPAM, règle 16
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
