id: barre-route-0054
option: cotier
theme: barre-route
notion: barre-privilegie-non-privilegie
statut: publie
difficulte: 2
enonce: >-
  Le navire privilégié a fini par manœuvrer devant ton inaction. Es-tu, toi qui devais
  t'écarter, dispensé de le faire ?
propositions:
  - id: a
    texte: Non, la règle 17 ne dispense jamais le navire non privilégié de s'écarter
  - id: b
    texte: Oui, sa manœuvre remplace la tienne
reponses:
  - a
explication: >-
  La règle 17 d) est nette : elle ne saurait dispenser le navire qui doit laisser la route
  libre de l'obligation de s'écarter de la route de l'autre navire. Que le privilégié
  manœuvre ou non, ton obligation reste entière.
sources:
  - texte: RIPAM, règle 17 d)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-05'
