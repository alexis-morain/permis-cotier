id: barre-route-0025
option: cotier
theme: barre-route
notion: barre-manoeuvre-evitement
statut: publie
difficulte: 2
enonce: >-
  Tu dois t'écarter de la route d'un autre navire. Comment la règle 8 te demande-t-elle de
  conduire ta manœuvre ?
propositions:
  - id: a
    texte: >-
      Par un changement assez important pour être immédiatement perçu par l'autre, à l'œil
      comme au radar.
  - id: b
    texte: >-
      Par une succession de petites corrections de cap, plus douces pour l'équipage.
  - id: c
    texte: Par un changement de vitesse seul, le cap ne devant jamais être modifié.
  - id: d
    texte: Par la manœuvre de ton choix, dès lors que l'abordage est évité.
reponses:
  - a
explication: >-
  La règle 8 b) demande un changement de cap ou de vitesse assez ample pour être vu tout
  de suite, et écarte explicitement la succession de petits changements : de l'extérieur,
  ils ne se lisent pas, et l'autre navire ne comprend pas ce que tu fais. La manœuvre doit
  en outre être franche, faite largement à temps, et son efficacité contrôlée jusqu'à ce
  que l'autre soit paré et clair.
sources:
  - texte: RIPAM, règle 8 b)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-04'
