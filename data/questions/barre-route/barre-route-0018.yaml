id: barre-route-0018
option: cotier
theme: barre-route
notion: barre-chenal-etroit
statut: publie
difficulte: 2
enonce: >-
  Tu barres un voilier de 8 mètres dans un chenal étroit et un cargo qui ne peut y naviguer
  en sécurité qu'à l'intérieur du chenal remonte vers toi. Que t'impose la règle 9 ?
propositions:
  - id: a
    texte: Tu ne dois pas gêner son passage.
  - id: b
    texte: Tu es à la voile, il doit s'écarter de ta route.
  - id: c
    texte: Tu dois sortir du chenal et mouiller à l'extérieur.
reponses:
  - a
explication: >-
  La règle 9 b) vise les navires de longueur inférieure à 20 mètres et les navires à voile
  : dans un chenal étroit ou une voie d'accès, ils ne doivent pas gêner le passage des
  navires qui ne peuvent naviguer en toute sécurité qu'à l'intérieur de ce chenal. Ton
  voilier de 8 mètres cumule les deux critères, le cargo passe. Le piège est de transposer
  ici la règle 18, qui fait écarter le navire à moteur devant le voilier : dans un chenal
  étroit, c'est la règle 9 b) qui s'applique. Ne pas gêner ne veut pas dire quitter le
  chenal et mouiller, la règle demande seulement de laisser le passage libre.
sources:
  - texte: RIPAM, règle 9 b)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
