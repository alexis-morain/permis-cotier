id: barre-route-0061
option: cotier
theme: barre-route
notion: barre-visibilite-reduite
statut: publie
difficulte: 2
enonce: >-
  À quels navires s'appliquent les règles de barre de la section II, routes opposées,
  routes qui se croisent, rattrapant ?
propositions:
  - id: a
    texte: Aux navires qui sont en vue les uns des autres
  - id: b
    texte: À tous les navires, par tout temps
  - id: c
    texte: Aux navires détectés au radar seulement
reponses:
  - a
explication: >-
  La règle 11 limite la section II aux navires en vue les uns des autres, c'est-à-dire
  quand l'un peut être observé visuellement par l'autre. Dans la brume, sans contact visuel,
  c'est la règle 19 qui s'applique, et elle ne désigne pas de navire privilégié.
sources:
  - texte: RIPAM, règle 11
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-05'
