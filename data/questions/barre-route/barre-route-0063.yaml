id: barre-route-0063
option: cotier
theme: barre-route
notion: barre-routes-opposees
statut: publie
difficulte: 2
enonce: >-
  Tu fais route au moteur en plein jour. À quoi reconnais-tu, selon la règle 14 b),
  que tu es dans une situation de routes directement opposées ?
propositions:
  - id: a
    texte: Tu vois l'autre navire par le travers tribord.
  - id: b
    texte: Tu vois l'autre navire s'éloigner sur ton arrière.
  - id: c
    texte: Tu vois l'autre navire devant toi ou pratiquement devant toi, sous l'angle correspondant.
reponses:
  - c
explication: >-
  La règle 14 b) donne le même critère pour le jour et pour la nuit : la situation
  existe quand un navire en voit un autre devant lui ou pratiquement devant lui, ce
  qui de jour se voit sous l'angle correspondant à cette position. Un navire vu par
  le travers ou sur l'arrière n'est pas devant toi, la règle 14 ne s'applique donc
  pas à ces rencontres.
sources:
  - texte: RIPAM, règle 14 b)
    ref: decret-77-733
meta:
  cree_le: '2026-09-21'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-21'
