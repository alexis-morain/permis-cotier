id: barre-route-0074
option: cotier
theme: barre-route
notion: barre-visibilite-reduite
statut: publie
difficulte: 2
enonce: >-
  Tu fais route au moteur dans la brume, sans voir personne autour de toi. Que t'impose
  la règle 19 b) ?
propositions:
  - id: a
    texte: Naviguer à une vitesse de sécurité adaptée aux conditions de visibilité réduite.
  - id: b
    texte: Tenir tes machines prêtes à manœuvrer immédiatement.
  - id: c
    texte: Couper ton moteur par intervalles pour mieux entendre autour de toi.
  - id: d
    texte: Mouiller et attendre le retour de la visibilité.
reponses:
  - a
  - b
explication: >-
  La règle 19 b) pose deux obligations dans la même phrase : une vitesse de sécurité
  adaptée aux circonstances et aux conditions de visibilité réduite, et, pour les navires
  à propulsion mécanique, des machines prêtes à manœuvrer immédiatement. Couper son
  moteur ou mouiller n'y figurent pas, et le premier irait contre la seconde obligation.
sources:
  - texte: RIPAM, règle 19 b)
    ref: decret-77-733
meta:
  cree_le: '2026-09-21'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-21'
