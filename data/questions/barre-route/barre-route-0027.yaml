id: barre-route-0027
option: cotier
theme: barre-route
notion: barre-privilegie-non-privilegie
statut: publie
difficulte: 2
enonce: >-
  Un autre navire doit s'écarter de ta route. Que t'impose la règle 17, et que te
  permet-elle ?
propositions:
  - id: a
    texte: >-
      Tu maintiens ton cap et ta vitesse, mais tu peux manœuvrer dès qu'il devient évident
      qu'il n'effectue pas la manœuvre attendue.
  - id: b
    texte: Tu maintiens ton cap et ta vitesse en toutes circonstances, jusqu'au bout.
  - id: c
    texte: Tu manœuvres immédiatement, deux manœuvres valant mieux qu'une.
reponses:
  - a
explication: >-
  La règle 17 a) i) pose le principe, maintenir cap et vitesse, et l'alinéa a) ii) ouvre
  aussitôt la porte : le navire privilégié peut manœuvrer seul dès qu'il lui paraît évident
  que l'autre ne fait pas ce qu'il doit. La règle 17 b) va plus loin, elle l'y oblige quand
  l'abordage ne peut plus être évité par la seule manœuvre de l'autre. Le piège est de
  croire que le privilège est un droit de passage absolu : il n'est qu'une répartition des
  rôles, et il ne dispense personne d'éviter l'abordage.
sources:
  - texte: RIPAM, règle 17 a) et b)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
