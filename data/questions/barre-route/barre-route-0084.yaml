id: barre-route-0084
option: cotier
theme: barre-route
notion: barre-veille-vitesse
statut: publie
difficulte: 2
enonce: >-
  Tu fixes ta vitesse de sécurité en t'aidant de ton radar. Que te rappelle la règle 6 b)
  au sujet des petits bâtiments ?
propositions:
  - id: a
    texte: Leur écho est net, tu les détectes avant les grands navires.
  - id: b
    texte: Ils n'entrent pas en compte, c'est à eux de s'écarter de ta route.
  - id: c
    texte: Le radar peut ne pas les déceler à une distance suffisante.
reponses:
  - c
explication: >-
  Parmi les facteurs propres aux navires qui utilisent un radar, la règle 6 b) iv) cite le
  fait que les petits bâtiments, les glaces et d'autres objets flottants peuvent ne pas
  être décelés par le radar à une distance suffisante. Ta vitesse de sécurité doit donc
  tenir compte de ce qui peut échapper à l'écran.
sources:
  - texte: RIPAM, règle 6 b) iv)
    ref: decret-77-733
meta:
  cree_le: '2026-10-09'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-09'
