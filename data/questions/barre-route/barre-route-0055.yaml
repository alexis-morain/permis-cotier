id: barre-route-0055
option: cotier
theme: barre-route
notion: barre-hierarchie-privileges
statut: publie
difficulte: 2
enonce: >-
  Tu barres un voilier qui fait route à la voile et tu croises un navire à capacité de
  manœuvre restreinte. Qui s'écarte ?
propositions:
  - id: a
    texte: Toi, le voilier s'écarte du navire à capacité de manœuvre restreinte
  - id: b
    texte: Lui, la voile est privilégiée sur tout navire à moteur
reponses:
  - a
explication: >-
  Un navire à voile faisant route s'écarte de la route d'un navire qui n'est pas maître
  de sa manœuvre, d'un navire à capacité de manœuvre restreinte et d'un navire en train
  de pêcher. Le privilège de la voile ne joue que sur le navire à propulsion mécanique
  ordinaire.
sources:
  - texte: RIPAM, règle 18 b)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-05'
