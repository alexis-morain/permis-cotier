id: barre-route-0009
option: cotier
theme: barre-route
statut: publie
difficulte: 2
enonce: >-
  Tu aperçois un navire devant toi sans pouvoir déterminer avec certitude si vos routes
  sont directement opposées. Que fais-tu ?
propositions:
  - id: a
    texte: Tu considères que la situation existe et tu manœuvres en conséquence.
  - id: b
    texte: Tu maintiens ta route et ta vitesse le temps de lever le doute.
  - id: c
    texte: Tu considères qu'il n'y a pas de routes opposées tant que tu n'en es pas sûr.
  - id: d
    texte: Tu viens sur bâbord, la manœuvre la plus sûre quand le doute subsiste.
reponses:
  - a
explication: >-
  La règle 14 c) tranche le doute dans un seul sens : quand un navire ne peut pas déterminer
  avec certitude si la situation existe, il doit considérer qu'elle existe effectivement
  et manœuvrer en conséquence. Le doute pousse donc à agir, pas à attendre. Attention
  aussi au sens de la manœuvre : dans cette situation on vient sur tribord, jamais sur
  bâbord.
sources:
  - texte: RIPAM, règle 14 c)
    ref: decret-77-733
