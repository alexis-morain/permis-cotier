id: balisage-0037
option: cotier
theme: balisage
notion: balisage-feux
statut: publie
difficulte: 3
enonce: >-
  Ce feu et celui de la bouée suivante, plus haut dans le chenal, sont de la même couleur
  mais ne battent pas le même rythme. Qu'en conclus-tu ?
visuel:
  fichier: rythmes/laterale-tribord.svg
  alt: "Feu vert à éclats, la lumière durant nettement moins que l'obscurité qui la sépare de l'éclat suivant."
  credit: code
propositions:
  - id: a
    texte: Les deux marquent le côté tribord du chenal
  - id: b
    texte: Les deux marques bordent des côtés opposés du chenal
reponses:
  - a
explication: >-
  Ce qui identifie une marque latérale est sa couleur, ici le vert, c'est-à-dire le côté
  tribord du chenal en région A, dans le sens conventionnel du large vers le port. Deux bouées
  voisines du même côté peuvent battre des rythmes différents : le rythme d'une latérale est
  quelconque, à une exception près, les éclats diversement groupés (2 + 1), réservés à
  l'endroit où le chenal se divise pour désigner le chenal préféré.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 2.3.2
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 2.3.3
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 2.1.1
    ref: arrete-2017-11-30
