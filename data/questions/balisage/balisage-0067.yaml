id: balisage-0067
option: cotier
theme: balisage
notion: balisage-speciale
statut: publie
difficulte: 2
enonce: >-
  Tu relèves une marque spéciale sur ta route. Où apprends-tu la nature exacte de la zone
  ou de l'installation qu'elle signale ?
propositions:
  - id: a
    texte: Dans les documents nautiques de la zone
  - id: b
    texte: Dans le rythme de son feu, propre à chaque usage
  - id: c
    texte: Dans la forme de son corps, propre à chaque usage
  - id: d
    texte: Sur le pictogramme qu'elle porte obligatoirement
reponses:
  - a
explication: >-
  Le paragraphe 6.1 dit que la marque spéciale indique une zone ou une configuration
  « dont la nature exacte est déterminée en se référant aux documents nautiques
  appropriés ». Son feu a un rythme quelconque et sa forme est au choix, ils ne codent
  donc pas l'usage. Le pictogramme est autorisé par le paragraphe 6.2, pas imposé.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 6.1
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 6.2
    ref: arrete-2017-11-30
