id: balisage-0057
option: cotier
theme: balisage
notion: balisage-lateral
statut: publie
difficulte: 2
enonce: >-
  Une marque latérale est-elle toujours une bouée cylindrique ou conique ?
propositions:
  - id: a
    texte: Non, elle peut aussi être une charpente ou un espar
  - id: b
    texte: Oui, la forme fait partie de la définition de la marque
  - id: c
    texte: Non, mais seulement en région B
reponses:
  - a
explication: >-
  L'arrêté donne pour forme « cylindrique, charpente ou espar » à bâbord et « conique,
  charpente ou espar » à tribord. Une charpente est une structure ajourée posée sur le fond,
  un espar un simple mât : ni l'une ni l'autre n'a la silhouette d'un cylindre ou d'un cône.
  La couleur, elle, ne change pas. Ce n'est pas propre à la région B, qui décrit les mêmes
  formes.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 2.3.1
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 2.3.2
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 2.4.1
    ref: arrete-2017-11-30
