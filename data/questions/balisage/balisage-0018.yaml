id: balisage-0018
option: cotier
theme: balisage
notion: balisage-cardinal
statut: publie
difficulte: 2
enonce: >-
  Tu relèves cette marque. De quel côté la contournes-tu pour trouver des eaux saines
  ?
visuel:
  fichier: balisage/cardinale-sud.svg
  alt: Bouée jaune au-dessus, noire en dessous, surmontée de deux cônes noirs pointes
    en bas.
  credit: code
propositions:
  - id: a
    texte: Par le sud
  - id: b
    texte: Par le nord
  - id: c
    texte: Par l'ouest
reponses:
  - a
explication: >-
  Les deux cônes noirs pointent vers le bas et le corps est jaune au-dessus, noir en dessous
  : c'est une cardinale Sud, on la contourne par le sud. Le piège est la cardinale Nord,
  dont les cônes pointent en haut et dont le noir est en haut du corps. Lis les cônes
  d'abord, ils ne mentent jamais.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 3.1.3
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 3.3.3
    ref: arrete-2017-11-30
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
