id: balisage-0074
option: cotier
theme: balisage
notion: balisage-lateral
statut: publie
difficulte: 2
enonce: >-
  En région A, tu remontes un chenal qui passe sous un pont. Sur une pile, un panneau
  montre un carré plein peint en rouge. Que t'indique-t-il ?
propositions:
  - id: a
    texte: La limite tribord du chenal navigable
  - id: b
    texte: Une travée interdite à la navigation
  - id: c
    texte: Une travée réservée aux très petits bateaux
  - id: d
    texte: La limite bâbord du chenal navigable
reponses:
  - d
explication: >-
  L'annexe III balise de jour les chenaux qui passent sous un pont dangereux pour la
  navigation. En région A, un panneau à carré plein rouge marque le côté bâbord, un panneau
  à triangle plein vert, pointe en haut, le côté tribord. Les travées pour très petits
  bateaux peuvent porter des marques spéciales jaunes, et l'interdiction de passer a ses
  propres panneaux.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe III, 2
    ref: arrete-2017-11-30
meta:
  cree_le: '2026-10-09'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-09'
