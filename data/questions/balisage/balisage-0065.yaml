id: balisage-0065
option: cotier
theme: balisage
notion: balisage-danger-isole
statut: publie
difficulte: 2
enonce: >-
  Le corps d'une marque de danger isolé est noir, barré de rouge. Combien de larges
  bandes horizontales rouges peut-il porter ?
propositions:
  - id: a
    texte: Une seule
  - id: b
    texte: Deux exactement
  - id: c
    texte: Trois au plus
  - id: d
    texte: Une ou plusieurs
reponses:
  - d
explication: >-
  La marque de danger isolé est noire avec une ou plusieurs larges bandes horizontales
  rouges : le nombre de bandes n'est pas fixé. Ce qui compte, c'est le noir barré de rouge
  et le voyant à deux sphères noires. Piège : compter les bandes sur les sphères du voyant,
  qui n'ont rien à voir.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 4.2
    ref: arrete-2017-11-30
meta:
  cree_le: '2026-09-26'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
