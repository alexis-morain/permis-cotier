id: balisage-0011
option: cotier
theme: balisage
notion: balisage-plages
statut: publie
difficulte: 2
enonce: >-
  Tu remontes un chenal traversier en te dirigeant vers le rivage. Quelle est la forme
  des bouées qui marquent la limite bâbord ?
propositions:
  - id: a
    texte: Conique
  - id: b
    texte: Cylindrique
reponses:
  - b
explication: >-
  En allant vers le rivage, les bouées d'un chenal traversier sont cylindriques à bâbord
  et coniques à tribord. En sortant vers le large, c'est l'inverse : c'est le piège classique.
sources:
  - texte: Arrêté du 27 mars 1991, annexe I, paragraphe 2
    ref: arrete-1991-03-27
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
