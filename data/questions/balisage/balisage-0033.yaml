id: balisage-0033
option: cotier
theme: balisage
notion: balisage-speciale
statut: publie
difficulte: 2
enonce: >-
  Tu relèves cette marque sur ta route. Que peux-tu en conclure ?
visuel:
  fichier: balisage/speciale.svg
  alt: "Bouée jaune surmontée d'une croix jaune en forme de X."
  credit: code
propositions:
  - id: a
    texte: Elle délimite une zone ou une installation particulière
  - id: b
    texte: Elle ne signale par elle-même aucun danger pour la navigation
  - id: c
    texte: Elle borde un chenal et se laisse sur bâbord en venant du large
  - id: d
    texte: Elle signale un danger tout juste découvert, absent de tes documents nautiques
reponses:
  - a
  - b
explication: >-
  Corps jaune et voyant en croix jaune en X : c'est une marque spéciale. Elle délimite une
  zone de mouillage, un câble, une conduite, une zone d'exercices, une zone de dépôt ou une
  installation de loisirs, et elle ne dit rien d'un danger de navigation. Le piège est la
  bouée d'épave en cas d'urgence, qui porte elle aussi une croix jaune et un corps à bandes
  verticales bleues et jaunes, mais dont la croix a les branches droites, verticale et
  horizontale, quand celle de la marque spéciale est posée en X.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 6.1
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 6.2
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 7.3
    ref: arrete-2017-11-30
