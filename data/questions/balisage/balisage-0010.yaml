id: balisage-0010
option: cotier
theme: balisage
notion: balisage-danger-nouveau
statut: publie
difficulte: 2
enonce: >-
  Tu passes près d'une bouée à bandes verticales bleues et jaunes. Que signale-t-elle
  ?
propositions:
  - id: a
    texte: Un danger récemment découvert, pas encore porté sur les cartes
  - id: b
    texte: Une zone de mouillage réservée aux navires de commerce
  - id: c
    texte: Des eaux saines, tu peux passer de chaque côté
reponses:
  - a
explication: >-
  Les bandes verticales bleues et jaunes désignent la bouée d'épave en cas d'urgence. Elle est
  l'un des moyens de signaler un danger nouveau, au même titre qu'une marque latérale,
  cardinale ou de danger isolé, tant que ce danger ne figure pas sur les documents nautiques.
  Elle porte une croix jaune aux branches droites, verticale et horizontale, et un feu bleu et
  jaune alternés. Le piège vient de cette croix, que la marque spéciale porte aussi mais posée
  en X, sur un corps entièrement jaune qui ne signale aucun danger.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 7.1
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 7.3
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 7.2
    ref: arrete-2017-11-30
