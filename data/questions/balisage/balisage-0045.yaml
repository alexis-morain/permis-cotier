id: balisage-0045
option: cotier
theme: balisage
notion: balisage-cardinal
statut: publie
difficulte: 2
enonce: >-
  Outre le côté sain d'un danger, que peut signaler une marque cardinale ?
propositions:
  - id: a
    texte: Une configuration particulière du chenal, comme un coude, une jonction ou l'extrémité
      d'un banc
  - id: b
    texte: Une zone réservée à la baignade
  - id: c
    texte: L'entrée d'un port
reponses:
  - a
explication: >-
  L'arrêté prévoit qu'une cardinale sert à indiquer où sont les eaux les plus profondes,
  de quel côté d'un danger sont les eaux saines, ou à attirer l'attention sur une configuration
  particulière du chenal : un coude, une jonction, une bifurcation, l'extrémité d'un banc.
  La baignade relève des marques spéciales, l'entrée d'un port d'une marque d'eaux saines.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 3.2
    ref: arrete-2017-11-30
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-05'
