id: balisage-0017
option: cotier
theme: balisage
notion: balisage-cardinal
statut: publie
difficulte: 2
enonce: >-
  Tu relèves cette marque. De quel côté la contournes-tu pour trouver des eaux saines
  ?
visuel:
  fichier: balisage/cardinale-nord.svg
  alt: Bouée noire au-dessus, jaune en dessous, surmontée de deux cônes noirs pointes
    en haut.
  credit: code
propositions:
  - id: a
    texte: Par le nord
  - id: b
    texte: Par le sud
  - id: c
    texte: Par l'ouest
reponses:
  - a
explication: >-
  Une marque cardinale Nord porte deux cônes noirs pointes en haut, et son corps est noir
  au-dessus, jaune en dessous. Les cônes montrent où sont les eaux saines : pointes en
  haut, on passe au nord. Le corps confirme, la bande noire est du côté vers lequel les
  pointes se dirigent.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 3.1.3
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 3.3.1
    ref: arrete-2017-11-30
