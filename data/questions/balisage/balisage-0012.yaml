id: balisage-0012
option: cotier
theme: balisage
notion: balisage-plages
statut: publie
difficulte: 3
enonce: >-
  Dans un chenal traversier, à moins de 50 mètres du rivage, quel est l'intervalle de
  mouillage entre deux bouées latérales ?
propositions:
  - id: a
    texte: 10 mètres
  - id: b
    texte: 25 mètres
  - id: c
    texte: 50 mètres
reponses:
  - a
explication: >-
  Dans un chenal traversier, l'intervalle entre bouées se resserre vers la plage : 50 mètres
  entre la ligne des 300 mètres et 150 mètres du rivage, 25 mètres entre 150 et 50 mètres,
  10 mètres à moins de 50 mètres. Les trois valeurs servent de distracteurs les unes aux
  autres.
sources:
  - texte: Arrêté du 27 mars 1991, annexe I, paragraphe 2
    ref: arrete-1991-03-27
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
