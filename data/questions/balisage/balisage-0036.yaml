id: balisage-0036
option: cotier
theme: balisage
notion: balisage-feux
statut: publie
difficulte: 3
enonce: >-
  De nuit, tu remontes un chenal depuis le large et tu relèves ce feu. Qu'en conclus-tu ?
visuel:
  fichier: rythmes/laterale-babord.svg
  alt: "Feu rouge à éclats, la lumière durant nettement moins que l'obscurité qui la sépare de l'éclat suivant."
  credit: code
propositions:
  - id: a
    texte: Sa couleur marque la limite bâbord du chenal, tu le laisses sur bâbord
  - id: b
    texte: La couleur ne dit rien du côté, seul le voyant vu de jour le donne
reponses:
  - a
explication: >-
  En région A, le feu d'une marque latérale bâbord est rouge, celui d'une latérale tribord est
  vert : c'est la couleur qui donne le côté. Comme tu remontes le chenal dans le sens
  conventionnel, du large vers le port, le feu rouge reste sur ton bâbord. Le rythme, lui, est
  quelconque à une exception près : les éclats diversement groupés (2 + 1) sont réservés au
  chenal préféré, là où le chenal se divise. Le danger isolé, lui, a un feu blanc.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 2.1.1
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 2.3.1
