id: balisage-0001
option: cotier
theme: balisage
notion: balisage-lateral
statut: publie
difficulte: 1
enonce: >-
  Tu rentres au port en venant du large. Quelles sont la couleur et la forme de la marque
  latérale que tu laisses sur bâbord ?
propositions:
  - id: a
    texte: Rouge, de forme cylindrique
  - id: b
    texte: Verte, de forme conique
  - id: c
    texte: Rouge, de forme conique
reponses:
  - a
explication: >-
  En région A, dont la France métropolitaine fait partie, la marque latérale bâbord est
  rouge et cylindrique, dite « en boîte de conserve », avec un voyant cylindrique rouge. Le
  sens conventionnel de balisage est celui du large vers le port, donc en rentrant tu la
  laisses bien à bâbord. Deux pièges : la région B, celle de Saint-Pierre-et-Miquelon, la
  Guyane, la Martinique et la Guadeloupe, où les couleurs latérales sont inversées ; et la
  forme, le cône étant celui de la marque tribord.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 2.3.1
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 2.2
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 2.1.1
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 2.4.1
    ref: arrete-2017-11-30
