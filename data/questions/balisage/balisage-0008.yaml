id: balisage-0008
option: cotier
theme: balisage
notion: balisage-plages
statut: publie
difficulte: 1
enonce: >-
  Tu longes la limite extérieure de la bande des 300 mètres. Quelle est la forme des bouées
  qui la matérialisent ?
propositions:
  - id: a
    texte: Sphériques
  - id: b
    texte: Cylindriques à bâbord et coniques à tribord
reponses:
  - a
explication: >-
  Les bouées de la limite extérieure de la bande des 300 mètres sont sphériques, toutes de
  mêmes dimensions, avec un diamètre d'au moins 0,80 mètre. Piège : c'est dans les chenaux
  traversiers, et là seulement, que la forme change selon le bord, cylindrique à bâbord et
  conique à tribord.
sources:
  - texte: Arrêté du 27 mars 1991, annexe I, paragraphe 1
    ref: arrete-1991-03-27
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
