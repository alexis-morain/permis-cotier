id: balisage-0006
option: cotier
theme: balisage
statut: publie
difficulte: 2
enonce: >-
  Tu approches d'une bouée jaune surmontée d'une croix jaune en forme de X. Que t'indique-t-elle
  ?
propositions:
  - id: a
    texte: Une zone ou une installation particulière, pas un danger de navigation
  - id: b
    texte: Un danger récemment découvert, absent des documents nautiques
  - id: c
    texte: Le côté tribord du chenal, en venant du large
  - id: d
    texte: Un haut-fond à contourner par le côté indiqué
reponses:
  - a
explication: >-
  La marque spéciale est jaune, avec un voyant en croix jaune, et son feu est jaune. Elle
  ne signale aucun danger de navigation : elle délimite une zone de mouillage, un câble,
  une conduite, une zone d'exercices ou une installation de loisirs. Le piège est la marque
  de danger nouveau, qui porte le même voyant en croix jaune mais un corps à bandes verticales
  bleues et jaunes et un feu bleu et jaune alternés : c'est la couleur du corps qui les
  sépare.
sources:
  - texte: Balisage AISM, marques spéciales
    ref: aism-mbs
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-04'
