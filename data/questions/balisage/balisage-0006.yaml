id: balisage-0006
option: cotier
theme: balisage
notion: balisage-speciale
famille: balisage-speciale-de-jour
statut: publie
difficulte: 2
enonce: >-
  Tu approches de cette bouée. Que t'indique-t-elle ?
visuel:
  fichier: balisage/speciale.svg
  alt: "Bouée jaune surmontée d'une croix jaune en forme de X."
  credit: code
propositions:
  - id: a
    texte: Une zone ou une installation particulière, à lire dans les documents nautiques
  - id: b
    texte: Un danger récemment découvert, absent des documents nautiques
reponses:
  - a
explication: >-
  La marque spéciale est jaune, avec un voyant en croix jaune posée en X, et son feu est
  jaune. Elle n'a pas pour but principal d'aider la navigation : elle indique une zone de
  mouillage, un câble, une conduite, une zone d'exercices ou une installation de loisirs, et
  les documents nautiques disent laquelle. Le piège est la bouée d'épave en cas d'urgence, à
  bandes verticales bleues et jaunes et feu bleu et jaune alternés : sa croix jaune, elle, a
  les branches droites, verticale et horizontale.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 6.1
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 6.2
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 7.3
    ref: arrete-2017-11-30
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-13'
