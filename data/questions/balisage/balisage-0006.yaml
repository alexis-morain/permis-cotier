id: balisage-0006
option: cotier
theme: balisage
notion: balisage-speciale
statut: publie
difficulte: 2
enonce: >-
  Tu approches d'une bouée jaune surmontée d'une croix jaune en forme de X. Que t'indique-t-elle
  ?
propositions:
  - id: a
    texte: Une zone ou une installation particulière, pas un danger de navigation
  - id: b
    texte: Un danger récemment découvert, absent des documents nautiques
reponses:
  - a
explication: >-
  La marque spéciale est jaune, avec un voyant en croix jaune posée en X, et son feu est
  jaune. Elle ne signale aucun danger de navigation : elle délimite une zone de mouillage, un
  câble, une conduite, une zone d'exercices ou une installation de loisirs. Le piège est la
  bouée d'épave en cas d'urgence, à bandes verticales bleues et jaunes et feu bleu et jaune
  alternés : sa croix jaune, elle, a les branches droites, verticale et horizontale.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 6.1
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 6.2
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 7.3
    ref: arrete-2017-11-30
