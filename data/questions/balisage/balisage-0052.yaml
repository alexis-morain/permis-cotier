id: balisage-0052
option: cotier
theme: balisage
notion: balisage-feux
statut: publie
difficulte: 1
enonce: >-
  De nuit, qu'est-ce qui te permet d'identifier une marque de balisage ?
propositions:
  - id: a
    texte: La couleur et le rythme de son feu
  - id: b
    texte: La forme de son corps
  - id: c
    texte: Son voyant
reponses:
  - a
explication: >-
  De nuit, la signification d'une marque est donnée par la couleur et le rythme de son
  feu. La forme, la couleur du corps et le voyant sont les caractères de jour, invisibles
  dans l'obscurité.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 1.3
    ref: arrete-2017-11-30
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-05'
