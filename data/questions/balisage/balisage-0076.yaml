id: balisage-0076
option: cotier
theme: balisage
notion: balisage-feux
statut: publie
difficulte: 2
enonce: >-
  De quelle couleur l'arrêté permet-il que soit le feu d'un phare ?
propositions:
  - id: a
    texte: Blanc uniquement
  - id: b
    texte: Blanc ou jaune
  - id: c
    texte: Rouge ou vert, selon le côté du chenal
  - id: d
    texte: Blanc, rouge ou vert
reponses:
  - d
explication: >-
  Le paragraphe 8.3.2 donne au feu d'un phare la couleur blanche, rouge ou verte, avec un
  rythme choisi pour le rendre rapidement identifiable. Le jaune est la couleur du feu des
  marques spéciales (6.2). Un phare n'est pas une marque latérale : c'est une tour ou une
  structure de taille conséquente, érigée en un lieu remarquable, qui porte un feu de grande
  ou moyenne portée (8.3.1).
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 8.3.2
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 8.3.1
    ref: arrete-2017-11-30
