id: balisage-0027
option: cotier
theme: balisage
notion: balisage-feux
statut: publie
difficulte: 2
enonce: >-
  De nuit, tu relèves ce feu qui alterne le bleu et le jaune. Que fait la marque qui le
  porte ?
visuel:
  fichier: rythmes/danger-nouveau.svg
  alt: "Feu alternant le bleu et le jaune, une seconde chacun, séparés par un court intervalle sombre."
  credit: code
propositions:
  - id: a
    texte: Elle signale un danger récemment découvert, encore absent des cartes
  - id: b
    texte: Elle délimite une zone de mouillage ou une installation de loisirs
  - id: c
    texte: Elle marque le milieu du chenal, eaux saines tout autour
reponses:
  - a
explication: >-
  Le feu bleu et jaune alternés n'appartient qu'à la bouée d'épave en cas d'urgence. Elle
  signale un danger tout juste découvert, une épave par exemple, tant qu'il ne figure pas
  encore sur les documents nautiques. C'est l'un des moyens prévus pour cela, avec la marque
  latérale, la cardinale et la marque de danger isolé. Le doublement d'une marque est autre
  chose : il intervient si le service responsable juge le danger particulièrement grave, et le
  double est alors en tous points identique à la marque qu'il accompagne.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 7.2.1
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 7.3
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 7.2.3
    ref: arrete-2017-11-30
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
