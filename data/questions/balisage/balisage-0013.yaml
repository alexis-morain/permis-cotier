id: balisage-0013
option: cotier
theme: balisage
notion: balisage-plages
statut: publie
difficulte: 2
enonce: >-
  La limite d'une zone réservée à la baignade est marquée par de petites sphères reliées
  par un filin flottant. Quel est leur diamètre ?
propositions:
  - id: a
    texte: 0,20 mètre
  - id: b
    texte: 0,40 mètre
  - id: c
    texte: 0,60 mètre
  - id: d
    texte: 0,80 mètre
reponses:
  - a
explication: >-
  L'annexe I, paragraphe 3.2, autorise pour les zones réservées à la baignade des sphères
  de moindres dimensions, d'un diamètre de 0,20 mètre, reliées par un filin flottant et
  espacées de 5 à 10 mètres. C'est une dérogation au paragraphe 3.1, qui impose sinon
  un diamètre d'au moins 0,40 mètre pour les limites de zones réglementées : les autres
  valeurs proposées sont celles de ce régime général.
sources:
  - texte: Arrêté du 27 mars 1991, annexe I, paragraphe 3.2
    ref: arrete-1991-03-27
