id: balisage-0013
option: cotier
theme: balisage
notion: balisage-plages
statut: publie
difficulte: 2
enonce: >-
  La limite d'une zone réservée à la baignade est marquée par de petites sphères reliées
  par un filin flottant. Quel est leur diamètre ?
propositions:
  - id: a
    texte: 0,20 mètre
  - id: b
    texte: 0,40 mètre
  - id: c
    texte: 0,80 mètre
reponses:
  - a
explication: >-
  Pour une zone réservée à la baignade, on peut utiliser des sphères plus petites, de 0,20
  mètre de diamètre, reliées par un filin flottant et espacées de 5 à 10 mètres. C'est une
  dérogation : les autres limites de zones réglementées exigent au moins 0,40 mètre, et les
  autres valeurs proposées viennent de ce régime général.
sources:
  - texte: Arrêté du 27 mars 1991, annexe I, paragraphe 3.2
    ref: arrete-1991-03-27
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
