id: balisage-0016
option: cotier
theme: balisage
notion: balisage-plages
statut: publie
difficulte: 2
enonce: >-
  Tu navigues dans un chenal réglementé créé à l'intérieur de la bande littorale des 300
  mètres. À quelle catégorie de marques appartiennent les bouées qui en balisent les limites
  ?
propositions:
  - id: a
    texte: Aux marques latérales.
  - id: b
    texte: Aux marques cardinales.
  - id: c
    texte: Aux marques spéciales.
reponses:
  - c
explication: >-
  La limite des 300 mètres et celles des zones et chenaux réglementés créés en deçà sont
  matérialisées par des bouées qui ont les caractères des marques spéciales. Piège : le mot
  « chenal » fait penser au balisage latéral, bâbord et tribord, alors que ces bouées sont
  des marques spéciales.
sources:
  - texte: Arrêté du 27 mars 1991, article 1
    ref: arrete-1991-03-27
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
