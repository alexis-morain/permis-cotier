id: balisage-0064
option: cotier
theme: balisage
notion: balisage-chenal-prefere
statut: publie
difficulte: 2
enonce: >-
  Un chenal balisé se divise en deux branches. Que prévoit l'arrêté pour signaler celle
  qu'il convient d'emprunter de préférence ?
propositions:
  - id: a
    texte: Une marque de danger isolé, mouillée à la pointe de la bifurcation
  - id: b
    texte: Une marque latérale modifiée, qu'il permet sans l'imposer
  - id: c
    texte: Une marque latérale modifiée, obligatoire à chaque bifurcation
  - id: d
    texte: Une marque spéciale jaune, mouillée à la pointe de la bifurcation
reponses:
  - b
explication: >-
  Le paragraphe 2.3.3 dit qu'en un point où un chenal se divise, « on peut indiquer » le
  chenal à emprunter de préférence par une marque latérale modifiée, rouge à bande verte ou
  verte à bande rouge. C'est une faculté, pas une obligation : une bifurcation peut rester
  sans marque de chenal préféré. Le danger isolé et la marque spéciale ont d'autres usages,
  fixés aux chapitres 4 et 6.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 2.3.3
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 1.2.1
    ref: arrete-2017-11-30
