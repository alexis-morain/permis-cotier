id: balisage-0014
option: cotier
theme: balisage
notion: balisage-pictogrammes
statut: publie
difficulte: 2
enonce: >-
  Sur la bande littorale des 300 mètres, un pictogramme montre une figure blanche sur
  fond bleu. Que t'indique-t-il ?
propositions:
  - id: a
    texte: Que l'activité représentée est autorisée
  - id: b
    texte: Que l'activité représentée est interdite
reponses:
  - a
explication: >-
  Le paragraphe 1 de l'annexe II ne connaît que deux codes : la figure blanche sur fond
  bleu vaut autorisation, la figure noire sur fond blanc bordé et barré de rouge vaut
  interdiction. Le fond bleu est donc le signe de l'autorisation. Le piège tient à l'inversion
  des deux codes, et au réflexe qui associe un panneau à une contrainte plutôt qu'à une
  permission.
sources:
  - texte: Arrêté du 27 mars 1991, annexe II, paragraphe 1
    ref: arrete-1991-03-27
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
