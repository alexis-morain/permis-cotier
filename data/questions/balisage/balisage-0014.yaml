id: balisage-0014
option: cotier
theme: balisage
notion: balisage-pictogrammes
famille: balisage-pictogramme-nature
statut: publie
difficulte: 2
enonce: >-
  Sur la bande littorale des 300 mètres, un pictogramme montre une figure blanche sur
  fond bleu. Que t'indique-t-il ?
propositions:
  - id: a
    texte: Que l'activité représentée est autorisée
  - id: b
    texte: Que l'activité représentée est interdite
reponses:
  - a
explication: >-
  Il n'y a que deux codes : figure blanche sur fond bleu pour l'autorisation, figure noire
  sur fond blanc bordé et barré de rouge pour l'interdiction. Le fond bleu signifie donc que
  l'activité est autorisée. Piège : inverser les deux codes, ou associer un panneau à une
  contrainte plutôt qu'à une permission.
sources:
  - texte: Arrêté du 27 mars 1991, annexe II, paragraphe 1
    ref: arrete-1991-03-27
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
