id: balisage-0034
option: cotier
theme: balisage
notion: balisage-danger-nouveau
statut: publie
difficulte: 3
enonce: >-
  Tu relèves cette marque, et elle ne figure sur aucun de tes documents nautiques.
  Qu'en conclus-tu ?
visuel:
  fichier: balisage/danger-nouveau.svg
  alt: "Bouée à bandes verticales bleues et jaunes, surmontée d'une croix jaune droite."
  credit: code
propositions:
  - id: a
    texte: C'est une bouée d'épave en cas d'urgence, elle signale un danger nouveau
  - id: b
    texte: Son absence des documents est normale, le danger vient d'être découvert
  - id: c
    texte: C'est une marque spéciale, sa croix jaune en X le dit
  - id: d
    texte: Ton édition de carte est périmée, la marque figure sur la suivante
reponses:
  - a
  - b
explication: >-
  Les bandes verticales bleues et jaunes désignent la bouée d'épave en cas d'urgence. Un
  danger nouveau se signale par une marque latérale, cardinale, de danger isolé ou par cette
  bouée-là : elle est l'un des moyens prévus, pas un ajout au balisage ordinaire. Sa raison
  d'être est justement que le danger vient d'être découvert et n'est pas encore porté sur les
  documents nautiques : la trouver absente de tes cartes n'est pas une anomalie. Sa croix
  jaune a les branches droites ; celle de la marque spéciale est posée en X, sur un corps
  entièrement jaune.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 7.1
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 7.3
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 7.2
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 6.2
    ref: arrete-2017-11-30
