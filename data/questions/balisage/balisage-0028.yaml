id: balisage-0028
option: cotier
theme: balisage
notion: balisage-feux
statut: publie
difficulte: 2
enonce: >-
  Tu relèves ce feu jaune de nuit. Que peux-tu en dire ?
visuel:
  fichier: rythmes/speciale.svg
  alt: "Feu jaune à éclats, la lumière durant nettement moins que l'obscurité qui la sépare de l'éclat suivant."
  credit: code
propositions:
  - id: a
    texte: C'est une marque spéciale, elle signale une zone ou une installation particulière
  - id: b
    texte: Son rythme est quelconque, c'est sa couleur qui l'identifie
  - id: c
    texte: Son rythme donne le côté par lequel il faut la contourner
  - id: d
    texte: Elle signale un danger de faible étendue entouré d'eaux saines
reponses:
  - a
  - b
explication: >-
  La marque spéciale porte un feu jaune de rythme quelconque, choisi seulement pour ne pas
  se confondre avec ceux des cardinales, du danger isolé et des eaux saines, qui sont à feu
  blanc. Elle n'a pas pour but principal d'aider la navigation : zone de mouillage, câble,
  conduite, zone d'exercices, installation de loisirs. De nuit, tu ne cherches donc pas à
  compter ses éclats, tu regardes sa couleur. Compter le rythme sert pour les marques à feu
  blanc, et pour le chenal préféré, dont le 2 + 1 distingue la marque latérale ordinaire.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 6.1
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 6.2
    ref: arrete-2017-11-30
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-03'
