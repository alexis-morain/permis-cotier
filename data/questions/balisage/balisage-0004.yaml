id: balisage-0004
option: cotier
theme: balisage
notion: balisage-danger-isole
statut: publie
difficulte: 2
enonce: >-
  Tu passes près d'une bouée noire à large bande horizontale rouge, surmontée de deux
  sphères noires superposées. Que signale-t-elle ?
propositions:
  - id: a
    texte: Un danger de faible étendue, entouré d'eaux saines
  - id: b
    texte: Des eaux saines tout autour, milieu de chenal
  - id: c
    texte: Un danger nouveau, pas encore porté sur les cartes
reponses:
  - a
explication: >-
  C'est la marque de danger isolé : corps noir avec une ou plusieurs larges bandes horizontales
  rouges, voyant de deux sphères noires superposées, feu blanc à deux éclats groupés.
  Elle est mouillée sur le danger lui-même, qui est de faible étendue et entouré d'eaux
  saines. Ne la confonds pas avec la marque d'eaux saines, qui porte une seule sphère
  rouge et des bandes verticales, ni avec la marque de danger nouveau, à bandes bleues
  et jaunes.
sources:
  - texte: Balisage AISM, marque de danger isolé
    ref: aism-mbs
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
