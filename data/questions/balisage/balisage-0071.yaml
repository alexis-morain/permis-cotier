id: balisage-0071
option: cotier
theme: balisage
notion: balisage-feux
famille: balisage-eaux-saines-de-nuit
statut: publie
difficulte: 2
enonce: >-
  Parmi ces rythmes, que peut montrer le feu blanc d'une marque d'eaux saines ?
propositions:
  - id: a
    texte: Six scintillements suivis d'un éclat long
  - id: b
    texte: Un feu isophase
  - id: c
    texte: Un scintillement continu
  - id: d
    texte: La lettre « A » du code Morse
reponses:
  - b
  - d
explication: >-
  Le feu d'une marque d'eaux saines est blanc, avec quatre rythmes possibles : isophase, à
  occultations, à un éclat long toutes les 10 secondes, ou lettre Morse « A ». Les
  scintillements sont ceux des cardinales : continus au Nord, par six suivis d'un éclat long
  au Sud. Un éclat long derrière six scintillements, c'est donc une cardinale Sud.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 5.2
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 3.3.1 et 3.3.3
    ref: arrete-2017-11-30
