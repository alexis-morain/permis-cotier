id: balisage-0035
option: cotier
theme: balisage
notion: balisage-feux
statut: publie
difficulte: 2
enonce: >-
  Tu relèves ce feu blanc de nuit. Quelle marque as-tu devant toi ?
visuel:
  fichier: rythmes/eaux-saines-morse-a.svg
  alt: "Feu blanc battant la lettre A du code Morse, un éclat bref suivi d'un éclat long."
  credit: code
propositions:
  - id: a
    texte: Une marque d'eaux saines
  - id: b
    texte: Une marque de danger isolé
  - id: c
    texte: Une cardinale Est
reponses:
  - a
explication: >-
  Chaque marque a son rythme, et c'est lui qu'on lit de nuit : la cardinale Nord scintille
  sans s'arrêter, l'Est bat trois éclats, la Sud six suivis d'un éclat long, l'Ouest neuf. Le
  danger isolé, lui, se reconnaît à ses éclats groupés par deux, sur un feu blanc.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 5.2
    ref: arrete-2017-11-30
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
