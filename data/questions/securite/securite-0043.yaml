id: securite-0043
option: cotier
theme: securite
notion: securite-incendie-mouillage
statut: publie
difficulte: 3
enonce: >-
  Ton bateau n'est pas marqué CE. Un vieil extincteur au Halon traîne dans le garage :
  peux-tu l'embarquer ?
propositions:
  - id: a
    texte: Non, les agents au Halon et au perfluorocarbone sont interdits
  - id: b
    texte: Oui, s'il est encore sous pression et dans sa durée de vie
reponses:
  - a
explication: >-
  L'annexe 240-A3, qui fixe les extincteurs des navires exclus du marquage CE, interdit
  d'utiliser un agent extincteur contenant du Halon 1211, 1301, 2402 ou du perfluorocarbone.
  Les extincteurs admis sont marqués barre à roue, MMF ou NF EN 3, et leur durée de vie est
  fixée par le fabricant. Sur un navire marqué CE, c'est le manuel du propriétaire qui dit
  lesquels embarquer.
sources:
  - texte: Division 240, annexe 240-A3, II. 1
    ref: division-240
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-03'
