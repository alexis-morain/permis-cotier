id: securite-0003
option: cotier
theme: securite
notion: securite-equipement-individuel
statut: publie
difficulte: 3
enonce: >-
  Tu embarques un enfant de 25 kg pour une sortie à un mille d'un abri. Quel équipement
  individuel de flottabilité doit-il porter ?
propositions:
  - id: a
    texte: Un EIF de niveau de performance 50
  - id: b
    texte: Un EIF de niveau de performance 100
  - id: c
    texte: Un EIF de son choix, le niveau n'étant imposé qu'au-delà de deux milles d'un
      abri
reponses:
  - b
explication: >-
  Un enfant de 30 kg au maximum doit porter un EIF de niveau 100, dès que le bateau est
  soumis à l'emport d'un EIF, quelle que soit la distance d'éloignement d'un abri. Le niveau
  50, suffisant pour un adulte près de la côte, ne convient donc jamais pour lui.
sources:
  - texte: Division 240, article 240-2.01, alinéa 6
    ref: division-240
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
