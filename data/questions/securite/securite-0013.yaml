id: securite-0013
option: cotier
theme: securite
notion: securite-armement-cotier
statut: publie
difficulte: 2
enonce: >-
  Le dispositif de repérage et d'assistance pour personne tombée à l'eau que tu embarques
  doit porter un feu. Quelle autonomie et quelle portée la division 240 lui demande-t-elle ?
propositions:
  - id: a
    texte: Au moins six heures d'autonomie, visible sur tout l'horizon jusqu'à un demi-mille.
  - id: b
    texte: Au moins deux heures d'autonomie, visible jusqu'à deux milles.
  - id: c
    texte: Au moins douze heures d'autonomie, visible jusqu'à un mille.
  - id: d
    texte: Aucune exigence chiffrée, le dispositif devant seulement être lumineux.
reponses:
  - a
explication: >-
  Six heures et un demi-mille : la division 240 chiffre l'un et l'autre. Ces deux nombres
  disent le scénario que la règle a en tête, une recherche de nuit qui peut durer, menée à
  vue depuis un bateau tout proche. Le dispositif doit aussi flotter à 142 newtons au
  moins, se larguer sans source d'énergie et rester efficace quelle que soit sa position
  dans l'eau.
sources:
  - texte: Division 240, article 240-2.17
    ref: division-240
