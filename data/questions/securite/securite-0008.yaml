id: securite-0008
option: cotier
theme: securite
notion: securite-incendie-mouillage
statut: publie
difficulte: 2
enonce: >-
  Où sont définis le type de ton extincteur portatif d'incendie, son emplacement et sa
  signalisation ?
propositions:
  - id: a
    texte: Dans le manuel du propriétaire ou, à défaut, dans l'annexe 240-A3.
  - id: b
    texte: Dans l'annexe 240-A3 uniquement, le manuel du propriétaire n'ayant pas valeur
      réglementaire.
  - id: c
    texte: Nulle part, le chef de bord décide librement.
reponses:
  - a
explication: >-
  Le type, l'emplacement et la signalisation de l'extincteur se lisent dans le manuel du
  propriétaire. À défaut de manuel, la réglementation donne des règles par défaut, qui
  viennent donc en second. Piège : inverser cet ordre, ou croire que le chef de bord choisit
  librement.
sources:
  - texte: Division 240, article 240-2.03, point 3
    ref: division-240
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
