id: securite-0020
option: cotier
theme: securite
notion: securite-pieces-administratives
statut: publie
difficulte: 3
enonce: >-
  Tu loues un bateau qui comporte un espace habitable. Où trouves-tu le rapport de sa
  dernière vérification spéciale ?
propositions:
  - id: a
    texte: Annexé à ton contrat de location, et embarqué à bord puisque le navire comporte
      un espace habitable
  - id: b
    texte: Au seul registre des vérifications spéciales, consultable dans les locaux du
      loueur
  - id: c
    texte: À bord seulement, le contrat de location n'ayant pas à le mentionner
reponses:
  - a
explication: >-
  La copie du dernier rapport est annexée au contrat de location et embarquée à bord des
  navires qui comportent un espace habitable. Le registre des vérifications spéciales
  existe, archive tous les rapports et est mis à ta disposition avant l'embarquement, mais
  il vient en plus, pas à la place. La vérification est faite sous la responsabilité du
  propriétaire ou de l'exploitant, pas de l'administration.
sources:
  - texte: Division 240, article 240-3.01, II
    ref: division-240
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
