id: securite-0010
option: cotier
theme: securite
notion: securite-armement-cotier
statut: publie
difficulte: 2
enonce: >-
  Tu armes ton bateau pour une navigation de 2 à moins de 6 milles d'un abri. Quels moyens
  de signalisation de détresse dois-tu embarquer ?
propositions:
  - id: a
    texte: Trois feux rouges à main
  - id: b
    texte: Six feux rouges à main
  - id: c
    texte: Trois fumigènes flottants
reponses:
  - a
explication: >-
  De 2 à moins de 6 milles d'un abri, il faut trois feux rouges à main. Le piège tient au
  nombre, que l'on retient volontiers de travers, et au type d'artifice : c'est le feu rouge
  à main, pas le fumigène.
sources:
  - texte: Division 240, article 240-2.04, point 4
    ref: division-240
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
