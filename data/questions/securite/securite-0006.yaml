id: securite-0006
option: cotier
theme: securite
notion: securite-armement-basique
famille: securite-dispense-mouillage
statut: publie
difficulte: 3
enonce: >-
  Ton bateau à moteur a un déplacement lège de 200 kg et une puissance propulsive de 6
  kW. Es-tu dispensé de ligne de mouillage ?
propositions:
  - id: a
    texte: Oui, son déplacement lège est inférieur à 250 kg.
  - id: b
    texte: Non, la dispense exige aussi une puissance d'au plus 4,5 kW.
reponses:
  - b
explication: >-
  Sont dispensés de ligne de mouillage les navires motorisés de moins de 250 kg de
  déplacement lège et de 4,5 kW (6,1 ch) au plus. Les deux conditions se cumulent : avec 6
  kW, la dispense tombe malgré les 200 kg. Piège : ne retenir que le poids, qui suffit pour
  un navire à voile mais pas pour un navire à moteur.
sources:
  - texte: Division 240, article 240-2.03, point 6
    ref: division-240
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
