id: securite-0029
option: cotier
theme: securite
notion: securite-categories-conception
statut: publie
difficulte: 2
enonce: >-
  Ton bateau est en catégorie de conception B. Que t'apprend cette catégorie ?
propositions:
  - id: a
    texte: Le vent et la hauteur de vague qu'il est conçu pour affronter
  - id: b
    texte: La distance d'un abri jusqu'à laquelle tu es autorisé à t'éloigner
  - id: c
    texte: Le nombre maximal de personnes que tu peux embarquer
  - id: d
    texte: La liste du matériel de sécurité à embarquer
reponses:
  - a
explication: >-
  L'article 245-1.02, II. 9 attache à chaque catégorie une force de vent et une hauteur
  significative de vagues : la catégorie dit ce que le bateau est conçu pour encaisser,
  rien d'autre. C'est la confusion classique : elle ne t'autorise pas à t'éloigner plus
  loin. L'éloignement dépend du matériel d'armement embarqué, fixé par la division 240,
  et le nombre de personnes se lit sur la plaque signalétique.
sources:
  - texte: Division 245, article 245-1.02, II. 9
    ref: division-245
