id: securite-0029
option: cotier
theme: securite
notion: securite-categories-conception
statut: publie
difficulte: 2
enonce: >-
  Ton bateau est en catégorie de conception B. Que t'apprend cette catégorie ?
propositions:
  - id: a
    texte: Le vent et la hauteur de vague qu'il est conçu pour affronter
  - id: b
    texte: La distance d'un abri jusqu'à laquelle tu es autorisé à t'éloigner
reponses:
  - a
explication: >-
  La catégorie de conception dit quel vent et quelle hauteur de vagues le bateau est conçu
  pour encaisser, rien d'autre. Piège classique : elle ne t'autorise pas à t'éloigner plus
  loin. L'éloignement dépend du matériel d'armement embarqué, et le nombre de personnes se
  lit sur la plaque signalétique.
sources:
  - texte: Division 245, article 245-1.02, II. 9
    ref: division-245
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
