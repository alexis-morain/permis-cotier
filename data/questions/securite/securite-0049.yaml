id: securite-0049
option: cotier
theme: securite
notion: securite-plongeurs
statut: publie
difficulte: 2
enonce: >-
  Tu relèves à la surface un pavillon rouge portant une diagonale blanche, sans navire
  autour. Que t'annonce-t-il ?
propositions:
  - id: a
    texte: La présence d'un plongeur isolé
  - id: b
    texte: Un casier de pêche de loisir
  - id: c
    texte: Une zone de baignade surveillée
reponses:
  - a
explication: >-
  Les arrêtés des préfets maritimes demandent au plongeur isolé de signaler sa présence
  par un pavillon rouge portant une croix de Saint-André blanche, ou par un pavillon rouge
  portant une diagonale blanche. C'est le pavillon du plongeur seul ; le navire qui
  participe à des opérations de plongée, lui, arbore le pavillon A du Code international
  des signaux.
sources:
  - texte: Arrêté du préfet maritime de la Méditerranée n° 125/2013, article 6
    ref: fiche-ski-nautique
  - texte: Arrêté du préfet maritime de l'Atlantique n° 2018/090, article 3-4
    ref: fiche-ski-nautique
