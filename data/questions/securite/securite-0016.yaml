id: securite-0016
option: cotier
theme: securite
notion: securite-limitations
statut: publie
difficulte: 3
enonce: >-
  Tu veux emmener ton véhicule nautique à moteur à quatre milles d'un abri. Que demande
  la division 240 en plus de l'armement ?
propositions:
  - id: a
    texte: Que le véhicule compte au moins deux places
  - id: b
    texte: Que le véhicule compte au moins trois places
reponses:
  - a
explication: >-
  De 2 à moins de 6 milles, un véhicule nautique à moteur doit compter au moins deux places,
  en plus de l'armement côtier spécifique. Le matériel ne suffit donc pas, la place
  supplémentaire fait partie de la condition. Au-delà de 6 milles, la navigation leur est
  interdite.
sources:
  - texte: Division 240, article 240-2.01, point 8
    ref: division-240
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
