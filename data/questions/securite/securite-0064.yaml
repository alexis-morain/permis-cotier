id: securite-0064
option: cotier
theme: securite
notion: securite-limitations
famille: securite-300-m-5-noeuds
statut: publie
difficulte: 2
enonce: >-
  Tu quittes la plage par un chenal traversier réservé aux navires à moteur, sans panneau
  particulier. Quelle vitesse ne dois-tu pas dépasser dans ce chenal ?
propositions:
  - id: a
    texte: 5 nœuds
  - id: b
    texte: 10 nœuds
  - id: c
    texte: Aucune limite, le chenal sert justement à sortir vite
reponses:
  - a
explication: >-
  L'article 10.5.1 de l'arrêté de la Méditerranée pose que, dans les chenaux réservés aux
  navires et engins motorisés, la limitation générale de vitesse reste fixée à 5 nœuds,
  sauf disposition particulière. Le chenal traversier sert à traverser la bande des
  300 mètres, pas à y aller vite. C'est le chenal de vitesse, et lui seul, qui échappe à
  la limite.
sources:
  - texte: Arrêté du préfet maritime de la Méditerranée n° 125/2013, article 10.5.1
    ref: bande-300-metres
meta:
  cree_le: '2026-10-03'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-03'
