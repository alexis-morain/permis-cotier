id: securite-0025
option: cotier
theme: securite
notion: securite-incendie-mouillage
statut: publie
difficulte: 2
enonce: >-
  Ton bateau est exclu du marquage CE et tu veux y embarquer un extincteur portatif au
  dioxyde de carbone. Quelle capacité maximale l'annexe 240-A3 lui laisse-t-elle ?
propositions:
  - id: a
    texte: 2 kg
  - id: b
    texte: 1 kg
  - id: c
    texte: 5 kg
reponses:
  - a
explication: >-
  Sur un navire exclu du marquage CE, un extincteur portatif au CO2 est limité à 2 kg. Il ne
  se place que dans un local d'habitation contenant des équipements électriques sous tension
  ou des liquides inflammables, et il ne peut y en avoir plus d'un par espace habitable. Le
  CO2 est l'agent le plus encadré, et tout agent au halon est interdit.
sources:
  - texte: Division 240, annexe 240-A3, II
    ref: division-240
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
