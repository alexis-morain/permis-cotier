id: securite-0015
option: cotier
theme: securite
notion: securite-limitations
statut: publie
difficulte: 2
enonce: >-
  Tu prends l'annexe de ton bateau pour rejoindre la plage. Jusqu'où la réglementation te
  laisse-t-elle naviguer avec elle ?
propositions:
  - id: a
    texte: Jusqu'à 300 mètres d'un abri
  - id: b
    texte: Jusqu'à 2 milles d'un abri
  - id: c
    texte: Jusqu'à 6 milles d'un abri
reponses:
  - a
explication: >-
  Une annexe ne peut naviguer que dans la première tranche, jusqu'à 300 mètres d'un abri,
  avec son matériel spécifique. Au-delà, la navigation lui est interdite. Embarquer plus de
  matériel ne rachète rien : la limite tient à l'embarcation, pas à son armement.
sources:
  - texte: Division 240, article 240-2.01, point 8
    ref: division-240
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-13'
