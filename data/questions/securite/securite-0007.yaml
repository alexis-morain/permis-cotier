id: securite-0007
option: cotier
theme: securite
notion: securite-armement-basique
statut: publie
difficulte: 2
enonce: >-
  Tu navigues en Méditerranée à moins de 2 milles d'un abri. Quel élément du matériel
  d'armement basique n'es-tu pas tenu d'avoir à bord ?
propositions:
  - id: a
    texte: Le moyen de connaître les heures et coefficients de marée
  - id: b
    texte: Le ou les extincteurs portatifs d'incendie
  - id: c
    texte: La ligne de mouillage appropriée au navire et à la zone
reponses:
  - a
explication: >-
  En Méditerranée, le moyen de connaître les heures et coefficients de marée n'est pas
  requis, car le marnage y est négligeable. Tout le reste du matériel basique reste dû. La
  ligne de mouillage connaît bien des dispenses, mais elles tiennent au navire, pas à la
  zone.
sources:
  - texte: Division 240, article 240-2.03, point 7
    ref: division-240
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
