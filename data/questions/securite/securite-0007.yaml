id: securite-0007
option: cotier
theme: securite
notion: securite-armement-basique
statut: publie
difficulte: 2
enonce: >-
  Tu navigues en Méditerranée à moins de 2 milles d'un abri. Quel élément du matériel
  d'armement basique n'es-tu pas tenu d'avoir à bord ?
propositions:
  - id: a
    texte: Le moyen de connaître les heures et coefficients de marée du jour.
  - id: b
    texte: Le dispositif lumineux.
  - id: c
    texte: L'extincteur portatif d'incendie.
  - id: d
    texte: La ligne de mouillage.
reponses:
  - a
explication: >-
  Le point 7 de l'article 240-2.03 impose un moyen de connaître les heures et coefficients
  de marée du jour et de la zone, puis précise que ce document n'est pas requis en Méditerranée,
  où le marnage est négligeable. Toutes les autres lignes du matériel basique restent
  dues, la Méditerranée ne dispensant de rien d'autre. La ligne de mouillage connaît bien
  des dispenses, mais elles tiennent au navire, pas à la zone.
sources:
  - texte: Division 240, article 240-2.03, point 7
    ref: division-240
