id: securite-0002
option: cotier
theme: securite
notion: securite-charge-personnes
statut: publie
difficulte: 2
enonce: >-
  Quels passagers ne sont pas comptés dans le calcul du nombre de personnes à bord ?
propositions:
  - id: a
    texte: Les enfants de moins d'un an
  - id: b
    texte: Les enfants de moins de trois ans
  - id: c
    texte: Les enfants de 30 kg au maximum
  - id: d
    texte: Les enfants de moins de six ans
reponses:
  - a
explication: >-
  L'article 240-2.01, alinéa 2, écarte du calcul les seuls enfants de moins d'un an. Tous
  les autres passagers, quel que soit leur âge, comptent pour une personne dans la limite
  fixée par la plaque constructeur. Le seuil de 30 kg existe bien dans le même article,
  mais il concerne le niveau de l'équipement individuel de flottabilité, pas le décompte
  des personnes.
sources:
  - texte: Division 240, article 240-2.01, alinéa 2
    ref: division-240
