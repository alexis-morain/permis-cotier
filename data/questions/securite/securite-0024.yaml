id: securite-0024
option: cotier
theme: securite
notion: securite-incendie-mouillage
famille: securite-dispense-mouillage
statut: publie
difficulte: 3
enonce: >-
  Au titre de l'armement basique, quels navires la réglementation dispense-t-elle de ligne
  de mouillage ?
propositions:
  - id: a
    texte: Les navires à voile dont le déplacement lège est inférieur à 250 kg
  - id: b
    texte: Les véhicules nautiques à moteur
  - id: c
    texte: Les navires motorisés dont le déplacement lège est inférieur à 250 kg, quelle
      que soit leur puissance
  - id: d
    texte: Tous les navires non habitables tant qu'ils restent à moins de 2 milles d'un
      abri
reponses:
  - a
  - b
explication: >-
  Sont dispensés de ligne de mouillage trois types de navires, sous la responsabilité du
  chef de bord : le navire à voile de moins de 250 kg de déplacement lège, le navire
  motorisé de moins de 250 kg dont la puissance ne dépasse pas 4,5 kW, et le véhicule
  nautique à moteur. Pour un navire à moteur, le poids seul ne suffit pas, c'est ce que la
  proposition c oublie. Et la dispense ne tient jamais à la zone de navigation.
sources:
  - texte: Division 240, article 240-2.03, point 6
    ref: division-240
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
