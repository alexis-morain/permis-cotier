id: securite-0011
option: cotier
theme: securite
notion: securite-armement-cotier
statut: publie
difficulte: 3
enonce: >-
  Tu installes le compas magnétique de route exigé pour naviguer à plus de 2 milles d'un
  abri. Quelle exigence doit-il respecter ?
propositions:
  - id: a
    texte: Être indépendant de toute source d'énergie, sauf pour son éclairage
  - id: b
    texte: Être alimenté par le circuit électrique du bord pour afficher le cap
  - id: c
    texte: Être fixé à demeure, une fixation temporaire étant interdite
reponses:
  - a
explication: >-
  Le compas de route est de classe A ou B, éclairé ou éclairable, et affiche le cap au poste
  de barre principal. Il est indépendant de toute source d'énergie, sauf pour l'éclairage :
  une panne électrique ne doit pas te priver de cap. Sa fixation peut être temporaire ou
  permanente, ce qui écarte la réponse c.
sources:
  - texte: Division 240, article 240-2.04, point 5
    ref: division-240
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
