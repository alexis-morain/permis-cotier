id: securite-0038
option: cotier
theme: securite
notion: securite-armement-cotier
statut: publie
difficulte: 1
enonce: >-
  À quatre milles d'un abri, quel niveau de performance doit présenter l'équipement individuel
  de flottabilité de chaque personne embarquée ?
propositions:
  - id: a
    texte: Au moins 100
  - id: b
    texte: Au moins 50
  - id: c
    texte: Au moins 150
reponses:
  - a
explication: >-
  L'armement côtier exige autant d'EIF de niveau de performance d'au moins 100 que de
  personnes embarquées. Le même point ouvre une seule exception : qui sait nager et porte
  effectivement un EIF de niveau 50 au moins, ou une combinaison aux caractéristiques fixées
  par l'article. Le niveau 50 est celui de l'armement basique, à moins de deux milles, et le
  niveau 150 s'impose à partir de six milles, avec l'armement semi-hauturier.
sources:
  - texte: Division 240, article 240-2.04, point 3
    ref: division-240
  - texte: Division 240, article 240-2.03, point 1
    ref: division-240
  - texte: Division 240, article 240-2.05, point 1
    ref: division-240
