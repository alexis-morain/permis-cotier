id: securite-0030
option: cotier
theme: securite
notion: securite-charge-personnes
statut: publie
difficulte: 2
enonce: >-
  La plaque de ton bateau indique six personnes. Vous êtes sept pour une courte sortie
  par beau temps. Que dit la division 240 ?
propositions:
  - id: a
    texte: Sauf force majeure, le nombre maximal de personnes n'est jamais dépassé en
      navigation
  - id: b
    texte: Une personne de plus est tolérée à moins de deux milles d'un abri
  - id: c
    texte: La plaque n'est qu'une recommandation du constructeur
reponses:
  - a
explication: >-
  L'article 240-2.01 est net : sauf en cas de force majeure, le nombre maximal de personnes
  à bord ainsi que la charge maximale recommandée ne sont jamais dépassés en navigation.
  Ces valeurs sont celles de la plaque constructeur ou de la plaque signalétique. Le beau
  temps et la distance n'y changent rien.
sources:
  - texte: Division 240, article 240-2.01, point 1
    ref: division-240
