id: securite-0030
option: cotier
theme: securite
notion: securite-charge-personnes
statut: publie
difficulte: 2
enonce: >-
  La plaque de ton bateau indique six personnes. Vous êtes sept pour une courte sortie par
  beau temps. Que dit la réglementation ?
propositions:
  - id: a
    texte: Sauf force majeure, le nombre maximal de personnes n'est jamais dépassé en
      navigation
  - id: b
    texte: Une personne de plus est tolérée à moins de deux milles d'un abri
  - id: c
    texte: La plaque n'est qu'une recommandation du constructeur
reponses:
  - a
explication: >-
  Sauf force majeure, on ne dépasse jamais en navigation le nombre maximal de personnes à
  bord ni la charge maximale recommandée, tels qu'ils figurent sur la plaque. Le beau temps
  et la distance n'y changent rien.
sources:
  - texte: Division 240, article 240-2.01, point 1
    ref: division-240
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-13'
