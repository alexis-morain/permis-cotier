id: securite-0021
option: cotier
theme: securite
notion: securite-categories-conception
statut: publie
difficulte: 2
enonce: >-
  Le bateau sur lequel tu passes ta formation pratique à l'option côtière porte le marquage
  CE. Quelle catégorie de conception doit-il avoir au minimum ?
propositions:
  - id: a
    texte: La catégorie C
  - id: b
    texte: La catégorie D
  - id: c
    texte: La catégorie B
reponses:
  - a
explication: >-
  Le bateau de formation pratique doit porter le marquage CE et être au moins en catégorie
  de conception C, ou d'un type approuvé au moins en 5e catégorie de navigation de
  plaisance. Il doit aussi avoir l'armement de la catégorie côtière, 5,50 mètres au moins et
  une VHF.
sources:
  - texte: Arrêté du 28 septembre 2007, article 7 b)
    ref: arrete-2007-09-28
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
