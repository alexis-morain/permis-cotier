id: securite-0021
option: cotier
theme: securite
notion: securite-categories-conception
statut: publie
difficulte: 2
enonce: >-
  Le bateau sur lequel tu passes ta formation pratique à l'option côtière porte le marquage
  CE. Quelle catégorie de conception doit-il avoir au minimum ?
propositions:
  - id: a
    texte: La catégorie C
  - id: b
    texte: La catégorie D
  - id: c
    texte: La catégorie B
  - id: d
    texte: La catégorie A
reponses:
  - a
explication: >-
  L'article 7 b) de l'arrêté du 28 septembre 2007 exige que le bateau utilisé pour la
  formation pratique ait fait l'objet d'un marquage CE et soit au moins en catégorie de
  conception C, ou qu'il soit d'un type approuvé au moins en 5e catégorie de navigation
  de plaisance. Le même alinéa lui impose l'armement correspondant à la catégorie côtière,
  une longueur d'au moins 5,50 mètres et une VHF.
sources:
  - texte: Arrêté du 28 septembre 2007, article 7 b)
    ref: arrete-2007-09-28
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-05'
