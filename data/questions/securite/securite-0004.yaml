id: securite-0004
option: cotier
theme: securite
statut: publie
difficulte: 2
enonce: >-
  Tu conduis un bateau à moteur hors-bord avec commande à la barre, équipé d'un coupe-circuit
  filaire. Quand ce coupe-circuit doit-il être relié à toi ?
propositions:
  - id: a
    texte: Dès que le moteur est allumé
  - id: b
    texte: Dès que tu dépasses les 300 mètres d'un abri
  - id: c
    texte: Seulement quand tu es seul à bord
  - id: d
    texte: Seulement lorsque tu navigues à plus de cinq nœuds
reponses:
  - a
explication: >-
  L'article 240-2.01, alinéa 7, exige que le coupe-circuit filaire soit relié au poignet,
  à la jambe ou à un point fixe de l'équipement de flottabilité porté par le conducteur,
  dès lors que le moteur est allumé. La règle ne dépend ni de la distance de l'abri, ni
  de la vitesse, ni du nombre de personnes à bord. Le même alinéa interdit de rallonger
  ou de déplacer le fil pour se déplacer plus librement, car l'hélice pourrait alors tourner
  sans que le conducteur ait la main à portée de la commande.
sources:
  - texte: Division 240, article 240-2.01, alinéa 7
    ref: division-240
