id: securite-0004
option: cotier
theme: securite
notion: securite-armement-basique
statut: publie
difficulte: 2
enonce: >-
  Tu conduis un bateau à moteur hors-bord avec commande à la barre, équipé d'un coupe-circuit
  filaire. Quand ce coupe-circuit doit-il être relié à toi ?
propositions:
  - id: a
    texte: Dès que le moteur est allumé
  - id: b
    texte: Dès que tu dépasses les 300 mètres d'un abri
  - id: c
    texte: Seulement quand tu es seul à bord
  - id: d
    texte: Seulement lorsque tu navigues à plus de cinq nœuds
reponses:
  - a
explication: >-
  Le coupe-circuit filaire se relie au poignet, à la jambe ou à un point fixe de
  l'équipement de flottabilité du conducteur dès que le moteur est allumé. Ni la distance
  d'un abri, ni la vitesse, ni le nombre de personnes à bord n'y changent rien. Il est
  interdit de rallonger ou de déplacer le fil pour se déplacer plus librement : l'hélice
  pourrait tourner sans que le conducteur ait la main à portée de la commande.
sources:
  - texte: Division 240, article 240-2.01, alinéa 7
    ref: division-240
meta:
