id: securite-0014
option: cotier
theme: securite
notion: securite-limitations
statut: publie
difficulte: 1
enonce: >-
  Tu prépares une sortie à quatre milles d'un abri sur ton navire de plaisance. Quel matériel
  d'armement et de sécurité dois-tu embarquer ?
propositions:
  - id: a
    texte: L'armement côtier
  - id: b
    texte: L'armement basique
  - id: c
    texte: L'armement semi-hauturier
reponses:
  - a
explication: >-
  À quatre milles d'un abri, tu es dans la tranche de 2 à moins de 6 milles : armement
  côtier. L'armement basique s'arrête à 2 milles, le semi-hauturier ne commence qu'à 6.
  Retiens les trois bornes : 2, 6 et 60 milles.
sources:
  - texte: Division 240, article 240-2.01, point 8
    ref: division-240
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
