id: securite-0027
option: cotier
theme: securite
notion: securite-categories-conception
statut: publie
difficulte: 2
enonce: >-
  Ton bateau porte la catégorie de conception C. Pour quelles conditions est-il
  considéré comme conçu ?
propositions:
  - id: a
    texte: Un vent allant jusqu'à la force 6 comprise
  - id: b
    texte: Des vagues d'une hauteur significative jusqu'à 2 mètres compris
  - id: c
    texte: Un vent allant jusqu'à la force 8 comprise
  - id: d
    texte: Des vagues d'une hauteur significative jusqu'à 4 mètres compris
reponses:
  - a
  - b
explication: >-
  Le point II. 9 de l'article 245-1.02 définit chaque catégorie par un couple vent et
  vague : la catégorie C, c'est force 6 comprise et 2 mètres de hauteur significative
  comprise. Les deux valeurs vont ensemble, elles viennent de la même ligne du tableau.
  Force 8 et 4 mètres, c'est la catégorie B : le piège est de monter d'un cran.
sources:
  - texte: Division 245, article 245-1.02, II. 9
    ref: division-245
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-09-04'
