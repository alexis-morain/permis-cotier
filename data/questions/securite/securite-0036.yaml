id: securite-0036
option: cotier
theme: securite
notion: securite-armement-basique
statut: publie
difficulte: 2
enonce: >-
  Tu quittes les eaux territoriales françaises pour une traversée. Que dois-tu arborer
  ?
propositions:
  - id: a
    texte: Le pavillon national
  - id: b
    texte: Le pavillon « A » du Code international de signaux
  - id: c
    texte: Rien, un navire de plaisance n'a pas de pavillon
reponses:
  - a
explication: >-
  Hors des eaux territoriales, l'armement basique impose d'arborer le pavillon national. Le
  pavillon « A » signale des plongeurs, il n'a rien à voir avec la nationalité du navire.
sources:
  - texte: Division 240, article 240-2.03, point 8
    ref: division-240
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
