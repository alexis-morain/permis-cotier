id: securite-0001
option: cotier
theme: securite
notion: securite-charge-personnes
statut: publie
difficulte: 2
enonce: >-
  Ton embarcation n'a ni plaque constructeur ni plaque signalétique. Où lis-tu le nombre
  maximal de personnes à bord ?
propositions:
  - id: a
    texte: Sur l'acte de francisation
  - id: b
    texte: Dans le manuel d'utilisateur
reponses:
  - b
explication: >-
  En navigation, on ne dépasse jamais le nombre maximal de personnes à bord ni la charge
  maximale recommandée, sauf force majeure. Ces valeurs figurent sur la plaque constructeur
  ou la plaque signalétique et, pour les engins qui n'en ont pas, dans le manuel
  d'utilisateur. L'acte de francisation et les pièces d'immatriculation identifient le
  navire mais ne portent pas ces valeurs.
sources:
  - texte: Division 240, article 240-2.01, alinéa 1
    ref: division-240
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
