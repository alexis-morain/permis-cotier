id: securite-0037
option: cotier
theme: securite
notion: securite-armement-cotier
statut: publie
difficulte: 2
enonce: >-
  Tu prépares l'armement côtier pour naviguer entre deux et six milles d'un abri. Quels
  documents doivent être à bord ?
propositions:
  - id: a
    texte: Les cartes marines officielles de la zone, à jour, sur papier ou sur écran
  - id: b
    texte: Le RIPAM, ou un résumé textuel et graphique
  - id: c
    texte: Le journal de bord
  - id: d
    texte: Le livre des feux
reponses:
  - a
  - b
explication: >-
  L'article 240-2.04 exige les cartes marines officielles couvrant la zone, tenues à jour,
  le RIPAM ou son résumé, éventuellement en plaquette autocollante, et un document décrivant
  le balisage de la zone. Le journal de bord et le livre des feux n'arrivent qu'avec l'armement
  semi-hauturier, à partir de six milles.
sources:
  - texte: Division 240, article 240-2.04, points 6 à 8
    ref: division-240
