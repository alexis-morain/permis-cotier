id: securite-0041
option: cotier
theme: securite
notion: securite-equipement-individuel
statut: publie
difficulte: 2
enonce: >-
  Tu pars naviguer seul. Que recommande la réglementation ?
propositions:
  - id: a
    texte: Porter en permanence un EIF d'au moins 50 auquel est fixée une VHF portable
  - id: b
    texte: Rester en permanence à moins de 300 mètres d'un abri, de jour seulement
  - id: c
    texte: Prévenir la capitainerie de ton itinéraire et de ton heure de retour
reponses:
  - a
explication: >-
  Il est recommandé à qui navigue en solitaire de porter en permanence un EIF d'un niveau de
  performance d'au moins 50, avec une VHF portable fixée dessus. Tombé à l'eau, le solitaire
  n'a que ce qu'il porte sur lui.
sources:
  - texte: Division 240, article 240-2.03, point 1
    ref: division-240
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-13'
