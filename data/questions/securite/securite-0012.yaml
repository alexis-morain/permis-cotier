id: securite-0012
option: cotier
theme: securite
notion: securite-responsabilite-armement
statut: publie
difficulte: 3
enonce: >-
  Le vent forcit et la mer se creuse. Sur quoi porte alors ta responsabilité de chef de
  bord ?
propositions:
  - id: a
    texte: Sur la mise en œuvre du matériel de sécurité, puisque les circonstances l'exigent.
  - id: b
    texte: Sur la seule présence à bord du matériel de sécurité, que tu as vérifiée avant
      d'appareiller.
reponses:
  - a
explication: >-
  Le chef de bord s'assure aussi de la mise en œuvre des matériels de sécurité quand les
  circonstances l'exigent. La responsabilité ne s'arrête pas à l'emport : il faut aussi s'en
  servir au bon moment. Piège : confondre obligation d'emport et obligation d'usage.
sources:
  - texte: Division 240, article 240-1.03
    ref: division-240
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
