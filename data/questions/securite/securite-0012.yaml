id: securite-0012
option: cotier
theme: securite
statut: publie
difficulte: 3
enonce: >-
  Le vent forcit et la mer se creuse. Sur quoi porte alors ta responsabilité de chef de
  bord ?
propositions:
  - id: a
    texte: Sur la mise en œuvre du matériel de sécurité, puisque les circonstances l'exigent.
  - id: b
    texte: Sur la seule présence à bord du matériel de sécurité, que tu as vérifiée avant
      d'appareiller.
  - id: c
    texte: Sur la seule adéquation de ta navigation avec les caractéristiques de ton navire.
  - id: d
    texte: Sur la vérification de la validité des équipements, à refaire en cours de navigation.
reponses:
  - a
explication: >-
  L'article 240-1.03 demande au chef de bord de s'assurer de la mise en œuvre des matériels
  de sécurité lorsque les circonstances l'exigent. La responsabilité ne s'arrête donc
  pas à l'emport : il faut aussi s'en servir au bon moment. Le piège classique est de
  confondre obligation d'emport et obligation d'usage, ou de ne retenir que l'une des
  autres obligations de l'article, qui restent valables mais ne répondent pas à la situation.
sources:
  - texte: Division 240, article 240-1.03
    ref: division-240
