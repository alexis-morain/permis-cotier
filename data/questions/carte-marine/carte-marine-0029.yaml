id: carte-marine-0029
option: cotier
theme: carte-marine
notion: maree-definitions
statut: publie
difficulte: 2
enonce: >-
  Qu'appelle-t-on le marnage ?
propositions:
  - id: a
    texte: La différence de hauteur entre une pleine mer et la basse mer qui la suit
  - id: b
    texte: La durée entre deux pleines mers
  - id: c
    texte: La hauteur d'eau au-dessus du zéro des cartes à pleine mer
reponses:
  - a
explication: >-
  Le marnage est la différence de hauteur entre une pleine mer et la basse mer qui la
  suit. Il est maximal en vive-eau, autour de la pleine et de la nouvelle lune, et minimal
  en morte-eau, aux quartiers.
sources:
  - texte: Fiche lecture de carte marine, SHOM ouvrage 1D
    ref: fiche-carte-marine
