id: carte-marine-0037
option: cotier
theme: carte-marine
notion: maree-principe
statut: publie
difficulte: 2
enonce: >-
  Lesquelles de ces phases de la Lune donnent une vive-eau ?
propositions:
  - id: a
    texte: La pleine lune
  - id: b
    texte: La nouvelle lune
  - id: c
    texte: Le premier quartier
  - id: d
    texte: Le dernier quartier
reponses:
  - a
  - b
explication: >-
  La vive-eau se produit autour de la pleine et de la nouvelle lune, quand les deux astres
  sont alignés. Beaucoup n'y voient que la pleine lune, parce qu'une grosse lune fait
  penser à une grosse marée : la nouvelle lune donne pourtant les mêmes vives-eaux. Ce
  sont les quartiers qui donnent les mortes-eaux.
sources:
  - texte: Fiche lecture de carte marine, SHOM ouvrage 1D
    ref: fiche-carte-marine
