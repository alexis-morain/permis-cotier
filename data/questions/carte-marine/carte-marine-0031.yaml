id: carte-marine-0031
option: cotier
theme: carte-marine
notion: maree-coefficient
statut: publie
difficulte: 2
enonce: >-
  Entre quelles valeurs varie le coefficient de marée des cartes et annuaires français
  ?
propositions:
  - id: a
    texte: De 20 à 120
  - id: b
    texte: De 0 à 100
  - id: c
    texte: De 1 à 12
reponses:
  - a
explication: >-
  Le coefficient de marée, propre aux documents français, va de 20 à 120 : 45 est une
  morte-eau moyenne, 95 une vive-eau moyenne et 120 la plus forte marée astronomique.
  Plus le coefficient est fort, plus le marnage est grand.
sources:
  - texte: Fiche lecture de carte marine, SHOM ouvrage 1D
    ref: fiche-carte-marine
