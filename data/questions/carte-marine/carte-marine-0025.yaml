id: carte-marine-0025
option: cotier
theme: carte-marine
notion: carte-symboles
statut: publie
difficulte: 2
enonce: >-
  Une limite en tireté magenta entoure une zone de la carte, avec une mention. Que signale-t-elle
  ?
propositions:
  - id: a
    texte: Une zone interdite ou réglementée
  - id: b
    texte: L'estran
  - id: c
    texte: Un chenal balisé
reponses:
  - a
explication: >-
  Une zone interdite ou réglementée se dessine par une limite en tireté magenta, avec
  sa mention. Le magenta est la couleur des informations réglementaires et des feux sur
  la carte.
sources:
  - texte: Fiche lecture de carte marine, SHOM ouvrage 1D
    ref: fiche-carte-marine
