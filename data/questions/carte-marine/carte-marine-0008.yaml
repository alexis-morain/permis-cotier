id: carte-marine-0008
option: cotier
theme: carte-marine
notion: maree-consequences
statut: publie
difficulte: 2
enonce: >-
  Tu navigues en Méditerranée. Quelle conséquence la marée a-t-elle sur ta navigation
  ?
propositions:
  - id: a
    texte: Aucune conséquence pratique, le marnage y est de quelques dizaines de centimètres
      au plus
  - id: b
    texte: Les mêmes qu'en Manche, il faut calculer chaque passage
  - id: c
    texte: Le marnage y est plus fort qu'en Atlantique, mais les courants plus faibles
  - id: d
    texte: La marée y est semi-diurne et impose deux calculs par jour
reponses:
  - a
explication: >-
  En Méditerranée, le marnage se compte en dizaines de centimètres : la marée n'y commande
  pas la navigation. En Manche et en Atlantique, elle décide au contraire de l'heure d'un
  passage, de l'entrée d'un port ou du franchissement d'un seuil. Le calcul de marée par
  la règle des douzièmes n'est de toute façon pas au programme de l'option côtière : il
  relève de l'extension hauturière.
sources:
  - texte: Fiche lecture de carte marine, SHOM ouvrage 1D
    ref: fiche-carte-marine
