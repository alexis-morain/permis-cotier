id: carte-marine-0030
option: cotier
theme: carte-marine
notion: maree-definitions
statut: publie
difficulte: 2
enonce: >-
  Quand parle-t-on de morte-eau ?
propositions:
  - id: a
    texte: Aux quartiers de lune, quand le marnage est minimal
  - id: b
    texte: À la pleine et à la nouvelle lune, quand le marnage est maximal
  - id: c
    texte: En Méditerranée, où il n'y a pas de marée
reponses:
  - a
explication: >-
  La morte-eau est la période des quartiers de lune, quand le Soleil et la Lune tirent
  en croix et que le marnage est minimal. La vive-eau, autour de la pleine et de la nouvelle
  lune, donne les marnages les plus forts.
sources:
  - texte: Fiche lecture de carte marine, SHOM ouvrage 1D
    ref: fiche-carte-marine
