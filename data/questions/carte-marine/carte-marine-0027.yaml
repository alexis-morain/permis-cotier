id: carte-marine-0027
option: cotier
theme: carte-marine
notion: carte-dangers-amers
statut: publie
difficulte: 2
enonce: >-
  Dans la description « Fl(2) R 10s 12m 9M », que signifie « 12m » ?
propositions:
  - id: a
    texte: La hauteur du feu au-dessus du niveau de la mer
  - id: b
    texte: La portée du feu, douze milles
  - id: c
    texte: La profondeur au pied du phare
reponses:
  - a
explication: >-
  Le caractère se lit avant la couleur et la période : Fl(2) deux éclats, R rouge, 10s
  la période, 12m la hauteur du feu au-dessus du niveau de la mer, et 9M sa portée en
  milles. La hauteur se compte depuis le niveau moyen des pleines mers de vive-eau.
sources:
  - texte: Fiche lecture de carte marine, SHOM ouvrage 1D, section « Les caractères de
      feu »
    ref: fiche-carte-marine
