id: carte-marine-0011
option: cotier
theme: carte-marine
notion: carte-symboles
statut: publie
difficulte: 2
enonce: >-
  Ce feu blanc scintille : des éclats brefs qui se suivent sans interruption, environ un par
  seconde. Quelle abréviation la carte porte-t-elle pour lui ?
visuel:
  fichier: rythmes/caractere-scintillant.svg
  alt: "Feu scintillant, fait d'éclats brefs qui se suivent sans interruption, environ un par seconde."
  credit: code
propositions:
  - id: a
    texte: Q
  - id: b
    texte: Fl
  - id: c
    texte: Fl (3)
reponses:
  - a
explication: >-
  Un feu scintillant s'abrège Q : de cinquante à soixante-dix-neuf éclats par minute, à peu
  près un par seconde. C'est le feu des marques cardinales : la cardinale Nord montre un
  scintillant continu, Q, ou un scintillant rapide continu, VQ. Ne confonds pas Q avec Fl :
  le feu à éclats est bien plus lent, et il laisse entre ses éclats une obscurité bien plus
  longue. Le chiffre entre parenthèses ne s'ajoute que si les éclats sont groupés, ce qui
  n'est pas le cas ici.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 3.3.1
    ref: arrete-2017-11-30
  - texte: Fiche lecture de carte marine, SHOM ouvrage 1D, section « Les caractères de feu »
    ref: fiche-carte-marine
