id: carte-marine-0033
option: cotier
theme: carte-marine
notion: maree-consequences
statut: publie
difficulte: 2
enonce: >-
  Tu navigues en Manche. Sur quoi la marée pèse-t-elle dans ta navigation ?
propositions:
  - id: a
    texte: L'heure d'un passage sur un haut-fond ou de l'entrée dans un port
  - id: b
    texte: Rien, le marnage y est de quelques dizaines de centimètres
  - id: c
    texte: Seulement la force du vent
reponses:
  - a
explication: >-
  En Manche et en Atlantique, la marée décide de l'heure d'un passage ou de l'entrée d'un
  port : la hauteur d'eau disponible change de plusieurs mètres au fil de la journée.
  C'est en Méditerranée que le marnage se limite à quelques dizaines de centimètres.
sources:
  - texte: Fiche lecture de carte marine, SHOM ouvrage 1D
    ref: fiche-carte-marine
