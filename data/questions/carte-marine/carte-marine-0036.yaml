id: carte-marine-0036
option: cotier
theme: carte-marine
notion: maree-principe
statut: publie
difficulte: 2
enonce: >-
  Pourquoi le marnage est-il maximal en vive-eau ?
propositions:
  - id: a
    texte: Parce que le Soleil et la Lune tirent dans le même sens et que leurs effets
      s'ajoutent
  - id: b
    texte: Parce que la Lune est alors au plus près de la Terre
  - id: c
    texte: Parce que le vent d'ouest pousse l'eau vers la côte
reponses:
  - a
explication: >-
  La vive-eau tient à l'alignement : autour de la pleine et de la nouvelle lune, le Soleil et
  la Lune tirent dans le même sens et leurs effets s'additionnent. Le marnage est au contraire
  minimal en morte-eau, aux quartiers.
sources:
  - texte: Fiche lecture de carte marine, SHOM ouvrage 1D
    ref: fiche-carte-marine
