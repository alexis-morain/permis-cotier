id: carte-marine-0028
option: cotier
theme: carte-marine
notion: carte-dangers-amers
statut: publie
difficulte: 2
enonce: >-
  Comment une roche qui couvre et découvre est-elle dessinée sur la carte ?
propositions:
  - id: a
    texte: Un astérisque, souvent avec sa hauteur soulignée
  - id: b
    texte: Une croix seule
  - id: c
    texte: Un symbole en fuseau, souvent avec sa hauteur soulignée
reponses:
  - a
explication: >-
  Une roche qui couvre et découvre se dessine par un astérisque, souvent accompagné de sa
  hauteur soulignée, comptée au-dessus du zéro des cartes. La croix seule est une roche
  toujours submergée, de profondeur inconnue, et le fuseau une épave.
sources:
  - texte: Fiche lecture de carte marine, SHOM ouvrage 1D
    ref: fiche-carte-marine
