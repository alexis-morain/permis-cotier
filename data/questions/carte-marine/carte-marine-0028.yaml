id: carte-marine-0028
option: cotier
theme: carte-marine
notion: carte-dangers-amers
statut: publie
difficulte: 2
enonce: >-
  Comment une roche qui découvre est-elle dessinée sur la carte ?
propositions:
  - id: a
    texte: Une croix ou un astérisque, souvent avec sa hauteur soulignée
  - id: b
    texte: Une ancre
  - id: c
    texte: Un symbole en fuseau
reponses:
  - a
explication: >-
  Une roche qui découvre se dessine par une croix ou un astérisque, souvent accompagné
  de sa hauteur soulignée, comptée au-dessus du zéro des cartes. L'ancre est un mouillage,
  et le fuseau une épave.
sources:
  - texte: Fiche lecture de carte marine, SHOM ouvrage 1D
    ref: fiche-carte-marine
