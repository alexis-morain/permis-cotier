id: balisage-region-b-0004
option: cotier
theme: balisage-region-b
notion: region-b-lateral
statut: publie
difficulte: 2
enonce: >-
  En route vers un port de la Martinique, en région de balisage B, tu remontes le chenal depuis
  le large et cette marque se présente. De quel côté la laisses-tu ?
visuel:
  fichier: balisage/laterale-babord-region-b.svg
  alt: "Bouée cylindrique verte surmontée d'un voyant cylindrique vert."
  credit: code
propositions:
  - id: a
    texte: Sur bâbord
  - id: b
    texte: Sur tribord, le vert marque tribord dans toutes les régions
reponses:
  - a
explication: >-
  En région B, celle de Saint-Pierre-et-Miquelon, la Guyane, la Martinique et la Guadeloupe
  pour cet arrêté, les couleurs latérales sont inversées : le vert marque bâbord. La forme,
  elle, ne change pas d'une région à l'autre, et elle confirme : le cylindre et le voyant
  cylindrique sont toujours à bâbord, le cône toujours à tribord. Croire le vert toujours à
  tribord est le réflexe de la région A.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 2.4.1
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 2.2
    ref: arrete-2017-11-30
