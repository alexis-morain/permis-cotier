id: balisage-region-b-0001
option: cotier
theme: balisage-region-b
notion: region-b-lateral
statut: publie
difficulte: 2
enonce: >-
  Tu entres dans un port de la Guadeloupe, en région de balisage B. De quelle couleur est
  la marque latérale que tu laisses sur bâbord ?
propositions:
  - id: a
    texte: Verte
  - id: b
    texte: Rouge
  - id: c
    texte: Jaune
reponses:
  - a
explication: >-
  En région B, les couleurs des marques latérales sont inversées par rapport à la région A :
  bâbord est vert et tribord rouge. La réponse « rouge » est le réflexe de la région A, celle
  que l'on pratique en métropole, et c'est exactement le piège. Sont en région B, pour cet
  arrêté, Saint-Pierre-et-Miquelon, la Guyane, la Martinique et la Guadeloupe.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 2.4.1
    ref: arrete-2017-11-30
  - texte: Arrêté du 30 novembre 2017, annexe I, 2.2
    ref: arrete-2017-11-30
