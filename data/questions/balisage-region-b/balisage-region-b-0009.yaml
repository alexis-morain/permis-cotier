id: balisage-region-b-0009
option: cotier
theme: balisage-region-b
notion: region-b-lateral
statut: publie
difficulte: 2
enonce: >-
  Pour l'application de l'arrêté du 30 novembre 2017, lequel de ces littoraux français est
  situé en région de balisage B ?
propositions:
  - id: a
    texte: La Réunion
  - id: b
    texte: La Nouvelle-Calédonie
  - id: c
    texte: La Polynésie française
  - id: d
    texte: Saint-Pierre-et-Miquelon
reponses:
  - d
explication: >-
  Le paragraphe 2.2 range en région B les littoraux de Saint-Pierre-et-Miquelon, de la
  Guyane, de la Martinique et de la Guadeloupe. La Réunion, la Nouvelle-Calédonie et la
  Polynésie française sont en région A, avec la métropole, Mayotte, Wallis-et-Futuna et les
  Terres australes et antarctiques françaises. L'éloignement de la métropole ne dit rien :
  c'est la liste de l'arrêté qui fait foi.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 2.2
    ref: arrete-2017-11-30
meta:
  cree_le: '2026-10-09'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-09'
