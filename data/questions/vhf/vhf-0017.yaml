id: vhf-0017
option: cotier
theme: vhf
notion: vhf-emport
statut: publie
difficulte: 2
enonce: >-
  Tu loues un bateau à moteur de 30 kW pour naviguer à trois milles d'un abri. Quel équipement
  radio le loueur doit-il fournir ?
propositions:
  - id: a
    texte: Aucun, la location ne change rien à l'armement
  - id: b
    texte: Un émetteur-récepteur VHF
  - id: c
    texte: Une radiobalise de localisation des sinistres
reponses:
  - b
explication: >-
  Un navire de location de plus de 4,5 kW qui s'éloigne à plus de 2 milles d'un abri doit en
  plus avoir un émetteur-récepteur VHF, un moyen de positionnement électronique et un
  document d'instructions. La location abaisse donc le seuil : à trois milles, une VHF que
  l'armement côtier n'exigerait pas devient obligatoire.
sources:
  - texte: Division 240, article 240-3.03
    ref: division-240
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
