id: vhf-0029
option: cotier
theme: vhf
notion: vhf-fausses-alertes
statut: publie
difficulte: 2
enonce: >-
  Le paragraphe 2 de l'annexe IV du RIPAM interdit deux usages. Lesquels ?
propositions:
  - id: a
    texte: Émettre un signal de détresse hors d'un cas de détresse ou d'un besoin d'assistance
  - id: b
    texte: Émettre un signal susceptible d'être confondu avec un signal de détresse
  - id: c
    texte: Relayer le message de détresse d'un autre navire
  - id: d
    texte: Montrer plusieurs signaux de détresse en même temps
reponses:
  - a
  - b
explication: >-
  L'annexe IV protège les signaux de détresse de deux côtés : on ne les emploie que pour
  indiquer une détresse ou un besoin d'assistance, et on n'emploie pas non plus d'autres
  signaux qui pourraient être pris pour eux. Montrer plusieurs signaux ensemble est au
  contraire prévu par le paragraphe 1, qui les vaut utilisés ensemble ou séparément. Relayer
  une détresse, c'est le MAYDAY RELAY, qui est un devoir.
sources:
  - texte: RIPAM, annexe IV, 2
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-05'
