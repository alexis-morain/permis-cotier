id: vhf-0003
option: cotier
theme: vhf
statut: publie
difficulte: 3
enonce: >-
  Tu embarques une VHF portative de cinq watts, dépourvue d'appel sélectif numérique,
  et tu navigues uniquement dans les eaux territoriales françaises. Quel titre l'usage
  de cet appareil demande t il ?
propositions:
  - id: a
    texte: Aucun, cet appareil échappe à l'obligation de titre.
  - id: b
    texte: Le certificat restreint de radiotéléphoniste du service mobile maritime.
  - id: c
    texte: Le permis de conduire en mer les bateaux de plaisance à moteur.
  - id: d
    texte: Le certificat restreint de radiotéléphoniste du service mobile fluvial.
reponses:
  - a
explication: >-
  Le 3) de l'article 1 vise les stations VHF « autre qu'un équipement portatif d'une puissance
  maximale de six watts dépourvu de l'appel sélectif numérique ». Un portatif de cinq
  watts sans appel sélectif numérique sort donc du champ de l'obligation. Attention aux
  deux conditions : elles se cumulent, et un portatif équipé de l'appel sélectif numérique
  retombe sous l'obligation de titre même s'il reste sous six watts.
sources:
  - texte: Arrêté du 18 mai 2005, article 1, 3)
    ref: arrete-2005-05-18
