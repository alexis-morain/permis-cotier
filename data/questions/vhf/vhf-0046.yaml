id: vhf-0046
option: cotier
theme: vhf
notion: vhf-licence-mmsi
statut: publie
difficulte: 2
enonce: >-
  Quelle différence sépare la licence de station de navire du certificat restreint de
  radiotéléphoniste ?
propositions:
  - id: a
    texte: La licence autorise l'installation à bord du navire, le certificat autorise
      la personne qui la manœuvre
  - id: b
    texte: La licence vaut en eaux territoriales, le certificat en eaux internationales
  - id: c
    texte: Ce sont deux noms du même document
reponses:
  - a
explication: >-
  La licence de station est l'autorisation d'utiliser une installation radioélectrique
  à bord : elle est attachée au navire. Le certificat restreint de radiotéléphoniste autorise
  une personne à manœuvrer la VHF. Il faut les deux, et l'un ne remplace pas l'autre.
sources:
  - texte: 'Fiche VHF : voies, procédures d''appel et SMDSM'
    ref: fiche-vhf
  - texte: Division 240, article 240-2.20, I
    ref: division-240
