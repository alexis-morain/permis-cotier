id: vhf-0002
option: cotier
theme: vhf
statut: publie
difficulte: 2
enonce: >-
  Tu navigues uniquement dans les eaux territoriales françaises et tu veux utiliser la
  VHF fixe de ton bateau de plaisance. Que dois tu détenir ?
propositions:
  - id: a
    texte: Le certificat restreint de radiotéléphoniste du service mobile maritime, et
      lui seul.
  - id: b
    texte: Le certificat restreint de radiotéléphoniste du service mobile maritime ou
      le permis de conduire en mer les bateaux de plaisance à moteur.
  - id: c
    texte: Le certificat restreint de radiotéléphoniste du service mobile fluvial.
  - id: d
    texte: Aucun titre, la VHF fixe est libre dans les eaux territoriales françaises.
reponses:
  - b
explication: >-
  Le 3) de l'article 1 admet deux titres au choix pour une VHF installée à bord d'un navire
  de plaisance qui navigue uniquement dans les eaux territoriales françaises : le certificat
  restreint de radiotéléphoniste du service mobile maritime, ou le permis de conduire
  en mer les bateaux de plaisance à moteur. Le certificat fluvial, lui, concerne les voies
  de navigation intérieure.
sources:
  - texte: Arrêté du 18 mai 2005, article 1, 3)
    ref: arrete-2005-05-18
