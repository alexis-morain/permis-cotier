id: vhf-0053
option: cotier
theme: vhf
notion: vhf-emport
statut: publie
difficulte: 3
enonce: >-
  Tu navigues à quatre milles d'un abri sur ton propre bateau à moteur. Dois-tu embarquer
  une VHF ?
propositions:
  - id: a
    texte: Non, l'armement côtier n'en exige pas
  - id: b
    texte: Oui, dès deux milles d'un abri
  - id: c
    texte: Oui, dès que le bateau est à moteur
reponses:
  - a
explication: >-
  À quatre milles d'un abri, l'armement côtier (de 2 à moins de 6 milles) ne comporte pas de
  VHF. Elle devient obligatoire avec l'armement semi-hauturier, à partir de 6 milles. Avant,
  elle n'est exigée que dans des cas particuliers : un navire de location au-delà de 2
  milles, ou une embarcation à énergie humaine qui s'éloigne de 2 à 6 milles.
sources:
  - texte: Division 240, article 240-2.04
    ref: division-240
  - texte: Division 240, article 240-3.03
    ref: division-240
  - texte: Division 240, article 240-2.10, point 3
    ref: division-240
