id: vhf-0037
option: cotier
theme: vhf
notion: vhf-urgence-securite
statut: publie
difficulte: 2
enonce: >-
  Le CROSS s'apprête à diffuser un avis de coup de vent sur le canal 16. Par quel signal
  précède-t-il son message ?
propositions:
  - id: a
    texte: SÉCURITÉ
  - id: b
    texte: PAN PAN
  - id: c
    texte: MAYDAY
reponses:
  - a
explication: >-
  Le signal SÉCURITÉ annonce un message qui concerne la sécurité de la navigation ou un
  avertissement météorologique. PAN PAN signale une urgence pour un navire ou une personne,
  et MAYDAY une détresse.
sources:
  - texte: 'Fiche VHF : voies, procédures d''appel et SMDSM'
    ref: fiche-vhf
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-05'
