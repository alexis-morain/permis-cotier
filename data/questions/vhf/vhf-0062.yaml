id: vhf-0062
option: cotier
theme: vhf
notion: vhf-smdsm-zones
famille: vhf-zone-a1-etendue
statut: publie
difficulte: 2
enonce: >-
  Tu navigues en zone A1 du SMDSM. En pratique, jusqu'à quelle distance de la côte
  s'étend-elle ?
propositions:
  - id: a
    texte: Six milles
  - id: b
    texte: De l'ordre de cent à cent cinquante milles
  - id: c
    texte: Soixante milles
  - id: d
    texte: Une vingtaine à une trentaine de milles
reponses:
  - d
explication: >-
  La zone A1 est celle que couvre une station côtière VHF équipée de l'appel sélectif
  numérique : en pratique une vingtaine à une trentaine de milles de la côte, la portée
  de la VHF vers une antenne haut perchée. Cent à cent cinquante milles, c'est l'ordre
  de grandeur de la zone A2, couverte par les stations en ondes hectométriques.
sources:
  - texte: 'Fiche VHF : voies, procédures d''appel et SMDSM'
    ref: fiche-vhf
