id: vhf-0027
option: cotier
theme: vhf
notion: vhf-relais
statut: publie
difficulte: 2
enonce: >-
  Tu entends un MAYDAY sur le canal 16 et aucune station ne répond au navire en détresse.
  Que fais-tu ?
propositions:
  - id: a
    texte: Tu émets un MAYDAY RELAY avec l'identité et la position du navire en détresse
  - id: b
    texte: Tu émets un MAYDAY en donnant le nom de ton propre navire
  - id: c
    texte: Tu passes sur une voie de travail pour prévenir un autre bateau
  - id: d
    texte: Tu gardes le silence, le CROSS finira par entendre l'appel
reponses:
  - a
explication: >-
  MAYDAY RELAY est le relais, par un navire ou une station, d'un message de détresse émis
  par un autre et resté sans réponse. Tu es peut-être le seul à l'avoir capté : ta position
  ou la hauteur de ton antenne te fait entendre ce que la côte n'entend pas. Un MAYDAY
  à ton nom ferait croire que c'est toi qui es en détresse, et une voie de travail ne
  serait veillée par personne.
sources:
  - texte: 'Fiche VHF : voies, procédures d''appel et SMDSM'
    ref: fiche-vhf
