id: vhf-0009
option: cotier
theme: vhf
notion: vhf-detresse
famille: vhf-signal-mayday
statut: publie
difficulte: 1
enonce: >-
  Quel mot le RIPAM retient-il comme signal radiotéléphonique de détresse ?
propositions:
  - id: a
    texte: SOS
  - id: b
    texte: MAYDAY
  - id: c
    texte: PAN PAN
reponses:
  - b
explication: >-
  Le signal radiotéléphonique de détresse est le mot MAYDAY. SOS existe aussi, mais comme
  signal en code Morse, pas comme mot prononcé à la radio. PAN PAN n'est pas un signal de
  détresse : c'est le signal d'urgence.
sources:
  - texte: RIPAM, annexe IV, 1 e)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
