id: vhf-0009
option: cotier
theme: vhf
statut: publie
difficulte: 1
enonce: >-
  Quel mot le RIPAM retient-il comme signal radiotéléphonique de détresse ?
propositions:
  - id: a
    texte: SOS
  - id: b
    texte: MAYDAY
  - id: c
    texte: PAN PAN
  - id: d
    texte: DÉTRESSE
reponses:
  - b
explication: >-
  L'annexe IV du RIPAM énumère les signaux qui indiquent la détresse et le besoin d'assistance.
  Le signal radiotéléphonique y est le mot MAYDAY. Le groupe SOS y figure aussi, mais
  comme signal émis par tout système de signalisation en code Morse, pas comme mot prononcé
  à la radio. PAN PAN n'est pas un signal de détresse : c'est le signal d'urgence.
sources:
  - texte: RIPAM, annexe IV, 1 e)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-04'
