id: vhf-0006
option: cotier
theme: vhf
statut: publie
difficulte: 2
enonce: >-
  Que peut-on émettre sur le canal 70 ?
propositions:
  - id: a
    texte: De la phonie, en cas de détresse seulement
  - id: b
    texte: Uniquement l'appel sélectif numérique
  - id: c
    texte: La conversation avec les capitaineries
  - id: d
    texte: Les bulletins météorologiques des CROSS
reponses:
  - b
explication: >-
  Le canal 70 est réservé à l'appel sélectif numérique. C'est une voie de données, sur
  laquelle aucune phonie ne passe, jamais : c'est par elle que part l'alerte quand on
  soulève le capot rouge. Le RIPAM la nomme d'ailleurs à son annexe IV, qui range parmi
  les signaux de détresse l'alerte émise par ASN sur la voie 70 en ondes métriques. Une
  fois l'alerte numérique partie, la parole se fait sur le canal 16.
sources:
  - texte: 'Fiche VHF : voies, procédures d''appel et SMDSM'
    ref: fiche-vhf
  - texte: RIPAM, annexe IV, 1 l) i)
    ref: decret-77-733
