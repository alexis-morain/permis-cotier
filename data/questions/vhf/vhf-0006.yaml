id: vhf-0006
option: cotier
theme: vhf
notion: vhf-canaux
statut: publie
difficulte: 2
enonce: >-
  Que peut-on émettre sur le canal 70 ?
propositions:
  - id: a
    texte: De la phonie, en cas de détresse seulement
  - id: b
    texte: Uniquement l'appel sélectif numérique
reponses:
  - b
explication: >-
  Le canal 70 est réservé à l'appel sélectif numérique. C'est une voie de données, sans
  aucune phonie : c'est par elle que part l'alerte quand on soulève le capot rouge. Une
  alerte ASN sur la voie 70 compte d'ailleurs parmi les signaux de détresse. Une fois
  l'alerte partie, la parole se fait sur le canal 16.
sources:
  - texte: 'Fiche VHF : voies, procédures d''appel et SMDSM'
    ref: fiche-vhf
  - texte: RIPAM, annexe IV, 1 l) i)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
