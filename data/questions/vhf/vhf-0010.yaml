id: vhf-0010
option: cotier
theme: vhf
statut: publie
difficulte: 2
enonce: >-
  Tu déclenches par erreur une alerte de détresse en manipulant ta VHF. Que fais-tu ?
propositions:
  - id: a
    texte: Rien, l'alerte s'annulera d'elle-même faute de confirmation
  - id: b
    texte: Tu éteins la VHF pour que l'alerte cesse
  - id: c
    texte: Tu annules aussitôt sur le canal 16, en le disant clairement
  - id: d
    texte: Tu attends que le CROSS te rappelle pour t'expliquer
reponses:
  - c
explication: >-
  Une fausse alerte mobilise des moyens de secours pour rien et les retire à ceux qui
  en ont besoin ailleurs. Elle s'annule en le disant sur le canal 16, sans attendre :
  couper la VHF laisserait au contraire le CROSS devant une alerte sans réponse, donc
  devant une détresse présumée. Le RIPAM interdit d'ailleurs l'usage d'un signal de détresse
  hors d'un cas de détresse, comme celui de tout signal susceptible d'être confondu avec
  l'un d'eux.
sources:
  - texte: RIPAM, annexe IV, 2
    ref: decret-77-733
  - texte: 'Fiche VHF : voies, procédures d''appel et SMDSM'
    ref: fiche-vhf
