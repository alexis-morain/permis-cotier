id: vhf-0001
option: cotier
theme: vhf
notion: vhf-crr
statut: publie
difficulte: 2
enonce: >-
  Tu quittes les eaux territoriales françaises pour les eaux internationales avec la VHF
  fixe de ton bateau de plaisance. Quel titre te faut-il ?
propositions:
  - id: a
    texte: Le certificat restreint de radiotéléphoniste du service mobile maritime.
  - id: b
    texte: Le permis de conduire en mer les bateaux de plaisance à moteur, qui suffit
      partout.
reponses:
  - a
explication: >-
  Pour manœuvrer une VHF depuis un navire de plaisance dans les eaux internationales, il
  faut le certificat restreint de radiotéléphoniste du service mobile maritime. Le piège :
  le permis plaisance ne vaut titre radio que pour une navigation limitée aux eaux
  territoriales françaises. Dès que tu en sors, il ne suffit plus.
sources:
  - texte: Arrêté du 18 mai 2005, article 1, 2)
    ref: arrete-2005-05-18
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
