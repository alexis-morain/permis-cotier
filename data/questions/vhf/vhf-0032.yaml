id: vhf-0032
option: cotier
theme: vhf
notion: vhf-canaux
statut: publie
difficulte: 2
enonce: >-
  Une opération de recherche et de sauvetage est en cours près de toi, entre navires et
  aéronefs. Sur quel canal se coordonne-t-elle ?
propositions:
  - id: a
    texte: Le canal 6
  - id: b
    texte: Le canal 70
  - id: c
    texte: Le canal 72
reponses:
  - a
explication: >-
  Le canal 6 est la voie de sécurité réservée à la coordination des opérations de recherche
  et de sauvetage entre navires et aéronefs. Le canal 70 ne porte que l'appel sélectif
  numérique, et le 72 est une voie de travail entre navires.
sources:
  - texte: 'Fiche VHF : voies, procédures d''appel et SMDSM'
    ref: fiche-vhf
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-09-05'
