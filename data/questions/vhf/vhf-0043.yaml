id: vhf-0043
option: cotier
theme: vhf
notion: vhf-asn
statut: publie
difficulte: 3
enonce: >-
  Ta VHF portative est munie de l'appel sélectif numérique. Avec quel MMSI doit-elle
  être programmée ?
propositions:
  - id: a
    texte: Celui qu'attribue l'autorité qui délivre les licences, comme pour la VHF fixe
  - id: b
    texte: "Aucun : seule la VHF fixe est programmée avec un MMSI"
reponses:
  - a
explication: >-
  Une VHF portative munie de l'ASN, comme une fixe, se programme avec le MMSI attribué par
  l'autorité qui délivre les licences de stations. Ce n'est pas forcément « le MMSI du
  navire » : seule la VHF fixe est liée au navire, une portative peut recevoir son propre
  identifiant.
sources:
  - texte: Division 240, article 240-2.20, III
    ref: division-240
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
