id: vhf-0043
option: cotier
theme: vhf
notion: vhf-asn
statut: publie
difficulte: 3
enonce: >-
  Ta VHF portative est munie de l'appel sélectif numérique. Avec quel MMSI doit-elle
  être programmée ?
propositions:
  - id: a
    texte: Celui qu'attribue l'autorité qui délivre les licences, comme pour la VHF fixe
  - id: b
    texte: "Aucun : seule la VHF fixe est programmée avec un MMSI"
reponses:
  - a
explication: >-
  L'article 240-2.20, III, vise les installations fixes et portatives munies de l'appel
  sélectif numérique : lorsqu'elles sont programmées, elles le sont avec le MMSI attribué
  par l'autorité qui délivre les licences de stations. La portative n'y échappe pas. Le
  texte ne dit pas « le MMSI du navire » : seul le IV, qui ne vise que la VHF fixe, le
  nomme ainsi. Une portative peut recevoir son propre identifiant.
sources:
  - texte: Division 240, article 240-2.20, III
    ref: division-240
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-03'
