id: vhf-0048
option: cotier
theme: vhf
notion: vhf-smdsm-zones
statut: publie
difficulte: 2
enonce: >-
  Comment la zone A1 du SMDSM est-elle délimitée ?
propositions:
  - id: a
    texte: Par la portée d'une station côtière VHF équipée de l'appel sélectif numérique
  - id: b
    texte: Par la couverture des satellites géostationnaires
  - id: c
    texte: Par une bande de six milles le long des côtes
reponses:
  - a
explication: >-
  La zone A1 est celle où l'on se trouve dans la portée d'une station côtière VHF munie
  de l'ASN, en pratique une vingtaine à une trentaine de milles de la côte. La plaisance
  côtière française y navigue. La couverture satellitaire définit la zone A3, et les six
  milles sont la limite du permis côtier, pas celle du SMDSM.
sources:
  - texte: 'Fiche VHF : voies, procédures d''appel et SMDSM'
    ref: fiche-vhf
