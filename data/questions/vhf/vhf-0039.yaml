id: vhf-0039
option: cotier
theme: vhf
notion: vhf-detresse
statut: publie
difficulte: 2
enonce: >-
  Dans quelle situation le mot MAYDAY est-il justifié ?
propositions:
  - id: a
    texte: Un danger grave et imminent menace le navire ou une personne, et une assistance
      immédiate est demandée
  - id: b
    texte: Le moteur est en panne, la mer est belle et personne n'est en danger
  - id: c
    texte: Tu veux prévenir les autres navires d'un objet flottant dangereux
reponses:
  - a
explication: >-
  MAYDAY est le signal de détresse : un danger grave et imminent menace le navire ou une
  personne, et une assistance immédiate est demandée. La panne sans danger relève de PAN
  PAN, et l'avertissement aux autres navires du signal SÉCURITÉ.
sources:
  - texte: 'Fiche VHF : voies, procédures d''appel et SMDSM'
    ref: fiche-vhf
meta:
