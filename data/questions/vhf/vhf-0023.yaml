id: vhf-0023
option: cotier
theme: vhf
notion: vhf-asn
statut: publie
difficulte: 2
enonce: >-
  Tu soulèves le capot rouge de ta VHF et tu maintiens la touche de détresse. Que part-il
  ?
propositions:
  - id: a
    texte: Une alerte numérique sur le canal 70
  - id: b
    texte: Un message parlé automatique sur le canal 16
  - id: c
    texte: Une alerte portant le MMSI du navire
  - id: d
    texte: Le nombre de personnes à bord
reponses:
  - a
  - c
explication: >-
  La touche de détresse envoie une alerte de données sur le canal 70, et cette alerte
  porte le MMSI programmé dans l'appareil, donc l'identité du navire. Elle y ajoute la
  position quand un récepteur de positionnement est raccordé. Elle ne dit rien de plus
  : ni le nombre de personnes à bord, ni la nature de l'avarie, qui se disent à la voix
  ensuite.
sources:
  - texte: 'Fiche VHF : voies, procédures d''appel et SMDSM'
    ref: fiche-vhf
