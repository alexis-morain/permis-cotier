id: vhf-0025
option: cotier
theme: vhf
notion: vhf-detresse
statut: publie
difficulte: 2
enonce: >-
  Tu lances un MAYDAY sur le canal 16. Après avoir prononcé MAYDAY trois fois, par quoi
  continues-tu ?
propositions:
  - id: a
    texte: Ta position en latitude et longitude
  - id: b
    texte: ICI, puis le nom de ton navire répété trois fois
  - id: c
    texte: La nature de la détresse
reponses:
  - b
explication: >-
  Le message suit toujours le même ordre : MAYDAY trois fois, puis ICI et le nom du navire
  trois fois avec son MMSI ou son indicatif, puis MAYDAY et le nom une fois, la position,
  la nature de la détresse, l'assistance demandée, le nombre de personnes à bord, et À
  VOUS. On s'identifie avant tout le reste : sans identité, une position entendue à moitié
  ne sert à personne.
sources:
  - texte: 'Fiche VHF : voies, procédures d''appel et SMDSM'
    ref: fiche-vhf
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
