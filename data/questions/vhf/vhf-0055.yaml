id: vhf-0055
option: cotier
theme: vhf
notion: vhf-alphabet
statut: publie
difficulte: 2
enonce: >-
  Ton bateau s'appelle MISTRAL et la station côtière te demande de l'épeler. Que dis-tu
  ?
propositions:
  - id: a
    texte: Mike India Sierra Tango Romeo Alfa Lima
  - id: b
    texte: Mike Italia Sierra Tango Roméo Alpha Lima
  - id: c
    texte: Marie Irma Suzanne Thérèse Raoul Anatole Louis
reponses:
  - a
explication: >-
  Les lettres se disent Mike, India, Sierra, Tango, Romeo, Alfa et Lima dans l'alphabet
  phonétique international. Les prénoms français sont l'ancien alphabet téléphonique,
  que personne ne comprend à l'étranger.
sources:
  - texte: 'Fiche VHF : voies, procédures d''appel et SMDSM'
    ref: fiche-vhf
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-09-05'
