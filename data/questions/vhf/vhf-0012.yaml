id: vhf-0012
option: cotier
theme: vhf
notion: vhf-emport
statut: publie
difficulte: 3
enonce: >-
  Tu pars pour une navigation à 80 milles d'un abri. Que t'impose l'armement hauturier
  en plus de la VHF fixe déjà exigée en semi-hauturier ?
propositions:
  - id: a
    texte: Une radiobalise de localisation des sinistres
  - id: b
    texte: Un émetteur-récepteur VHF portatif et étanche
  - id: c
    texte: Un second poste VHF fixe, sur une alimentation séparée
  - id: d
    texte: Un téléphone satellitaire
reponses:
  - a
  - b
explication: >-
  À 60 milles et plus d'un abri, l'armement hauturier reprend le semi-hauturier et y ajoute
  notamment une radiobalise de localisation des sinistres et un émetteur-récepteur VHF
  portatif et étanche. Un dispositif de communication par satellite est seulement
  recommandé, pas imposé.
sources:
  - texte: Division 240, article 240-2.06, points 2 et 3
    ref: division-240
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
