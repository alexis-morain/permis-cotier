id: vhf-0064
option: cotier
theme: vhf
notion: vhf-sauvetage
statut: publie
difficulte: 2
enonce: >-
  Lesquels de ces signaux radio le RIPAM range-t-il parmi les signaux de détresse ?
propositions:
  - id: a
    texte: Un appel annoncé par PAN PAN sur le canal 16
  - id: b
    texte: Les signaux émis par une radiobalise de localisation des sinistres
  - id: c
    texte: Un message annoncé par SÉCURITÉ sur le canal 16
  - id: d
    texte: Les signaux d'un répondeur radar d'embarcation ou de radeau de sauvetage
reponses:
  - b
  - d
explication: >-
  Les signaux d'une radiobalise de localisation des sinistres et ceux d'un répondeur radar
  d'embarcation ou de radeau de sauvetage indiquent la détresse. PAN PAN et SÉCURITÉ n'en
  font pas partie : le premier annonce l'urgence, le second un message sur la sécurité de la
  navigation.
sources:
  - texte: RIPAM, annexe IV, 1 n) et o)
    ref: decret-77-733
  - texte: 'Fiche VHF : voies, procédures d''appel et SMDSM'
    ref: fiche-vhf
meta:
  cree_le: '2026-10-09'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
