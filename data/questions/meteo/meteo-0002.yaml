id: meteo-0002
option: cotier
theme: meteo
notion: meteo-bulletin
statut: publie
difficulte: 2
enonce: >-
  À partir de quelle force de vent Météo-France émet-il un bulletin météorologique spécial
  côte, celui des zones côtières ?
propositions:
  - id: a
    texte: Force 6
  - id: b
    texte: Force 7
  - id: c
    texte: Force 8
reponses:
  - b
explication: >-
  Le BMS côte est émis dès qu'un vent moyen de force 7 au moins est observé ou prévu sur une
  zone côtière : c'est l'avis de grand frais. Au large, le seuil est la force 8, le coup de
  vent. Le nom de l'avis suit ensuite la force annoncée : coup de vent à 8, fort coup de
  vent à 9, tempête à 10, violente tempête à 11, ouragan à 12. Le BMS est diffusé dès sa
  parution, sans attendre l'heure du bulletin ordinaire.
sources:
  - texte: 'Fiche météorologie : échelle de Beaufort et état de la mer'
    ref: fiche-meteo
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-10-03'
