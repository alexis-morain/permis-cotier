id: meteo-0025
option: cotier
theme: meteo
notion: meteo-facteurs
statut: publie
difficulte: 2
enonce: >-
  En fin de nuit, au mouillage près de la côte, un vent faible se lève et souffle de la
  terre vers la mer. Comment s'appelle-t-il ?
propositions:
  - id: a
    texte: La brise de terre
  - id: b
    texte: La brise de mer
  - id: c
    texte: Le vent de dépression
reponses:
  - a
explication: >-
  La nuit, la terre se refroidit plus vite que la mer et le mécanisme de la brise thermique
  s'inverse : la brise de terre, plus faible que la brise de mer, souffle de la terre
  vers la mer en fin de nuit. La brise de mer, elle, s'établit en début d'après-midi.
sources:
  - texte: 'Fiche météorologie : échelle de Beaufort et état de la mer'
    ref: fiche-meteo
