id: meteo-0017
option: cotier
theme: meteo
notion: meteo-beaufort
statut: publie
difficulte: 2
enonce: >-
  Un avis de grand frais est diffusé. À quelle force de vent correspond-il ?
propositions:
  - id: a
    texte: Force 7
  - id: b
    texte: Force 8
  - id: c
    texte: Force 6
reponses:
  - a
explication: >-
  L'avis de grand frais est émis à partir de la force 7, 28 à 33 nœuds. L'avis de coup
  de vent commence à la force 8, et l'avis de tempête à la force 10. C'est à partir de
  la force 7 que Météo-France diffuse un bulletin météorologique spécial.
sources:
  - texte: 'Fiche météorologie : échelle de Beaufort et état de la mer'
    ref: fiche-meteo
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-05'
