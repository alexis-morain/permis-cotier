id: signaux-0008
option: cotier
theme: signaux
notion: signaux-attirer-attention
statut: publie
difficulte: 2
enonce: >-
  Tu vois qu'un navire fait route vers un danger et tu veux attirer son attention avec
  ton projecteur. Comment l'emploies-tu ?
propositions:
  - id: a
    texte: Tu orientes le faisceau vers le danger, sans gêner les autres navires.
  - id: b
    texte: Tu orientes le faisceau vers la passerelle du navire menacé.
  - id: c
    texte: Tu reproduis avec le faisceau le rythme du feu de l'aide à la navigation la
      plus proche.
reponses:
  - a
explication: >-
  La règle 36 autorise à orienter le faisceau du projecteur en direction du danger qui
  menace un navire, à condition que ce faisceau ne puisse gêner d'autres navires. Le piège
  est d'éclairer le navire lui-même plutôt que le danger : c'est l'endroit menaçant qu'il
  faut désigner, et éblouir une passerelle ou balayer l'horizon revient à gêner la veille
  au lieu de l'aider. Copier le rythme d'une aide à la navigation est également exclu,
  la même règle interdit toute confusion avec une aide à la navigation.
sources:
  - texte: RIPAM, règle 36
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
