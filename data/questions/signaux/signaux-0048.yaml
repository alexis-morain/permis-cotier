id: signaux-0048
option: cotier
theme: signaux
notion: signaux-attirer-attention
statut: publie
difficulte: 2
enonce: >-
  Tu veux attirer l'attention d'un navire qui ne t'a pas vu. Quels signaux la règle 36
  te permet-elle ?
propositions:
  - id: a
    texte: Des signaux lumineux ou sonores qui ne peuvent être confondus avec aucun signal
      réglementaire
  - id: b
    texte: Cinq sons brefs, le signal de doute
  - id: c
    texte: Une fusée rouge
reponses:
  - a
explication: >-
  Tout navire peut, pour appeler l'attention, émettre des signaux lumineux ou sonores
  ne pouvant être confondus avec tout autre signal autorisé par les règles. Le signal
  de doute a son propre sens, et la fusée rouge est un signal de détresse, interdit hors
  détresse.
sources:
  - texte: RIPAM, règle 36
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-09-05'
