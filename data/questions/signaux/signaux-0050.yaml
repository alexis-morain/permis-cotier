id: signaux-0050
option: cotier
theme: signaux
notion: signaux-meteo
statut: publie
difficulte: 3
enonce: >-
  Parmi ces correspondances entre le nom d'un avis et la force annoncée, lesquelles sont
  exactes ?
propositions:
  - id: a
    texte: Avis de fort coup de vent, à partir de force 9
  - id: b
    texte: Avis d'ouragan, à force 12
  - id: c
    texte: Avis de violente tempête, à partir de force 10
  - id: d
    texte: Avis de tempête, à partir de force 11
reponses:
  - a
  - b
explication: >-
  L'échelle des avis suit celle de Beaufort, degré par degré : grand frais 7, coup de
  vent 8, fort coup de vent 9, tempête 10, violente tempête 11, ouragan 12. Les deux
  propositions fausses décalent la tempête et la violente tempête d'un cran, ce qui est
  la façon la plus courante de se tromper.
sources:
  - texte: 'Fiche météorologie : échelle de Beaufort et état de la mer'
    ref: fiche-meteo
