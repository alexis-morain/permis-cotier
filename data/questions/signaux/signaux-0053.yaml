id: signaux-0053
option: cotier
theme: signaux
notion: signaux-detresse
statut: publie
difficulte: 2
enonce: >-
  Un aéronef des secours te recherche en mer. Quel signal l'annexe IV du RIPAM cite-t-elle
  pour faciliter ton repérage aérien ?
propositions:
  - id: a
    texte: Une toile blanche portant une croix rouge
  - id: b
    texte: Une toile jaune portant deux triangles noirs
  - id: c
    texte: Une toile orange portant un carré et un cercle noirs
  - id: d
    texte: Une toile verte portant un cercle blanc
reponses:
  - c
explication: >-
  Le paragraphe 3 a) de l'annexe IV du RIPAM appelle l'attention sur un morceau de toile
  de couleur orange portant un carré et un cercle de couleur noire, ou un autre symbole
  approprié, pour le repérage aérien. Le même paragraphe cite aussi le colorant. Aucune
  des autres toiles proposées n'y figure.
sources:
  - texte: RIPAM, annexe IV, 3 a)
    ref: decret-77-733
meta:
  cree_le: '2026-09-26'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-26'
