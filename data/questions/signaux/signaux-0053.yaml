id: signaux-0053
option: cotier
theme: signaux
notion: signaux-detresse
statut: publie
difficulte: 2
enonce: >-
  Un aéronef des secours te recherche en mer. Quel signal le RIPAM cite-t-il pour
  faciliter ton repérage aérien ?
propositions:
  - id: a
    texte: Une toile blanche portant une croix rouge
  - id: b
    texte: Une toile jaune portant deux triangles noirs
  - id: c
    texte: Une toile orange portant un carré et un cercle noirs
  - id: d
    texte: Une toile verte portant un cercle blanc
reponses:
  - c
explication: >-
  Pour le repérage aérien, le signal cité est un morceau de toile orange portant un carré et
  un cercle noirs, ou un autre symbole approprié. La même liste cite aussi le colorant.
  Aucune des autres toiles proposées n'y figure.
sources:
  - texte: RIPAM, annexe IV, 3 a)
    ref: decret-77-733
meta:
  cree_le: '2026-09-26'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-13'
