id: signaux-0012
option: cotier
theme: signaux
notion: signaux-coude
statut: publie
difficulte: 2
enonce: >-
  Tu t'approches d'un coude de chenal où un obstacle te masque la vue. Quel signal
  émets-tu, et que fait le navire qui l'entend de l'autre côté ?
propositions:
  - id: a
    texte: Un son prolongé, auquel il répond par un son prolongé.
  - id: b
    texte: Un son bref, auquel il répond par deux sons brefs.
  - id: c
    texte: Cinq sons brefs et rapprochés, auxquels il répond de la même façon.
reponses:
  - a
explication: >-
  Un son prolongé à l'approche du coude, et un son prolongé en réponse : le signal se
  répond à l'identique, c'est ce qui permet à chacun de savoir qu'il a été entendu. Le
  piège est de le confondre avec le signal du doute, qui est une série rapide d'au moins
  cinq sons brefs, ou avec les signaux de manœuvre en sons brefs, qui disent un changement
  de cap. Cet alinéa porte d'ailleurs une coquille dans le texte publié au Journal
  officiel, où il est imprimé « c) » alors qu'il vient après le d).
sources:
  - texte: RIPAM, règle 34 e)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
