id: signaux-0045
option: cotier
theme: signaux
notion: signaux-detresse
statut: publie
difficulte: 2
enonce: >-
  Tu entends un navire faire retentir sans interruption sa corne de brume. Que t'indique
  ce son continu ?
propositions:
  - id: a
    texte: Il est en détresse et demande assistance
  - id: b
    texte: Il est au mouillage dans la brume
  - id: c
    texte: Il approche d'un coude de chenal
reponses:
  - a
explication: >-
  Le son continu produit par un appareil quelconque pour signaux de brume est un signal
  de détresse de l'annexe IV. Les signaux de brume réglementaires sont tous rythmés, par
  sons brefs et prolongés séparés d'intervalles.
sources:
  - texte: RIPAM, annexe IV, 1 b)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-05'
