id: signaux-0010
option: cotier
theme: signaux
notion: signaux-detresse
statut: publie
difficulte: 1
enonce: >-
  Ton navire est en détresse et tu demandes assistance. Dans quelle annexe le RIPAM
  décrit-il les signaux que tu dois utiliser ou montrer ?
propositions:
  - id: a
    texte: Dans l'annexe des signaux supplémentaires des navires de pêche
  - id: b
    texte: Dans l'annexe des appareils à signaux sonores
  - id: c
    texte: Dans l'annexe des signaux de détresse
reponses:
  - c
explication: >-
  Un navire en détresse qui demande assistance utilise ou montre les signaux décrits à
  l'annexe IV du RIPAM, et à elle seule. Piège : retenir qu'il existe une annexe sans
  retenir laquelle, et citer au jugé une des trois autres.
sources:
  - texte: RIPAM, règle 37
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-13'
