id: signaux-0010
option: cotier
theme: signaux
notion: signaux-detresse
statut: retire
difficulte: 1
enonce: >-
  Ton navire est en détresse et tu demandes assistance. Où le RIPAM décrit-il les signaux
  que tu dois utiliser ou montrer ?
propositions:
  - id: a
    texte: à l'annexe II
  - id: b
    texte: à l'annexe III
  - id: c
    texte: à l'annexe IV
reponses:
  - c
explication: >-
  Un navire en détresse qui demande assistance utilise ou montre les signaux décrits à
  l'annexe IV du RIPAM, et à elle seule. Piège : retenir qu'il existe une annexe sans
  retenir laquelle, et citer au jugé une des trois autres.
sources:
  - texte: RIPAM, règle 37
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
