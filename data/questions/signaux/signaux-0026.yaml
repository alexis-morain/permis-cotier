id: signaux-0026
option: cotier
theme: signaux
notion: signaux-brume
statut: publie
difficulte: 2
enonce: >-
  Dans une zone de visibilité réduite, ce signal au sifflet te parvient. Dans quel état
  se trouve le navire qui l'émet ?
visuel:
  fichier: sons/brume-stoppe.svg
  alt: "Deux sons prolongés au sifflet, séparés par un silence court au regard de leur propre durée."
  credit: code
propositions:
  - id: a
    texte: Il est à propulsion mécanique.
  - id: b
    texte: Il fait route, mais stoppé, sans erre.
  - id: c
    texte: Il avance encore sur l'eau, avec de l'erre.
  - id: d
    texte: Il est au mouillage.
reponses:
  - a
  - b
explication: >-
  Deux sons prolongés, c'est le navire à propulsion mécanique qui fait route mais est
  stoppé, sans erre : le signal dit à la fois le mode de propulsion et l'état de la marche.
  Piège : s'il a encore de l'erre, il n'émet qu'un seul son prolongé. Faire route et être
  stoppé ne se contredisent pas, faire route veut seulement dire n'être ni au mouillage, ni
  amarré, ni échoué. Le navire au mouillage, lui, sonne la cloche.
sources:
  - texte: RIPAM, règle 35 b)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
