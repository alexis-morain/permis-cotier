id: signaux-0009
option: cotier
theme: signaux
statut: publie
difficulte: 2
enonce: >-
  Quel emploi la règle 36 demande-t-elle d'éviter pour appeler l'attention d'un autre
  navire ?
propositions:
  - id: a
    texte: Les feux intermittents ou tournants à haute intensité, comme les phares gyroscopiques.
  - id: b
    texte: Les signaux sonores qui ne peuvent être confondus avec un autre signal autorisé.
  - id: c
    texte: Le faisceau d'un projecteur orienté vers le danger qui menace un navire.
  - id: d
    texte: Les feux à éclats de faible intensité.
reponses:
  - a
explication: >-
  La règle 36 précise que l'emploi de feux intermittents ou tournants à haute intensité,
  tels que les phares gyroscopiques, doit être évité, parce qu'un tel feu risque d'être
  pris pour une aide à la navigation. Les signaux sonores non confondables et le projecteur
  dirigé vers le danger sont au contraire les moyens que la règle autorise. Le piège est
  de confondre ce qui est proscrit avec ce qui est permis dans la même règle.
sources:
  - texte: RIPAM, règle 36
    ref: decret-77-733
