id: signaux-0028
option: cotier
theme: signaux
notion: signaux-brume
statut: publie
difficulte: 2
enonce: >-
  Dans la brume, un navire émet son signal réglementaire et y ajoute celui-ci au sifflet.
  Que t'apprend ce signal supplémentaire ?
visuel:
  fichier: sons/brume-pilote.svg
  alt: "Quatre sons brefs au sifflet, de durées égales."
  credit: code
propositions:
  - id: a
    texte: C'est un bateau-pilote en service de pilotage.
  - id: b
    texte: Il n'est pas maître de sa manœuvre.
  - id: c
    texte: Il ne comprend pas tes intentions.
reponses:
  - a
explication: >-
  La règle 35 k) autorise le bateau-pilote en service de pilotage à faire entendre, en
  plus des signaux des paragraphes a), b) ou g), un signal d'identification de quatre
  sons brefs. C'est un signal qui s'ajoute, jamais un signal qui remplace : le pilote
  émet d'abord celui que lui vaut son état de marche. Ne le confonds pas avec la série
  rapide d'au moins cinq sons brefs, qui est le signal du doute de la règle 34 d) et ne
  vaut qu'entre navires en vue l'un de l'autre. Le navire non maître de sa manœuvre émet
  un son prolongé et deux sons brefs, et l'échouement se signale à la cloche.
sources:
  - texte: RIPAM, règle 35 k)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
