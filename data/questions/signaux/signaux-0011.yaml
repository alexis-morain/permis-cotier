id: signaux-0011
option: cotier
theme: signaux
notion: signaux-detresse
statut: publie
difficulte: 2
enonce: >-
  Dans quel cas la règle 37 du RIPAM demande-t-elle d'employer les signaux de détresse
  ?
propositions:
  - id: a
    texte: quand ton navire est en détresse et que tu demandes assistance
  - id: b
    texte: quand tu n'es plus maître de ta manœuvre
reponses:
  - a
explication: >-
  La règle 37 vise le navire « en détresse et qui demande assistance » : les deux conditions
  vont ensemble. Ne plus être maître de sa manœuvre relève d'autres feux, marques et signaux
  sonores. Piège classique : confondre la détresse avec la simple difficulté de manœuvre,
  qui ne justifie pas un signal de détresse.
sources:
  - texte: RIPAM, règle 37
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
