id: signaux-0011
option: cotier
theme: signaux
statut: publie
difficulte: 2
enonce: >-
  Dans quel cas la règle 37 du RIPAM demande-t-elle d'employer les signaux de détresse
  ?
propositions:
  - id: a
    texte: quand ton navire est en détresse et que tu demandes assistance
  - id: b
    texte: quand une avarie t'oblige à réduire ton allure
  - id: c
    texte: quand tu n'es plus maître de ta manœuvre
  - id: d
    texte: quand tu entres dans une zone de visibilité réduite
reponses:
  - a
explication: >-
  La règle 37 vise le navire « en détresse et qui demande assistance » : les deux conditions
  vont ensemble, et c'est ce cas précis qui ouvre l'emploi des signaux de l'annexe IV.
  Les autres situations proposées relèvent d'autres règles et appellent d'autres signaux.
  Le piège classique est de confondre la détresse avec la simple difficulté de manœuvre
  ou avec la brume, qui ne justifient pas un signal de détresse.
sources:
  - texte: RIPAM, règle 37
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-04'
