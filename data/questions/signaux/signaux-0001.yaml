id: signaux-0001
option: cotier
theme: signaux
notion: signaux-manoeuvre
statut: publie
difficulte: 2
enonce: >-
  Tu fais route au moteur, en vue d'un autre navire, et tu viens sur bâbord. Quel signal
  émets-tu au sifflet ?
propositions:
  - id: a
    texte: Un son bref
  - id: b
    texte: Deux sons brefs
reponses:
  - b
explication: >-
  La règle 34 a) fixe trois signaux pour un navire à propulsion mécanique qui fait route
  et manœuvre en vue d'un autre : un son bref pour « Je viens sur tribord », deux sons
  brefs pour « Je viens sur bâbord », trois sons brefs pour « Je bats en arrière ». Le
  piège tient à l'inversion bâbord tribord, qui fait choisir un seul son bref.
sources:
  - texte: RIPAM, règle 34 a)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
