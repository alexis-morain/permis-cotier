id: signaux-0006
option: cotier
theme: signaux
notion: signaux-brume
famille: signaux-brume-quel-signal
statut: publie
difficulte: 3
enonce: >-
  Dans la brume, un navire à propulsion mécanique de 25 mètres fait route mais se trouve
  stoppé, sans erre. Quel signal sonore doit-il émettre ?
propositions:
  - id: a
    texte: Un son prolongé, à des intervalles ne dépassant pas deux minutes.
  - id: b
    texte: Deux sons prolongés séparés par deux secondes environ, à des intervalles ne
      dépassant pas deux minutes.
  - id: c
    texte: Deux sons brefs séparés par deux secondes environ, à des intervalles ne dépassant
      pas deux minutes.
reponses:
  - b
explication: >-
  Le navire à propulsion mécanique qui fait route mais qui est stoppé et n'a plus d'erre
  émet deux sons prolongés séparés par deux secondes environ, à des intervalles de deux
  minutes au plus. Piège : tant que le navire avance encore, il n'émet qu'un seul son
  prolongé. Et ce sont bien deux sons prolongés, pas deux sons brefs.
sources:
  - texte: RIPAM, règle 35 b)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
