id: signaux-0006
option: cotier
theme: signaux
statut: publie
difficulte: 3
enonce: >-
  Dans la brume, un navire à propulsion mécanique de 25 mètres fait route mais se trouve
  stoppé, sans erre. Quel signal sonore doit-il émettre ?
propositions:
  - id: a
    texte: Un son prolongé, à des intervalles ne dépassant pas deux minutes.
  - id: b
    texte: Un son prolongé suivi de deux sons brefs, à des intervalles ne dépassant pas
      deux minutes.
  - id: c
    texte: Deux sons prolongés séparés par deux secondes environ, à des intervalles ne
      dépassant pas deux minutes.
  - id: d
    texte: Deux sons brefs séparés par deux secondes environ, à des intervalles ne dépassant
      pas deux minutes.
reponses:
  - c
explication: >-
  La règle 35 b) vise le navire à propulsion mécanique qui fait route mais qui est stoppé
  et n'a plus d'erre : deux sons prolongés séparés par un intervalle de deux secondes
  environ, à des intervalles ne dépassant pas deux minutes. Le piège est la distinction
  avec le paragraphe a), qui ne demande qu'un seul son prolongé tant que le navire avance
  encore. Attention aussi à la nature des sons : ce sont deux sons prolongés, pas deux
  sons brefs.
sources:
  - texte: RIPAM, règle 35 b)
    ref: decret-77-733
