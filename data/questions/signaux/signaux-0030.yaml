id: signaux-0030
option: cotier
theme: signaux
notion: signaux-brume
famille: signaux-brume-cloche
statut: publie
difficulte: 3
enonce: >-
  Dans la brume, tu entends ce signal à la cloche. Que peux-tu dire du navire qui
  l'émet ?
visuel:
  fichier: sons/brume-mouillage.svg
  alt: "La cloche sonnée rapidement pendant cinq secondes environ, une suite serrée de coups et non un son tenu."
  credit: code
propositions:
  - id: a
    texte: Il est au mouillage.
  - id: b
    texte: Il peut y ajouter au sifflet un son bref, un son prolongé et un son bref.
  - id: c
    texte: Sa cloche fait entendre un son prolongé de cinq secondes.
  - id: d
    texte: Il est échoué.
reponses:
  - a
  - b
explication: >-
  Le navire au mouillage fait sonner sa cloche rapidement, et peut ajouter au sifflet un son
  bref, un son prolongé et un son bref pour signaler sa position à un navire qui s'approche.
  La cloche est frappée, pas tenue : une volée de coups serrés, jamais un son prolongé, qui
  appartient au sifflet seul. Le navire échoué sonne aussi cette volée, mais il l'encadre de
  trois coups séparés et distincts : sans ces coups de part et d'autre, le navire est au
  mouillage.
sources:
  - texte: RIPAM, règle 35 g)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
