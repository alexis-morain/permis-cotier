id: signaux-0038
option: cotier
theme: signaux
notion: signaux-brume
statut: publie
difficulte: 2
enonce: >-
  Ton bateau de 6 mètres n'a ni sifflet ni cloche. Que t'impose la règle 33 ?
propositions:
  - id: a
    texte: Avoir à bord un autre moyen d'émettre un signal sonore efficace
  - id: b
    texte: Rien, les navires de moins de 12 mètres sont dispensés de tout signal sonore
  - id: c
    texte: Installer une cloche
reponses:
  - a
explication: >-
  Les navires de moins de 12 mètres ne sont pas tenus d'avoir le sifflet, la cloche ou
  le gong de la règle 33 a), mais ils doivent, en l'absence de tels appareils, être munis
  d'un autre moyen d'émettre un signal sonore efficace. Une corne de brume à main fait
  l'affaire.
sources:
  - texte: RIPAM, règle 33 b)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-09-05'
