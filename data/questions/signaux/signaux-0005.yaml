id: signaux-0005
option: cotier
theme: signaux
notion: signaux-brume
famille: signaux-brume-quel-signal
statut: publie
difficulte: 1
enonce: >-
  Un navire à propulsion mécanique de 25 mètres fait route avec de l'erre dans une zone
  de visibilité réduite. Quel signal sonore doit-il émettre ?
propositions:
  - id: a
    texte: Deux sons prolongés séparés par deux secondes environ, à des intervalles ne
      dépassant pas deux minutes.
  - id: b
    texte: Un son prolongé, à des intervalles ne dépassant pas deux minutes.
  - id: c
    texte: Un son prolongé, à des intervalles ne dépassant pas une minute.
reponses:
  - b
explication: >-
  Le navire à propulsion mécanique qui a de l'erre, c'est-à-dire qui avance sur l'eau, émet
  un son prolongé à des intervalles de deux minutes au plus. Deux sons prolongés
  désigneraient au contraire un navire stoppé, et le son prolongé suivi de deux sons brefs
  appartient à d'autres navires. Deuxième piège, la cadence : deux minutes au maximum, pas
  une.
sources:
  - texte: RIPAM, règle 35 a)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
