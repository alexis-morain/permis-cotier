id: signaux-0044
option: cotier
theme: signaux
notion: signaux-detresse
statut: publie
difficulte: 2
enonce: >-
  Pour fêter une arrivée, un équipier propose de tirer une fusée rouge périmée. Que dit
  l'annexe IV du RIPAM ?
propositions:
  - id: a
    texte: C'est interdit, sauf pour indiquer un cas de détresse ou un besoin d'assistance
  - id: b
    texte: C'est permis si la fusée est périmée
  - id: c
    texte: C'est permis à moins de 300 mètres du rivage
reponses:
  - a
explication: >-
  L'usage de l'un quelconque des signaux de détresse est interdit, sauf dans le but d'indiquer
  un cas de détresse ou un besoin d'assistance. Une fusée rouge tirée pour rien déclenche
  des secours pour rien, et son auteur en répond.
sources:
  - texte: RIPAM, annexe IV, 2
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-05'
