id: signaux-0032
option: cotier
theme: signaux
notion: signaux-portuaires
famille: signaux-portuaires-trois-feux
statut: publie
difficulte: 2
enonce: >-
  À l'entrée d'un port, ce signal est allumé. Que signifie-t-il ?
visuel:
  fichier: ecluses/port-trois-verts-verticaux.svg
  alt: "Trois feux verts allumés, l'un au-dessus de l'autre."
  credit: code
propositions:
  - id: a
    texte: Le passage est autorisé, sous certaines conditions
  - id: b
    texte: Le passage est libre pour tous, sans aucune restriction
  - id: c
    texte: Le passage est interdit
reponses:
  - a
explication: >-
  Trois feux verticaux verts signifient passage autorisé sous certaines conditions. Le
  message principal peut être complété par des signaux auxiliaires, dont la lecture demande
  les publications nautiques, et des règlements locaux de police s'y ajoutent souvent.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe V, 6.15
    ref: arrete-2017-11-30
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-13'
