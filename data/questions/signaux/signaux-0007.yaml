id: signaux-0007
option: cotier
theme: signaux
notion: signaux-brume
famille: signaux-brume-quel-signal
statut: publie
difficulte: 2
enonce: >-
  Un navire à voile de 25 mètres navigue dans une zone de visibilité réduite. Quel signal
  sonore doit-il émettre ?
propositions:
  - id: a
    texte: Un son prolongé, à des intervalles ne dépassant pas deux minutes.
  - id: b
    texte: Un son prolongé suivi de trois sons brefs, à des intervalles ne dépassant pas
      deux minutes.
  - id: c
    texte: Un son prolongé suivi de deux sons brefs, à des intervalles ne dépassant pas
      deux minutes.
reponses:
  - c
explication: >-
  Le navire à voile émet un son prolongé suivi de deux sons brefs, comme le navire qui n'est
  pas maître de sa manœuvre, celui à capacité de manœuvre restreinte, celui handicapé par
  son tirant d'eau, celui qui pêche et celui qui en remorque ou en pousse un autre. Ce
  signal remplace ceux de la propulsion mécanique. Un son prolongé suivi de trois sons brefs
  existe, mais c'est celui du navire remorqué.
sources:
  - texte: RIPAM, règle 35 c)
    ref: decret-77-733
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
