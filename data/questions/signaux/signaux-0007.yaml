id: signaux-0007
option: cotier
theme: signaux
statut: publie
difficulte: 2
enonce: >-
  Un navire à voile de 25 mètres navigue dans une zone de visibilité réduite. Quel signal
  sonore doit-il émettre ?
propositions:
  - id: a
    texte: Un son prolongé, à des intervalles ne dépassant pas deux minutes.
  - id: b
    texte: Deux sons prolongés séparés par deux secondes environ, à des intervalles ne
      dépassant pas deux minutes.
  - id: c
    texte: Un son prolongé suivi de trois sons brefs, à des intervalles ne dépassant pas
      deux minutes.
  - id: d
    texte: Un son prolongé suivi de deux sons brefs, à des intervalles ne dépassant pas
      deux minutes.
reponses:
  - d
explication: >-
  La règle 35 c) range le navire à voile avec le navire qui n'est pas maître de sa manœuvre,
  celui à capacité de manœuvre restreinte, celui handicapé par son tirant d'eau, celui
  en train de pêcher et celui qui en remorque ou en pousse un autre : tous émettent trois
  sons consécutifs, un son prolongé suivi de deux sons brefs, à des intervalles ne dépassant
  pas deux minutes. Ce signal remplace ceux des paragraphes a) et b), qui sont réservés
  à la propulsion mécanique. Le son prolongé suivi de trois sons brefs existe bien, mais
  c'est celui du navire remorqué, prévu au paragraphe e).
sources:
  - texte: RIPAM, règle 35 c)
    ref: decret-77-733
