id: signaux-0020
option: cotier
theme: signaux
notion: signaux-brume
famille: signaux-brume-qui-emet
statut: publie
difficulte: 3
enonce: >-
  Dans une zone de visibilité réduite, tu entends ce signal au sifflet. Quels navires
  la règle 35 c) autorise-t-elle à l'émettre ?
visuel:
  fichier: sons/brume-manoeuvre-restreinte.svg
  alt: "Un son prolongé au sifflet, suivi de deux sons brefs."
  credit: code
propositions:
  - id: a
    texte: Un navire en train de pêcher
  - id: b
    texte: Un navire qui en remorque un autre
  - id: c
    texte: Un navire à propulsion mécanique stoppé, sans erre
  - id: d
    texte: Un navire remorqué, dernier du convoi
reponses:
  - a
  - b
explication: >-
  Un son prolongé suivi de deux sons brefs est le signal de six catégories : le navire qui
  n'est pas maître de sa manœuvre, celui à capacité de manœuvre restreinte, celui handicapé
  par son tirant d'eau, le voilier, le navire qui pêche et celui qui en remorque ou en
  pousse un autre. Il remplace les signaux de la propulsion mécanique libre de ses
  mouvements. Le navire remorqué a son propre signal, avec trois sons brefs et non deux.
sources:
  - texte: RIPAM, règle 35 c)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
