id: signaux-0034
option: cotier
theme: signaux
notion: signaux-portuaires
statut: publie
difficulte: 2
enonce: >-
  Où les signaux de trafic portuaire peuvent-ils aussi être employés, en dehors des ports
  ?
propositions:
  - id: a
    texte: Sur des écluses ou des ponts mobiles
  - id: b
    texte: Sur les marques cardinales
  - id: c
    texte: Sur les bouées de la bande des 300 mètres
reponses:
  - a
explication: >-
  Le système des signaux de trafic portuaire peut également être utilisé sur des écluses
  ou des ponts mobiles, lorsqu'aucune autre règle n'entre en conflit. Il reste distinct
  du balisage maritime, et l'arrêté demande que les deux ne soient jamais superposés.
sources:
  - texte: Arrêté du 30 novembre 2017, annexe V, 6.15
    ref: arrete-2017-11-30
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-09-05'
