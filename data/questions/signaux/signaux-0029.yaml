id: signaux-0029
option: cotier
theme: signaux
notion: signaux-brume
statut: publie
difficulte: 2
enonce: >-
  Dans la brume, tu t'approches d'un navire que tu n'as pas encore vu et tu entends ce
  signal au sifflet. Que t'annonce-t-il ?
visuel:
  fichier: sons/mouillage-abordage.svg
  alt: "Au sifflet, un son bref, un son prolongé et un son bref, dans cet ordre."
  credit: code
propositions:
  - id: a
    texte: Un navire au mouillage te signale sa position et la possibilité d'un abordage.
  - id: b
    texte: Un navire à propulsion mécanique fait route et a de l'erre.
  - id: c
    texte: Un navire échoué demande assistance.
reponses:
  - a
explication: >-
  Le navire au mouillage peut, en plus de sa cloche, émettre un son bref, un son prolongé et
  un son bref pour signaler sa position et la possibilité d'un abordage à un navire qui
  s'approche. Il ressemble à l'accord au dépassement, qui alterne aussi prolongés et brefs,
  mais celui-ci commence par un prolongé, compte quatre sons et ne vaut qu'entre navires en
  vue dans un chenal étroit. La détresse ne se demande pas au sifflet mais par ses propres
  signaux.
sources:
  - texte: RIPAM, règle 35 g)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
