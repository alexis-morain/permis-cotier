id: signaux-0047
option: cotier
theme: signaux
notion: signaux-detresse
statut: publie
difficulte: 2
enonce: >-
  Quel groupe du code Morse, émis par tout système de signalisation, constitue un signal
  de détresse ?
propositions:
  - id: a
    texte: SOS, trois points, trois traits, trois points
  - id: b
    texte: D, un trait deux points
  - id: c
    texte: A, un point un trait
reponses:
  - a
explication: >-
  Le groupe SOS du code Morse, trois points, trois traits, trois points, émis par tout
  système de signalisation, est un signal de détresse de l'annexe IV. Morse D est le code
  d'une balise radar de danger nouveau, Morse A le rythme d'une marque d'eaux saines : ni
  l'un ni l'autre ne parle de détresse.
sources:
  - texte: RIPAM, annexe IV, 1 d)
    ref: decret-77-733
  - texte: Arrêté du 30 novembre 2017, annexe I, 7.2.4
    ref: arrete-2017-11-30
meta:
