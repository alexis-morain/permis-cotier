id: signaux-0047
option: cotier
theme: signaux
notion: signaux-detresse
statut: publie
difficulte: 2
enonce: >-
  Quel groupe du code Morse, émis par tout système de signalisation, constitue un signal
  de détresse ?
propositions:
  - id: a
    texte: SOS, trois points, trois traits, trois points
  - id: b
    texte: NC, un trait un point, puis un trait un point un trait un point
  - id: c
    texte: A, un point un trait
reponses:
  - a
explication: >-
  Le groupe SOS du code Morse, trois points, trois traits, trois points, émis par tout
  système de signalisation, est un signal de détresse de l'annexe IV. NC est aussi un
  signal de détresse, mais du Code international de signaux, par pavillons. Morse A est
  le rythme d'une marque d'eaux saines.
sources:
  - texte: RIPAM, annexe IV, 1 d)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: alexis
  relu_le: '2026-09-05'
