id: signaux-0023
option: cotier
theme: signaux
notion: signaux-avertissement
statut: publie
difficulte: 2
enonce: >-
  Tu manœuvres à l'approche d'un navire que tu vois bien. Il t'adresse ce signal au sifflet.
  Que t'annonce-t-il ?
visuel:
  fichier: sons/avertissement-doute.svg
  alt: "Cinq sons brefs au sifflet, émis en série rapide, les silences plus courts que les sons."
  credit: code
propositions:
  - id: a
    texte: Il ne comprend pas tes intentions, ou doute que tu manœuvres assez pour éviter
      l'abordage.
  - id: b
    texte: Il t'annonce qu'il vient sur bâbord et te demande de garder ta route.
  - id: c
    texte: Il est en détresse et te demande de lui porter assistance sans tarder.
reponses:
  - a
explication: >-
  Cinq sons brefs au moins en série rapide, c'est le signal du doute : celui qui l'émet ne
  comprend pas les intentions de l'autre, ou se demande s'il manœuvre assez pour éviter
  l'abordage. Il peut y ajouter au moins cinq éclats brefs et rapides. Ce n'est ni un signal
  de détresse, ni une manœuvre annoncée : au-delà de trois sons brefs, on n'est plus dans
  les signaux de manœuvre.
sources:
  - texte: RIPAM, règle 34 d)
    ref: decret-77-733
meta:
  cree_le: '2026-09-05'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
