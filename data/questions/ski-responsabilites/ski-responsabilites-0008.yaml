id: ski-responsabilites-0008
option: cotier
theme: ski-responsabilites
notion: conduite-detresse
statut: publie
difficulte: 2
enonce: >-
  Ton bateau embarque de l'eau au large, l'alerte est passée et les secours font route.
  Que fais-tu en attendant ?
propositions:
  - id: a
    texte: Tu fais enfiler les brassières à tout l'équipage
  - id: b
    texte: Tu restes à bord tant que le bateau flotte
  - id: c
    texte: Tu fais monter tout le monde dans l'annexe, remorquée derrière
reponses:
  - a
  - b
explication: >-
  Les brassières s'enfilent quand la situation se dégrade, pas quand elle est perdue : on
  ne s'équipe pas correctement dans l'eau. Et un bateau même à demi rempli reste plus
  flottant, plus visible et plus chaud qu'un équipage à l'eau : on ne monte au radeau ou à
  l'annexe que lorsque le bateau s'enfonce sous soi. Quitter le bord trop tôt est l'erreur
  classique ; se mettre en danger pour du matériel en est une autre, un objet se remplace,
  pas un équipier.
sources:
  - texte: Fiche conduite à tenir, section Le principe qui commande tous les cas
    ref: fiche-conduite-urgence
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
