id: ski-responsabilites-0026
option: cotier
theme: ski-responsabilites
notion: ski-conditions
statut: publie
difficulte: 3
enonce: >-
  Ton neveu veut surveiller le skieur pendant que tu barres. Quel âge minimum doit-il
  avoir ?
propositions:
  - id: a
    texte: 14 ans.
  - id: b
    texte: 18 ans.
  - id: c
    texte: 16 ans.
reponses:
  - c
explication: >-
  L'article 4.1 de l'arrêté du préfet maritime de la Méditerranée fixe pour la personne
  chargée de la surveillance « l'âge minimum de 16 ans requis pour le passage des épreuves
  du permis plaisance français ». Les arrêtés de l'Atlantique et de la Manche disent la
  même chose autrement : « en âge de passer le permis ». La majorité n'est pas exigée,
  mais un enfant de 14 ans ne suffit pas.
sources:
  - texte: Arrêté du préfet maritime de la Méditerranée n° 125/2013, article 4.1
    ref: fiche-ski-nautique
  - texte: Arrêté du préfet maritime de la Manche et de la mer du Nord n° 41/2018, article 3.7
    ref: fiche-ski-nautique
