id: ski-responsabilites-0003
option: cotier
theme: ski-responsabilites
notion: ski-conditions
statut: publie
difficulte: 2
enonce: >-
  Tu pratiques le flyboard, un engin à sustentation hydropropulsé relié à son flotteur.
  Que dois-tu porter en permanence ?
propositions:
  - id: a
    texte: Un casque adapté à la pratique
  - id: b
    texte: Une combinaison et une aide à la flottabilité d'au moins 50 N
  - id: c
    texte: Un moyen de repérage lumineux, en toutes circonstances
  - id: d
    texte: Un harnais relié au flotteur par une sangle non largable
reponses:
  - a
  - b
explication: >-
  L'article 240-2.13, paragraphe 2, impose à l'utilisateur le port permanent d'une
  combinaison, d'une aide à la flottabilité d'au moins 50 N adaptée à sa morphologie et
  d'un casque. Le moyen de repérage lumineux n'est exigé que lorsqu'il navigue seul : le
  piège est d'en faire une obligation permanente. Quant à la liaison à l'engin, le même
  article exige au contraire un moyen de largage rapide, pour que l'utilisateur puisse se
  dégager.
sources:
  - texte: Division 240, article 240-2.13, paragraphe 2
    ref: division-240
