id: ski-responsabilites-0003
option: cotier
theme: ski-responsabilites
notion: ski-conditions
statut: publie
difficulte: 2
enonce: >-
  Tu pratiques le flyboard, un engin à sustentation hydropropulsé relié à son flotteur.
  Que dois-tu porter en permanence ?
propositions:
  - id: a
    texte: Un casque adapté à la pratique
  - id: b
    texte: Une combinaison et une aide à la flottabilité d'au moins 50 N
  - id: c
    texte: Un moyen de repérage lumineux, en toutes circonstances
  - id: d
    texte: Un harnais relié au flotteur par une sangle non largable
reponses:
  - a
  - b
explication: >-
  Le flyboardeur porte en permanence une combinaison, une aide à la flottabilité d'au moins
  50 N adaptée à sa morphologie et un casque. Le moyen de repérage lumineux n'est exigé que
  lorsqu'il évolue seul : le piège est d'en faire une obligation permanente. Quant à la
  liaison à l'engin, elle doit au contraire se larguer rapidement, pour que l'utilisateur
  puisse se dégager.
sources:
  - texte: Division 240, article 240-2.13, paragraphe 2
    ref: division-240
