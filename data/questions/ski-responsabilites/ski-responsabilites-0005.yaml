id: ski-responsabilites-0005
option: cotier
theme: ski-responsabilites
notion: responsabilite-chef-de-bord
statut: publie
difficulte: 2
enonce: >-
  Tu es chef de bord d'un bateau de plaisance. De quoi dois-tu t'assurer avant
  d'appareiller ?
propositions:
  - id: a
    texte: De l'adéquation de ta navigation avec les caractéristiques de ton navire
  - id: b
    texte: De la présence à bord, du bon état et de la validité du matériel de sécurité
  - id: c
    texte: De la validité du permis plaisance de chaque personne embarquée
  - id: d
    texte: De la déclaration de ta sortie auprès du CROSS de la zone
reponses:
  - a
  - b
explication: >-
  Avant d'appareiller, le chef de bord s'assure que sa navigation convient à son navire, et
  que les équipements de sécurité sont à bord, en bon état, valides, adaptés aux personnes
  embarquées et prêts à servir si besoin. Un seul permis suffit à bord, celui de la personne
  qui conduit : rien n'oblige les passagers à en avoir un. Et aucune déclaration de sortie
  n'est exigée du plaisancier.
sources:
  - texte: Division 240, article 240-1.03
    ref: division-240
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
