id: ski-responsabilites-0004
option: cotier
theme: ski-responsabilites
notion: ski-conditions
statut: publie
difficulte: 3
enonce: >-
  Tu ramènes ton skieur au rivage et tu empruntes un chenal traversier. En te dirigeant
  vers la plage, quelle bouée laisses-tu sur bâbord ?
propositions:
  - id: a
    texte: Une bouée cylindrique
  - id: b
    texte: Une bouée conique
reponses:
  - a
explication: >-
  Dans un chenal traversier, en allant vers la plage, les bouées sont cylindriques à bâbord
  et coniques à tribord. C'est le même réflexe que pour l'entrée d'un port, où l'on vient du
  large : cylindrique à bâbord, conique à tribord. La bouée sphérique existe aussi dans le
  chenal, mais elle marque la limite commune de deux chenaux contigus. Ces bouées n'ont pas
  de voyant.
sources:
  - texte: Arrêté du 27 mars 1991, annexe I, paragraphe 2
    ref: arrete-1991-03-27
