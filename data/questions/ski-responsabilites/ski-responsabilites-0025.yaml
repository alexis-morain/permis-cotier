id: ski-responsabilites-0025
option: cotier
theme: ski-responsabilites
notion: ski-conditions
statut: publie
difficulte: 2
enonce: >-
  Tu n'es pas moniteur et tu remorques un skieur. Qui doit se trouver à bord du bateau
  tracteur ?
propositions:
  - id: a
    texte: Une seule personne, le pilote, qui garde un œil sur le skieur.
  - id: b
    texte: Deux personnes, l'une à la conduite, l'autre à la surveillance du skieur.
  - id: c
    texte: Deux personnes, libres de se partager conduite et surveillance comme elles
      l'entendent.
reponses:
  - b
explication: >-
  L'article 4.1 de l'arrêté du préfet maritime de la Méditerranée exige « deux personnes
  » à bord de tout navire remorquant un skieur : « l'une doit se consacrer exclusivement
  à la conduite du navire, l'autre à la surveillance ». Le mot « exclusivement » exclut
  le partage des rôles. Un pilote seul ne peut pas tenir la barre et suivre le skieur
  du regard en même temps.
sources:
  - texte: Arrêté du préfet maritime de la Méditerranée n° 125/2013, article 4.1
    ref: fiche-ski-nautique
