id: ski-responsabilites-0015
option: cotier
theme: ski-responsabilites
notion: vnm-regles
statut: publie
difficulte: 2
enonce: >-
  Que doit porter en permanence le pilote d'un véhicule nautique à moteur, même à moins
  de 300 mètres d'un abri ?
propositions:
  - id: a
    texte: Un équipement individuel de flottabilité
  - id: b
    texte: Un équipement en néoprène d'au moins 2 mm d'épaisseur
  - id: c
    texte: Un casque
  - id: d
    texte: Un harnais et sa longe
reponses:
  - a
  - b
explication: >-
  Quelle que soit la distance d'un abri, le pratiquant d'un VNM porte en permanence un
  EIF, de niveau 50 jusqu'à deux milles et 100 de deux à six milles, et un équipement
  en néoprène d'au moins 2 mm, short, shorty ou combinaison, contre les blessures du jet
  de la turbine en cas de chute. Le casque est celui de l'engin hydropropulsé.
sources:
  - texte: Division 240, article 240-2.12
    ref: division-240
