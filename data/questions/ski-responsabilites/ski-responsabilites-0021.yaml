id: ski-responsabilites-0021
option: cotier
theme: ski-responsabilites
notion: ski-conditions
statut: publie
difficulte: 1
enonce: >-
  Le soleil est couché et ton bateau porte ses feux de route. Peux-tu encore tirer un
  skieur ?
propositions:
  - id: a
    texte: Oui, dès lors que le navire tracteur porte ses feux de navigation.
  - id: b
    texte: Non, le ski nautique se pratique exclusivement de jour.
reponses:
  - b
explication: >-
  L'article 4.1 de l'arrêté du préfet maritime de la Méditerranée impose que le ski nautique
  et les disciplines associées soient pratiqués « exclusivement de jour ». Les arrêtés
  de l'Atlantique et de la Manche disent la même chose. Les feux de route n'y changent
  rien : ils rendent le bateau visible, pas le skieur ni sa remorque.
sources:
  - texte: Arrêté du préfet maritime de la Méditerranée n° 125/2013, article 4.1
    ref: fiche-ski-nautique
  - texte: Arrêté du préfet maritime de l'Atlantique n° 2018/090, article 3-3
    ref: fiche-ski-nautique
