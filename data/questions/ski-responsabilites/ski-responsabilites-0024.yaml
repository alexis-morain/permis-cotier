id: ski-responsabilites-0024
option: cotier
theme: ski-responsabilites
notion: ski-conditions
statut: publie
difficulte: 2
enonce: >-
  Quel signal ton bateau doit-il arborer pendant qu'il tire un skieur ?
propositions:
  - id: a
    texte: Le pavillon A du code international des signaux.
  - id: b
    texte: Un pavillon rouge portant une diagonale blanche.
  - id: c
    texte: Une flamme fluorescente orange de 2 mètres.
reponses:
  - c
explication: >-
  L'article 4.1 de l'arrêté du préfet maritime de la Méditerranée impose au navire tracteur
  « une flamme fluorescente orange de 2 mètres placée à une hauteur suffisante pour assurer
  sa visibilité ». La règle est identique sur l'Atlantique et en Manche. Le pavillon A
  et le pavillon rouge à diagonale blanche signalent des plongeurs, pas un skieur.
sources:
  - texte: Arrêté du préfet maritime de la Méditerranée n° 125/2013, article 4.1
    ref: fiche-ski-nautique
  - texte: Arrêté du préfet maritime de l'Atlantique n° 2018/090, article 3-3
    ref: fiche-ski-nautique
