id: ski-responsabilites-0013
option: cotier
theme: ski-responsabilites
notion: conduite-echouement-panne
statut: publie
difficulte: 2
enonce: >-
  Tu touches un banc de sable et le bateau s'immobilise. Quel est ton premier geste ?
propositions:
  - id: a
    texte: Vérifier l'état de la coque et l'absence de voie d'eau
  - id: b
    texte: Mettre en marche arrière à pleine puissance pour te dégager tout de suite
  - id: c
    texte: Envoyer un équipier à l'eau pour pousser l'étrave
  - id: d
    texte: Attendre la renverse de marée sans rien examiner
reponses:
  - a
explication: >-
  Tant qu'il est posé, le bateau ne coule pas : c'est le moment d'examiner la coque. Se
  déséchouer en force sur une coque percée transforme un échouement en naufrage, et
  remettre le moteur en marche avant d'avoir vérifié l'hélice et la crépine de
  refroidissement risque de les ensabler. Ensuite seulement on regarde la marée : montante
  on attend, on gîte le bateau ou on porte une ancre au large ; descendante, chaque minute
  perdue enfonce davantage et l'alerte devient urgente.
sources:
  - texte: Fiche conduite à tenir, section Échouement
    ref: fiche-conduite-urgence
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-09-04'
