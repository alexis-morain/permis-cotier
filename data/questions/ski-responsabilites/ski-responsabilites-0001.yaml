id: ski-responsabilites-0001
option: cotier
theme: ski-responsabilites
notion: vnm-regles
statut: publie
difficulte: 2
enonce: >-
  Le soleil se couche alors que tu es à un mille de la plage en scooter des mers. Que
  dois-tu faire ?
propositions:
  - id: a
    texte: Tu rentres, la navigation des véhicules nautiques à moteur est exclusivement
      diurne.
  - id: b
    texte: Tu peux continuer à condition d'allumer un feu blanc visible sur tout l'horizon.
  - id: c
    texte: Tu peux continuer tant que tu restes à moins de 2 milles d'un abri.
reponses:
  - a
explication: >-
  La navigation des véhicules nautiques à moteur est exclusivement diurne. Aucun feu et
  aucune distance d'abri ne lèvent cette limite : la nuit venue, le scooter des mers doit
  être rentré. Le piège est de raisonner comme pour un bateau de plaisance, qui peut faire
  route de nuit avec ses feux réglementaires.
sources:
  - texte: Division 240, article 240-2.12
    ref: division-240
