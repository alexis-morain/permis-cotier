id: ski-responsabilites-0028
option: cotier
theme: ski-responsabilites
notion: ski-conditions
statut: publie
difficulte: 3
enonce: >-
  Tu es titulaire du brevet d'État de moniteur de ski nautique. À quelle condition peux-tu
  conduire le tracteur sans surveillant à bord ?
propositions:
  - id: a
    texte: Si tu ne tractes qu'un seul skieur à la fois.
  - id: b
    texte: Si le navire tracteur est équipé d'un rétroviseur.
  - id: c
    texte: Si la remorque dispose d'un système de largage rapide.
reponses:
  - b
explication: >-
  Le moniteur titulaire du brevet d'État peut assurer seul conduite et surveillance, à
  condition que le bateau tracteur soit équipé d'un rétroviseur. Le nombre de skieurs
  n'entre pas en compte. Le largage rapide est une exigence des engins pneumatiques tractés,
  pas de cette dérogation.
sources:
  - texte: Arrêté du préfet maritime de la Méditerranée n° 125/2013, article 4.1
    ref: fiche-ski-nautique
  - texte: Arrêté du préfet maritime de l'Atlantique n° 2018/090, article 3-3.1
    ref: fiche-ski-nautique
