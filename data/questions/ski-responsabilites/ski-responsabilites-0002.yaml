id: ski-responsabilites-0002
option: cotier
theme: ski-responsabilites
notion: vnm-regles
statut: publie
difficulte: 2
enonce: >-
  Tu pilotes un scooter des mers conçu pour embarquer trois personnes. Jusqu'à quelle
  distance d'un abri peux-tu t'éloigner ?
propositions:
  - id: a
    texte: 2 milles
  - id: b
    texte: 6 milles
  - id: c
    texte: 12 milles
  - id: d
    texte: 60 milles
reponses:
  - b
explication: >-
  L'article 240-2.12 fixe deux limites selon la conception du véhicule : 2 milles d'un
  abri pour ceux conçus pour embarquer au maximum une personne, 6 milles pour ceux conçus
  pour en embarquer plus d'une. Le tien est prévu pour trois personnes, la limite est
  donc de 6 milles. Le piège est de retenir la valeur de 2 milles, qui ne vaut que pour
  les monoplaces et qui sert par ailleurs de seuil entre le matériel d'armement basique
  et le matériel côtier.
sources:
  - texte: Division 240, article 240-2.12
    ref: division-240
