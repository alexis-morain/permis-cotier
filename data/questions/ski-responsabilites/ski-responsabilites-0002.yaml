id: ski-responsabilites-0002
option: cotier
theme: ski-responsabilites
notion: vnm-regles
statut: publie
difficulte: 2
enonce: >-
  Tu pilotes un scooter des mers conçu pour embarquer trois personnes. Jusqu'à quelle
  distance d'un abri peux-tu t'éloigner ?
propositions:
  - id: a
    texte: 2 milles
  - id: b
    texte: 6 milles
  - id: c
    texte: 12 milles
reponses:
  - b
explication: >-
  La limite dépend de la conception du véhicule : 2 milles d'un abri s'il est conçu pour une
  seule personne, 6 milles s'il en embarque plus d'une. Le tien en prend trois, donc 6
  milles. Piège : retenir les 2 milles, qui ne valent que pour les monoplaces.
sources:
  - texte: Division 240, article 240-2.12
    ref: division-240
meta:
  cree_le: '2026-09-04'
  genere_par: claude
  relu_par: claude
  relu_le: '2026-11-11'
