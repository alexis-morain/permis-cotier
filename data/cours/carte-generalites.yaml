notion: carte-generalites
duree: 4
accroche: >-
  Tu déplies une carte marine pour la première fois. Des couleurs, des chiffres partout,
  une grosse rose graduée au milieu. Voilà de quoi commencer à la lire.
etapes:
  - titre: La couleur donne la profondeur d’un coup d’œil
    texte: >-
      La carte se lit d’abord à la couleur, avant tout chiffre. Le blanc porte les eaux
      profondes. Le bleu porte les petits fonds, et la teinte s’assombrit à mesure qu’on
      se rapproche de la côte. Le vert est l’estran, la bande qui découvre entre haute et
      basse mer. Le jaune ou le beige est la terre, qui ne découvre jamais.

      Un coup d’œil te donne donc la zone où tu passes sans réfléchir, celle où tu
      regardes les sondes, et celle où tu ne vas pas.
  - titre: Les chiffres non soulignés sont des profondeurs
    texte: >-
      Les chiffres semés sur l’eau sont des sondes, en mètres sur les cartes françaises.
      Elles sont comptées depuis le zéro des cartes, qui est le niveau des plus basses
      mers astronomiques : le plus bas que la marée puisse descendre.

      Une sonde est donc la profondeur minimale à cet endroit. La hauteur de la marée du
      moment vient s’y ajouter. La convention joue dans le sens de la sécurité.

      Un chiffre souligné ne se lit pas comme une sonde : c’est une hauteur qui découvre,
      vue dans la leçon suivante.
  - titre: La rose porte deux nords
    texte: >-
      La rose des vents a deux cercles concentriques. Le cercle extérieur donne les
      directions par rapport au nord vrai, celui du méridien. Le cercle intérieur, décalé,
      donne les directions par rapport au nord magnétique, celui que montre l’aiguille
      aimantée.

      L’écart entre les deux est la déclinaison magnétique.
    visuel: carte/rose-des-vents.svg
    alt: "Deux cercles concentriques gradués tous les dix degrés. Le cercle extérieur porte une flèche de nord verticale ; le cercle intérieur, plus petit, porte sa propre flèche, tournée d’une quinzaine de degrés vers la droite. L’écart est accentué pour la lisibilité."
  - titre: La déclinaison porte une date
    texte: >-
      Au centre de la rose, la carte inscrit la déclinaison avec son sens, son année de
      mesure et sa variation annuelle. Elle bouge lentement d’une année sur l’autre, et
      une rose ancienne demande donc une correction à la date où tu navigues.
  - titre: Une carte à jour fait partie de l’armement
    texte: >-
      Dès la navigation de 2 à moins de 6 milles d’un abri, la ou les cartes marines
      officielles, ou leurs extraits, issus d’un service hydrographique national, font partie du matériel d’armement et
      de sécurité côtier. Elles couvrent les zones fréquentées, sur papier ou sur support
      électronique avec son appareil de lecture, et sont tenues à jour.
piege: >-
  La déclinaison n’est pas une valeur figée qu’on lit une fois pour toutes. Le candidat
  croit souvent que l’année inscrite est celle du dessin de la carte, ou que la
  déclinaison change avec la saison. Elle dérive lentement d’année en année : c’est pour
  cela que la rose donne aussi sa variation annuelle.
retenir:
  - "Blanc profond, bleu peu profond, vert estran, jaune terre."
  - "Une sonde est comptée depuis le zéro des cartes : c’est un minimum, la marée s’y ajoute."
  - "Cercle extérieur, nord vrai. Cercle intérieur, nord magnétique. L’écart est la déclinaison."
  - "La déclinaison bouge : sa date et sa variation annuelle sont inscrites au centre de la rose."
  - "De 2 à moins de 6 milles d’un abri, une carte officielle tenue à jour est obligatoire à bord."
sources:
  - texte: Fiche lecture de carte marine, SHOM ouvrage 1D
    ref: fiche-carte-marine
    fichier: symboles
  - texte: Division 240, article 240-2.04
    ref: division-240
    fichier: article-240-2-04
