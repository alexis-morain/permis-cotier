notion: ski-conditions
duree: 6
accroche: >-
  Ton beau-frère veut faire du ski nautique derrière le bateau. Vous êtes deux à bord, lui
  et toi. Avant même de savoir où le tracter, la question est : qui tient la barre, et qui
  le regarde ?
etapes:
  - titre: Deux personnes à bord, une qui barre, une qui regarde
    texte: >-
      Les règles du ski nautique en mer sont posées par chaque préfet maritime, façade par
      façade. Elles disent la même chose sur l’essentiel. Deux personnes doivent être à bord
      de tout navire qui remorque un ou plusieurs skieurs : l’une se consacre à la conduite
      du navire, l’autre à la surveillance des skieurs.

      La personne qui surveille a au moins 16 ans, l’âge requis pour passer le permis
      plaisance. Un moniteur titulaire du brevet d’État de ski nautique peut, lui, assurer seul
      la conduite et la surveillance, à condition que le bateau ait un rétroviseur.
  - titre: De jour, au-delà des 300 mètres, par le chenal
    texte: >-
      Le ski nautique et les disciplines associées, wakeboard compris, se pratiquent
      exclusivement de jour et au-delà de la bande littorale des 300 mètres. Le départ du
      rivage et le retour se font par un chenal de vitesse, dégagé et libre de tout
      obstacle.

      Sur la façade Atlantique, l’arrêté ajoute une limite au large : à moins de 2 milles
      de la côte.
  - titre: Gilet sur le skieur, flamme orange sur le bateau
    texte: >-
      Le skieur porte un équipement individuel de flottabilité conforme à la réglementation.
      Le navire tracteur arbore une flamme fluorescente orange de 2 mètres, placée assez
      haut pour être vue. Il doit pouvoir embarquer tous les skieurs en plus de son
      équipage.

      Les mêmes règles valent pour une bouée ou un engin pneumatique tracté : couleur vive,
      remorque flottante de couleur vive, et sur le bateau un système de largage rapide de
      la remorque. Le parachute ascensionnel s’y ajoute : hauteur limitée à 50 mètres, et
      jamais à plus de 2 milles de la côte.
  - titre: La bande des 300 mètres et son chenal traversier
    texte: >-
      La limite de la bande littorale des 300 mètres est faite de bouées jaunes sphériques,
      d’au moins 0,80 mètre, mouillées tous les 200 mètres environ et sans voyant. Les zones
      réglementées à l’intérieur sont bornées par des sphères, une zone de baignade par de
      simples sphères de 0,20 mètre reliées par un filin flottant.

      Un chenal traversier est un passage balisé entre le large et le rivage. Ses bouées
      sont cylindriques à bâbord et coniques à tribord, en accédant au rivage. Elles se
      resserrent en approchant : 50 mètres d’intervalle jusqu’à 150 mètres du rivage,
      25 mètres ensuite, 10 mètres à moins de 50 mètres du bord.
  - titre: Le pictogramme dit permis ou interdit
    texte: >-
      Une bouée peut porter un pictogramme qui annonce la réglementation de la zone. Deux
      formes seulement, et la couleur de fond suffit à les séparer.
    liste:
      - "Figure blanche sur fond bleu : l’activité est autorisée"
      - "Figure noire sur fond blanc bordé et barré de rouge : l’activité est interdite"
  - titre: Le flyboard navigue de jour, à 2 milles, en zone dégagée
    texte: >-
      L’engin à sustentation hydropropulsé effectue une navigation diurne, à une distance
      d’un abri qui n’excède pas 2 milles, dans des zones dégagées de tout obstacle
      dangereux pour l’utilisateur.

      Son utilisateur est titulaire du permis plaisance option côtière, ou il est
      accompagné par un titulaire de ce permis. L’engin et son utilisateur restent soumis
      au RIPAM : veille visuelle et auditive permanente, et obligation de rester maître de
      sa manœuvre.
  - titre: Combinaison, flottabilité, casque en permanence
    texte: >-
      L’utilisateur porte en permanence une combinaison, une aide à la flottabilité d’au
      moins 50 N adaptée à sa morphologie, et un casque adapté à la pratique. Le moyen de
      repérage lumineux, étanche et d’au moins 6 heures d’autonomie, n’est exigé que
      lorsqu’il navigue seul.

      L’engin porte un moyen de largage rapide, pour que l’utilisateur ne reste pas
      solidaire de lui. Le flotteur s’arrête à distance et dès que la liaison se rompt. Et
      pendant l’utilisation, l’élément support arbore le pavillon « Alpha », d’au moins
      0,50 mètre de guindant, visible sur tout l’horizon.
piege: >-
  Tracter un skieur en étant seul à bord, parce que le rétroviseur permet de le voir. Le
  rétroviseur ne dispense de l’observateur que le moniteur titulaire du brevet d’État. Pour
  toi, il faut une deuxième personne, d’au moins 16 ans, qui ne fait que surveiller.
  Deuxième piège, le chenal traversier : il se lit en accédant au rivage, cylindre à
  bâbord, à l’inverse du réflexe pris sur un chenal de port.
retenir:
  - "Ski nautique : deux personnes à bord, une qui conduit, une de 16 ans au moins qui surveille."
  - "De jour, au-delà des 300 mètres, départ et retour par un chenal. Gilet sur le skieur, flamme orange de 2 mètres sur le bateau."
  - "Chenal traversier : cylindrique à bâbord, conique à tribord, en accédant au rivage."
  - "Pictogramme bleu à figure blanche : autorisé. Figure noire barrée de rouge : interdit."
  - "Engin hydropropulsé : de jour, 2 milles d’un abri, permis côtier, combinaison, 50 N et casque, pavillon « Alpha »."
