notion: vhf-alphabet
duree: 4
accroche: >-
  Le CROSS te demande d’épeler le nom de ton bateau. Le vent couvre ta voix, la
  liaison grésille, et un B se confond avec un P. L’alphabet phonétique international
  existe pour que ce doute n’arrive pas.
etapes:
  - titre: Un mot par lettre, et un seul
    texte: >-
      Chaque lettre a son mot, fixé par le Règlement des radiocommunications. Ces mots
      sont les mêmes dans toutes les langues et pour toutes les stations du monde :
      c’est ce qui les rend compréhensibles quand la voix passe mal.

      On épelle ainsi le nom du navire, son indicatif et son MMSI dès qu’un doute est
      possible.
  - titre: De A à G
    texte: >-
      Les sept premières lettres. Alfa s’écrit avec un f, pas avec ph.
    liste:
      - "A : Alfa"
      - "B : Bravo"
      - "C : Charlie"
      - "D : Delta"
      - "E : Echo"
      - "F : Foxtrot"
      - "G : Golf"
  - titre: De H à N
    texte: >-
      Juliett prend deux t. November est le mot du N.
    liste:
      - "H : Hotel"
      - "I : India"
      - "J : Juliett"
      - "K : Kilo"
      - "L : Lima"
      - "M : Mike"
      - "N : November"
  - titre: De O à U
    texte: >-
      Oscar et Romeo servent tous les jours, sur les noms de bateaux comme sur les
      indicatifs.
    liste:
      - "O : Oscar"
      - "P : Papa"
      - "Q : Quebec"
      - "R : Romeo"
      - "S : Sierra"
      - "T : Tango"
      - "U : Uniform"
  - titre: De V à Z
    texte: >-
      Les cinq dernières, celles qu’on oublie le plus souvent à l’examen.
    liste:
      - "V : Victor"
      - "W : Whiskey"
      - "X : X-ray"
      - "Y : Yankee"
      - "Z : Zulu"
  - titre: Épeler ORQUE
    texte: >-
      Un exemple complet vaut mieux qu’une règle. ORQUE se dit Oscar Romeo Quebec
      Uniform Echo. MISTRAL se dit Mike India Sierra Tango Romeo Alfa Lima.
piege: >-
  Les questions glissent un mot inventé au milieu de mots justes : Nectar pour le N,
  Santiago pour le S, Xénon pour le X, Zèbre pour le Z. Un mot qui commence par la
  bonne lettre et qui sonne bien n’est pas le bon. L’autre erreur est de réciter les
  prénoms français, Anatole et Berthe : c’est l’ancien alphabet téléphonique, que
  personne ne comprend à l’étranger.
retenir:
  - Alfa Bravo Charlie Delta Echo Foxtrot Golf.
  - Hotel India Juliett Kilo Lima Mike November.
  - Oscar Papa Quebec Romeo Sierra Tango Uniform.
  - Victor Whiskey X-ray Yankee Zulu.
  - Un mot par lettre, le même pour toutes les langues.
sources:
  - texte: "Fiche VHF : voies, procédures d’appel et SMDSM"
    ref: fiche-vhf
    fichier: procedures
