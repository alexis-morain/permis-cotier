notion: balisage-danger-nouveau
duree: 2
accroche: >-
  Une épave a coulé la semaine dernière. Elle n’est sur aucune carte. Comment la mer te
  prévient-elle ?
etapes:
  - titre: Un danger que les cartes ne connaissent pas encore
    texte: >-
      Un danger récemment découvert, une épave par exemple, n’est pas encore porté sur
      les documents nautiques. On le balise comme on baliserait n’importe quel danger, par
      une marque latérale, cardinale ou de danger isolé, ou bien par la bouée d’épave en
      cas d’urgence, celle à bandes bleues et jaunes.
  - titre: La marque de danger nouveau
    texte: >-
      La bouée d’épave en cas d’urgence porte un corps à bandes verticales bleues et
      jaunes, un voyant en croix jaune aux branches droites, verticale et horizontale, et
      un feu bleu et jaune alternés. Elle reste en place jusqu’à ce que le danger soit
      suffisamment connu. Et si le service responsable juge le danger particulièrement
      grave, il double une des marques, le double étant alors en tous points identique à
      celle qu’il accompagne.
    visuel: balisage/danger-nouveau.svg
    alt: "Une bouée à bandes verticales bleues et jaunes, surmontée d’un voyant en croix jaune aux branches droites."
  - titre: Ce qu’elle te demande
    texte: >-
      Comme le danger n’est pas cartographié, tu ne sais ni sa taille ni sa forme. La
      marque reste en place jusqu’à ce que l’information sur ce danger soit suffisamment
      diffusée, ou que le danger ait été résolu.
piege: >-
  Bleu et jaune, ce n’est pas une marque spéciale délavée. La marque spéciale est toute
  jaune et sa croix est posée en X, quand celle de la bouée d’épave a les branches droites.
  Dès que tu vois du bleu, c’est un danger, et un danger que personne ne connaît bien.
retenir:
  - Un danger nouveau se balise comme un danger ordinaire, ou par la bouée bleue et jaune.
  - Bandes verticales bleues et jaunes, croix jaune droite, feu bleu et jaune alternés.
  - "On passe loin : le danger n’est pas sur la carte."
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 7.1
    ref: arrete-2017-11-30
    fichier: article-annexe-i
