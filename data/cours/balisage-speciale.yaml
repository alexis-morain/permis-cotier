notion: balisage-speciale
duree: 2
accroche: >-
  Une bouée toute jaune, avec une croix sur la tête. Elle ne te protège d’aucun rocher,
  mais elle te dit qu’ici, quelque chose se passe.
etapes:
  - titre: Pas un danger, une zone
    texte: >-
      La marque spéciale ne signale pas un danger pour la navigation. Elle délimite une
      zone ou une installation : zone de mouillage, câble ou conduite sous-marine, zone
      d’exercices, zone de dépôt, installation de loisirs.
    visuel: balisage/speciale.svg
    alt: "Une bouée à corps jaune, surmontée d’un voyant en croix jaune en forme de X."
  - titre: La reconnaître
    texte: >-
      Le jaune est sa seule couleur. Une marque jaune et noire est une cardinale, une
      marque jaune et bleue est un danger nouveau.
    liste:
      - "Corps : jaune"
      - "Forme : au choix, sans confusion possible avec une marque de navigation"
      - "Voyant : une croix jaune en forme de X"
      - "Feu : jaune, à un rythme différent de ceux des feux blancs"
  - titre: Ce qu’elle demande
    texte: >-
      Elle ne dit pas de quel côté passer. Pour savoir quoi faire, il faut savoir ce
      qu’elle délimite : on ne mouille pas sur un câble, on ne traverse pas une zone
      d’exercices militaires ni un champ d’éoliennes en mer. C’est la carte ou le document
      nautique qui le dit.
  - titre: Ce qu’elle peut délimiter
    texte: >-
      La liste de l’arrêté est plus longue que les câbles et les mouillages auxquels on
      pense d’abord. Une marque spéciale peut aussi baliser une station d’acquisition de
      données océaniques, un dispositif de séparation du trafic là où le balisage
      classique prêterait à confusion, une zone de dépôt, une zone d’exercices
      militaires, une installation d’énergie marine renouvelable ou une zone de cultures
      marines.
piege: >-
  La bouée d’épave en cas d’urgence porte elle aussi une croix jaune, mais aux branches
  droites, verticale et horizontale, quand celle de la marque spéciale est posée en X. Et
  son corps est à bandes bleues et jaunes, là où la marque spéciale est toute jaune.
retenir:
  - "Jaune, croix jaune, feu jaune : marque spéciale."
  - Elle délimite une zone ou une installation, pas un danger.
  - "Elle n’indique pas de côté : la carte dit quoi faire."
sources:
  - texte: Arrêté du 30 novembre 2017, annexe I, 6.1
    ref: arrete-2017-11-30
    fichier: article-annexe-i
  - texte: Arrêté du 30 novembre 2017, annexe I, 6.2
    ref: arrete-2017-11-30
    fichier: article-annexe-i
  - texte: Arrêté du 30 novembre 2017, annexe I, 7.3
    ref: arrete-2017-11-30
    fichier: article-annexe-i
  - texte: Balisage AISM, région A, marques spéciales
    ref: aism-mbs
    fichier: region-a
