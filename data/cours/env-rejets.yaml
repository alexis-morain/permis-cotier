notion: env-rejets
duree: 4
accroche: >-
  Tu es au mouillage, un bidon d’huile de vidange à moitié plein au fond du coffre. La
  mer est grande, personne ne regarde. C’est exactement la situation que le code de
  l’environnement a prévue.
etapes:
  - titre: Rien de nuisible ne part à la mer
    texte: >-
      Jeter, déverser ou laisser écouler, directement ou indirectement, en mer ou dans
      la partie salée des cours d’eau, des substances ou organismes nuisibles pour la
      conservation ou la reproduction des mammifères marins, poissons, crustacés,
      coquillages, mollusques ou végétaux est puni de 100 000 euros d’amende. La même
      peine vise ce qui rend ces animaux impropres à la consommation.

      L’amende peut être portée jusqu’au double de l’avantage tiré de l’infraction.
  - titre: Aucune distance ne rend un rejet permis
    texte: >-
      Le texte ne pose ni seuil de distance, ni seuil de quantité. Un litre d’huile à
      6 milles de la côte tombe sous la même règle qu’un litre au ponton. « Directement
      ou indirectement » couvre aussi ce qui rejoint la mer par un caniveau ou par une
      cale de mise à l’eau.

      La conséquence pratique tient en une phrase : ce qui n’est pas rejetable en mer
      redescend à terre, dans les bacs que le port met à disposition.
  - titre: Le sauvetage passe avant le milieu
    texte: >-
      Un rejet effectué par un navire à des fins de sécurité, de sauvetage ou de lutte
      contre la pollution n’est pas punissable, dès lors qu’il remplit les conditions
      posées par les annexes de la convention MARPOL.

      Un rejet qui se produit au-delà des eaux territoriales et qui provient d’une avarie
      survenue au navire ou à son équipement n’est pas non plus considéré comme une
      infraction, aux mêmes conditions. L’avarie n’est pas le rejet volontaire.
  - titre: Les hydrocarbures des gros navires relèvent d’une autre échelle
    texte: >-
      Les peines de dix ans d’emprisonnement et 1 000 000 euros d’amende visent les
      capitaines de navires-citernes d’une jauge brute d’au moins 150 tonneaux et les
      autres navires d’au moins 500 tonneaux, pour les rejets d’hydrocarbures interdits
      par la convention MARPOL.

      Ton bateau de plaisance n’entre dans aucune de ces deux catégories. Ce qui te
      concerne, c’est l’interdiction générale de rejeter des substances nuisibles.
piege: >-
  Le piège le plus courant est le seuil de distance : beaucoup de candidats répondent
  qu’un rejet devient permis au-delà de 3 milles ou de 12 milles. Le texte qui s’applique
  au plaisancier n’en contient aucun. La seule porte de sortie est le rejet fait pour la
  sécurité, le sauvetage ou la lutte contre la pollution.
retenir:
  - "Rejeter en mer une substance nuisible à la faune ou à la flore marines : 100 000 euros d’amende."
  - Aucune distance à la côte ne rend un rejet permis.
  - "Deux exceptions seulement : la sécurité et le sauvetage, et l’avarie au-delà des eaux territoriales."
  - Ce qui monte à bord et ne se rejette pas en redescend, au bac du port.
sources:
