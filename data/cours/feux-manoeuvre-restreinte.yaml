notion: feux-manoeuvre-restreinte
duree: 5
accroche: >-
  De nuit, deux ou trois feux rouges empilés à la verticale, tout en haut d’un navire. Ces
  feux-là ne disent pas où il va : ils disent qu’il ne peut pas t’éviter.
etapes:
  - titre: Deux feux rouges, il ne se gouverne plus
    texte: >-
      Un navire qui n’est pas maître de sa manœuvre montre, à l’endroit le plus visible,
      deux feux rouges superposés visibles sur tout l’horizon. Une avarie de barre, une
      panne de machine : il subit sa route.

      S’il a de l’erre, c’est-à-dire s’il avance encore sur son aire, il ajoute ses feux
      de côté et son feu de poupe. Arrêté, il ne montre que les deux rouges.
    visuel: feux/non-maitre-de-sa-manoeuvre.svg
    alt: "Deux feux rouges superposés sur fond de nuit, visibles sur tout l’horizon."
  - titre: Rouge, blanc, rouge, sa manœuvre est contrainte
    texte: >-
      Un navire à capacité de manœuvre restreinte montre trois feux superposés visibles
      sur tout l’horizon : rouge en haut, blanc au milieu, rouge en bas. Il peut manœuvrer,
      mais son travail l’en empêche : dragage, pose de câble, ravitaillement, travaux
      sous-marins.

      Avec de l’erre, il ajoute son feu de tête de mât, ses feux de côté et son feu de
      poupe. Au mouillage, il ajoute les feux ou marques du mouillage.
    visuel: feux/capacite-de-manoeuvre-restreinte.svg
    alt: "Trois feux superposés sur fond de nuit, rouge en haut, blanc au milieu, rouge en bas."
  - titre: De jour, les mêmes signaux en noir
    texte: >-
      Les marques reprennent la même distinction : deux formes pour celui qui ne se
      gouverne plus, trois pour celui qui travaille.
    liste:
      - "Non maître de sa manœuvre : deux boules superposées"
      - "Capacité de manœuvre restreinte : une boule, un bicône, une boule"
  - titre: Dans les deux cas, tu t’écartes
    texte: >-
      Un navire à propulsion mécanique qui fait route s’écarte de la route d’un navire
      qui n’est pas maître de sa manœuvre et de celle d’un navire à capacité de manœuvre
      restreinte. Un navire à voile s’en écarte aussi.

      Ces feux ne se discutent pas : celui qui les montre ne peut pas faire le travail
      à ta place.
  - titre: La drague te dit de quel côté passer
    texte: >-
      Un navire à capacité de manœuvre restreinte en train de draguer ou de travailler
      sous l’eau ajoute, quand une obstruction existe, deux feux rouges ou deux boules
      du côté de l’obstruction, et deux feux verts ou deux bicônes du côté où l’on peut
      passer.

      Rouge du côté fermé, vert du côté ouvert : tu passes du côté vert.
  - titre: La plongée ne dispense de rien
    texte: >-
      Les navires de moins de 12 mètres ne sont pas tenus de montrer les feux et marques
      de cette règle, sauf s’ils participent à des opérations de plongée.

      Un support de plongée trop petit pour porter toutes les marques montre les trois
      feux rouge, blanc, rouge et une reproduction rigide du pavillon « A » du Code
      international de signaux, d’au moins 1 mètre de hauteur, visible sur tout l’horizon.
      Rigide, pas un pavillon en tissu qui retombe le long du mât.
  - titre: Ce n’est pas un appel au secours
    texte: >-
      Le règlement le précise : les signaux de la règle 27 ne sont pas des signaux de
      détresse. Le navire demande qu’on s’écarte de lui, pas qu’on vienne à son bord.
      Les signaux de détresse figurent à l’annexe IV.

      Un cas à part : trois feux verts ou trois boules, un près de la tête du mât de
      misaine et un à chaque bout de la vergue, signalent un déminage. On ne s’approche
      pas à moins de 1 000 mètres.
piege: >-
  Deux feux rouges superposés se retrouvent aussi sur un navire échoué. La différence
  tient au feu blanc : l’échoué montre en plus son feu de mouillage, le navire non maître
  de sa manœuvre ne montre que les deux rouges. Et le blanc du milieu change tout : trois
  feux dont le milieu est blanc, c’est la manœuvre restreinte ; trois rouges, c’est le
  tirant d’eau.
retenir:
  - "Deux feux rouges superposés, deux boules : pas maître de sa manœuvre."
  - "Rouge, blanc, rouge, et boule, bicône, boule : capacité de manœuvre restreinte."
  - À moteur comme à la voile, tu t’écartes des deux.
  - "Drague : tu passes du côté des deux feux verts."
  - "Moins de 12 mètres dispensé, sauf plongée : pavillon « A » rigide de 1 mètre."
sources:
