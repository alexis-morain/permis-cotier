notion: vhf-emport
duree: 5
accroche: >-
  Tu prépares ta sortie et tu te demandes si la VHF est obligatoire. La réponse ne
  dépend ni de la taille du bateau ni de son moteur : elle dépend de la distance à
  laquelle tu comptes t’éloigner d’un abri.
etapes:
  - titre: La distance d’un abri commande l’armement
    texte: >-
      La division 240 range le matériel de sécurité en quatre listes, et chaque liste
      reprend l’essentiel de la précédente en y ajoutant. Tu choisis la liste d’après la distance
      maximale d’un abri que ta navigation atteint.
    liste:
      - "Basique : moins de 2 milles d’un abri"
      - "Côtier : de 2 à moins de 6 milles"
      - "Semi-hauturier : de 6 à moins de 60 milles"
      - "Hauturier : 60 milles et plus"
  - titre: Jusqu’à 6 milles, aucune VHF n’est imposée
    texte: >-
      La liste basique et la liste côtière ne comportent pas de station VHF. À 4 milles
      d’un abri, sur ton propre bateau, tu n’es donc pas en faute si tu n’en as pas.

      Le texte ne l’impose pas, la mer ne s’en soucie pas : la VHF est le seul moyen
      d’être entendu à la fois du CROSS et des navires autour de toi.
  - titre: À 6 milles, la VHF fixe devient obligatoire
    texte: >-
      Le matériel semi-hauturier, exigé de 6 à moins de 60 milles d’un abri, comprend
      une installation radioélectrique VHF fixe. Fixe, pas portative : une portative de
      six watts ne satisfait pas cette exigence.
  - titre: À 60 milles, une portative et une balise en plus
    texte: >-
      Le matériel hauturier reprend le semi-hauturier et y ajoute une radiobalise de
      localisation des sinistres et un émetteur-récepteur VHF portatif et étanche.

      Le texte recommande un dispositif de communication par satellite, sans l’imposer.
  - titre: Un bateau de location en emporte une dès 2 milles
    texte: >-
      Un navire proposé à la location, à moteur de plus de 4,5 kW ou voilier de masse
      lège supérieure à 250 kg, embarque un émetteur-récepteur VHF dès qu’il navigue à plus de 2 milles
      d’un abri, avec un moyen de positionnement électronique et un document
      d’instructions. La location abaisse le seuil.
  - titre: Le chef de bord répond de sa station
    texte: >-
      Le chef de bord s’assure que les installations radioélectriques présentent des
      caractéristiques suffisantes pour assurer le trafic de détresse dans les zones de
      navigation du navire. La conformité du matériel ne suffit pas : il faut qu’il
      porte là où tu vas.
piege: >-
  Beaucoup répondent « oui, dès 2 milles » à la question de l’emport, en confondant le
  seuil de l’armement côtier avec celui de la VHF. Le seuil de la VHF est à 6 milles.
  Seul un bateau loué en exige une dès 2 milles.
retenir:
  - "Sur ton propre bateau, à moins de 6 milles d’un abri : aucune VHF imposée."
  - "De 6 à moins de 60 milles : une VHF fixe."
  - "60 milles et plus : la fixe, plus une portative étanche et une radiobalise de localisation des sinistres."
  - "En location, une VHF dès 2 milles d’un abri."
  - Le chef de bord répond de l’adéquation de sa station à sa zone.
