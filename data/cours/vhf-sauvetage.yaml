notion: vhf-sauvetage
duree: 4
accroche: >-
  Tu appelles à l’aide sur le canal 16. Qui décroche à l’autre bout, et qui décide
  d’envoyer un hélicoptère, une vedette ou le bateau qui passe à deux milles de toi ?
etapes:
  - titre: Le CROSS reçoit l’alerte et coordonne
    texte: >-
      En France, les CROSS, centres régionaux opérationnels de surveillance et de
      sauvetage, reçoivent l’alerte et coordonnent les moyens engagés. Chacun couvre une
      zone.

      Ils veillent le canal 16 en permanence. C’est pour cela que le 16 se garde libre :
      c’est la porte d’entrée du secours en mer.
  - titre: Le 196 depuis un téléphone
    texte: >-
      Depuis un téléphone, le 196 est le numéro d’urgence maritime unique : il aboutit
      directement au CROSS. Le 112 fonctionne aussi, mais il fait passer par un
      intermédiaire.

      Le téléphone a ses limites : il dépend de la couverture du réseau, et il ne joint
      que celui que tu appelles.
  - titre: La VHF est entendue de tout le monde
    texte: >-
      Un appel VHF est reçu par le CROSS et par tous les navires à portée. Ceux-là sont
      souvent les plus proches et les plus rapides à intervenir : le premier secours,
      c’est fréquemment le bateau voisin.

      Le programme de l’examen le demande explicitement : présenter les limites du
      téléphone portable, présenter l’intérêt d’utiliser une VHF, savoir passer un appel
      de détresse, d’urgence ou de sécurité.
  - titre: Le canal 6 pour les opérations
    texte: >-
      Une fois l’alerte reçue et les moyens engagés, le canal 6 est la voie de sécurité :
      il sert à la coordination des opérations de recherche et de sauvetage entre navires
      et aéronefs.

      Le navire en détresse, lui, garde le CROSS comme interlocuteur et suit ses
      instructions.
piege: >-
  Appeler la capitainerie du port le plus proche, ou sortir le téléphone en premier. Les
  capitaineries tiennent les voies portuaires, 9, 12, 14, pas le sauvetage. Et un appel
  téléphonique, même reçu, n’avertit aucun des bateaux qui t’entourent.
retenir:
  - Le CROSS reçoit l’alerte, coordonne les moyens et veille le canal 16 en permanence.
  - "Depuis un téléphone : le 196, numéro d’urgence maritime unique."
  - La VHF est entendue du CROSS et de tous les navires à portée, le téléphone non.
  - Le canal 6 sert à la coordination des opérations de recherche et de sauvetage.
sources:
