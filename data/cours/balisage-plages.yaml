notion: balisage-plages
duree: 3
accroche: >-
  Août, une plage pleine. Entre les baigneurs et toi, une ligne de bouées jaunes. Tu veux
  ramener ton bateau à la plage : par où, et à quelle vitesse ?
etapes:
  - titre: La bande des 300 mètres
    texte: >-
      Une bande littorale de 300 mètres longe la côte, et la vitesse y est limitée à
      5 nœuds pour tout le monde. Sa limite au large est marquée par des bouées jaunes
      sphériques.
  - titre: Le chenal traversier
    texte: >-
      Pour rejoindre la plage sans traverser la zone de baignade, on emprunte un chenal
      traversier, balisé de jaune lui aussi : bouées cylindriques d’un côté, coniques de
      l’autre.

      Le sens de lecture est celui de l’arrivée à la plage. En accédant au rivage, les
      cylindres sont à bâbord et les cônes à tribord.
  - titre: Dans le chenal, on reste lent
    texte: >-
      Le chenal traversier est dans la bande des 300 mètres : la limite de 5 nœuds s’y
      applique aussi. Il est réservé aux engins de plage et aux véhicules nautiques à
      moteur.
  - titre: Formes et espacements des bouées
    texte: >-
      La limite des 300 mètres est marquée par des bouées sphériques d’au moins 0,80 mètre,
      mouillées tous les 200 mètres environ. Là où deux chenaux se touchent, la limite
      latérale commune est elle aussi tenue par des bouées sphériques.

      Dans un chenal traversier, les deux bouées les plus au large mesurent 0,80 mètre, les
      suivantes de 0,40 à 0,60 mètre, et elles se resserrent à mesure qu’on approche du
      rivage.
    liste:
      - "Entre la ligne des 300 mètres et 150 mètres du rivage : une bouée tous les 50 mètres."
      - "Entre 150 et 50 mètres du rivage : une bouée tous les 25 mètres."
      - "À moins de 50 mètres du rivage : une bouée tous les 10 mètres."
      - "Zones réglementées dans la bande des 300 mètres : sphères d’au moins 0,40 mètre."
      - "Zones de baignade : sphères de 0,20 mètre possibles, sur un filin flottant, tous les 5 à 10 mètres."
piege: >-
  Le chenal traversier se lit en accédant au rivage, pas en venant du large comme un
  chenal de port. Cylindre à bâbord en allant vers la plage, donc à tribord quand tu
  ressors vers le large.
retenir:
  - "Bande des 300 mètres : bouées jaunes sphériques, vitesse 5 nœuds."
  - "Chenal traversier : bouées jaunes, cylindres à bâbord et cônes à tribord en accédant au rivage."
  - Le chenal traversier est réservé aux engins de plage et aux véhicules nautiques à moteur.
sources:
