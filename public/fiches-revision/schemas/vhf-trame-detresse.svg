<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 332" width="400" height="332" role="img" font-family="Helvetica, Arial, sans-serif"><rect width="400" height="332" fill="#ffffff" /><text x="200.0" y="22.0" font-size="15" font-weight="700" text-anchor="middle" fill="#37352f">Sur le canal 16, toujours dans cet ordre</text><rect x="0" y="36" width="400" height="30" fill="#e9e9e7" /><line x1="0" y1="66" x2="400" y2="66" stroke="#c9c8c3" stroke-width="1" /><circle cx="24" cy="51.0" r="12" fill="#37352f" /><text x="24.0" y="56.0" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">1</text><text x="48.0" y="56.0" font-size="14" font-weight="700" text-anchor="start" fill="#37352f">MAYDAY, MAYDAY, MAYDAY</text><rect x="0" y="66" width="400" height="46" fill="#ffffff" /><line x1="0" y1="112" x2="400" y2="112" stroke="#c9c8c3" stroke-width="1" /><circle cx="24" cy="89.0" r="12" fill="#37352f" /><text x="24.0" y="94.0" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">2</text><text x="48.0" y="85.0" font-size="14" font-weight="400" text-anchor="start" fill="#37352f">ICI + le nom du navire trois fois,</text><text x="48.0" y="103.0" font-size="14" font-weight="400" text-anchor="start" fill="#37352f">son MMSI ou son indicatif</text><rect x="0" y="112" width="400" height="30" fill="#e9e9e7" /><line x1="0" y1="142" x2="400" y2="142" stroke="#c9c8c3" stroke-width="1" /><circle cx="24" cy="127.0" r="12" fill="#37352f" /><text x="24.0" y="132.0" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">3</text><text x="48.0" y="132.0" font-size="14" font-weight="700" text-anchor="start" fill="#37352f">MAYDAY + le nom du navire une fois</text><rect x="0" y="142" width="400" height="46" fill="#ffffff" /><line x1="0" y1="188" x2="400" y2="188" stroke="#c9c8c3" stroke-width="1" /><circle cx="24" cy="165.0" r="12" fill="#37352f" /><text x="24.0" y="170.0" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">4</text><text x="48.0" y="161.0" font-size="14" font-weight="400" text-anchor="start" fill="#37352f">La position : latitude et longitude,</text><text x="48.0" y="179.0" font-size="14" font-weight="400" text-anchor="start" fill="#37352f">ou relèvement et distance d’un point connu</text><rect x="0" y="188" width="400" height="30" fill="#e9e9e7" /><line x1="0" y1="218" x2="400" y2="218" stroke="#c9c8c3" stroke-width="1" /><circle cx="24" cy="203.0" r="12" fill="#37352f" /><text x="24.0" y="208.0" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">5</text><text x="48.0" y="208.0" font-size="14" font-weight="400" text-anchor="start" fill="#37352f">La nature de la détresse</text><rect x="0" y="218" width="400" height="30" fill="#ffffff" /><line x1="0" y1="248" x2="400" y2="248" stroke="#c9c8c3" stroke-width="1" /><circle cx="24" cy="233.0" r="12" fill="#37352f" /><text x="24.0" y="238.0" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">6</text><text x="48.0" y="238.0" font-size="14" font-weight="400" text-anchor="start" fill="#37352f">L’assistance demandée</text><rect x="0" y="248" width="400" height="46" fill="#e9e9e7" /><line x1="0" y1="294" x2="400" y2="294" stroke="#c9c8c3" stroke-width="1" /><circle cx="24" cy="271.0" r="12" fill="#37352f" /><text x="24.0" y="276.0" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">7</text><text x="48.0" y="267.0" font-size="14" font-weight="400" text-anchor="start" fill="#37352f">Le nombre de personnes à bord,</text><text x="48.0" y="285.0" font-size="14" font-weight="400" text-anchor="start" fill="#37352f">tout autre renseignement utile</text><rect x="0" y="294" width="400" height="30" fill="#ffffff" /><line x1="0" y1="324" x2="400" y2="324" stroke="#c9c8c3" stroke-width="1" /><circle cx="24" cy="309.0" r="12" fill="#37352f" /><text x="24.0" y="314.0" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">8</text><text x="48.0" y="314.0" font-size="14" font-weight="700" text-anchor="start" fill="#37352f">À VOUS</text></svg>
