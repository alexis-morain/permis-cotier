<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 276" width="560" height="276" role="img" font-family="Helvetica, Arial, sans-serif"><rect width="560" height="276" fill="#e4eef5" /><text x="280.0" y="26.0" font-size="16" font-weight="700" text-anchor="middle" fill="#37352f">Le moteur décide, pas la longueur ni la distance</text><rect x="20" y="44" width="250" height="70" rx="6" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5" /><text x="145.0" y="74.0" font-size="17" font-weight="700" text-anchor="middle" fill="#37352f">4,5 kW ou moins</text><text x="145.0" y="98.0" font-size="15" font-weight="400" text-anchor="middle" fill="#37352f">aucun titre demandé</text><rect x="290" y="44" width="250" height="70" rx="6" fill="#ffffff" stroke="#37352f" stroke-width="2.5" /><text x="415.0" y="74.0" font-size="17" font-weight="700" text-anchor="middle" fill="#37352f">Plus de 4,5 kW</text><text x="415.0" y="98.0" font-size="15" font-weight="400" text-anchor="middle" fill="#37352f">permis exigé</text><text x="280.0" y="138.0" font-size="15" font-weight="400" text-anchor="middle" fill="#6b6a65">4,5 kW, soit 6,1 chevaux</text><text x="280.0" y="168.0" font-size="16" font-weight="700" text-anchor="middle" fill="#37352f">Le voilier échappe au seuil en mer seulement</text><rect x="20" y="182" width="250" height="76" rx="6" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5" /><text x="145.0" y="204.0" font-size="15" font-weight="700" text-anchor="middle" fill="#37352f">En mer</text><text x="145.0" y="224.0" font-size="14" font-weight="400" text-anchor="middle" fill="#37352f">voilier sans permis, même avec</text><text x="145.0" y="244.0" font-size="14" font-weight="400" text-anchor="middle" fill="#37352f">un moteur auxiliaire</text><rect x="290" y="182" width="250" height="76" rx="6" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5" /><text x="415.0" y="204.0" font-size="15" font-weight="700" text-anchor="middle" fill="#37352f">Rivières et canaux</text><text x="415.0" y="224.0" font-size="14" font-weight="400" text-anchor="middle" fill="#37352f">voilier, moteur de plus de 4,5 kW :</text><text x="415.0" y="244.0" font-size="14" font-weight="400" text-anchor="middle" fill="#37352f">titre eaux intérieures</text></svg>
