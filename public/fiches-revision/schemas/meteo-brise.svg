<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="560" height="250" role="img" font-family="Helvetica, Arial, sans-serif"><rect width="560" height="250" fill="#ffffff" /><rect x="0" y="150" width="280" height="100" fill="#e4eef5" /><rect x="280" y="150" width="280" height="100" fill="#e9e9e7" stroke="#a8a7a2" stroke-width="1.5" /><line x1="0" y1="150" x2="280" y2="150" stroke="#8fb0c4" stroke-width="2.5" /><text x="280.0" y="26.0" font-size="15" font-weight="700" text-anchor="middle" fill="#37352f">Le jour, la terre chauffe plus vite que la mer</text><text x="140.0" y="232.0" font-size="16" font-weight="700" text-anchor="middle" fill="#37352f">mer</text><text x="420.0" y="232.0" font-size="16" font-weight="700" text-anchor="middle" fill="#37352f">terre</text><line x1="60.0" y1="130.0" x2="342.0" y2="130.0" stroke="#37352f" stroke-width="3" stroke-linecap="round" /><polygon points="350.0,130.0 340.1,134.8 340.1,125.2" fill="#37352f" /><text x="150.0" y="112.0" font-size="16" font-weight="700" text-anchor="middle" fill="#37352f">brise de mer</text><text x="150.0" y="178.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">début d’après-midi</text><line x1="440.0" y1="122.0" x2="440.0" y2="64.0" stroke="#37352f" stroke-width="3" stroke-linecap="round" /><polygon points="440.0,56.0 444.8,65.9 435.2,65.9" fill="#37352f" /><text x="428.0" y="82.0" font-size="14" font-weight="400" text-anchor="end" fill="#37352f">l’air monte</text><text x="428.0" y="100.0" font-size="14" font-weight="400" text-anchor="end" fill="#37352f">au-dessus du rivage</text><text x="420.0" y="188.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">la nuit : brise de terre,</text><text x="420.0" y="206.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">plus faible</text></svg>
