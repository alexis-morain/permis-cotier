<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" width="560" height="150" role="img" font-family="Helvetica, Arial, sans-serif"><rect width="560" height="150" fill="#e4eef5" /><rect x="20" y="20" width="160" height="110" rx="6" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5" /><text x="100.0" y="50.0" font-size="18" font-weight="700" text-anchor="middle" fill="#37352f">8 jours</text><text x="100.0" y="76.0" font-size="14" font-weight="400" text-anchor="middle" fill="#37352f">retrait avant audition,</text><text x="100.0" y="96.0" font-size="14" font-weight="400" text-anchor="middle" fill="#37352f">en urgence motivée</text><rect x="200" y="20" width="160" height="110" rx="6" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5" /><text x="280.0" y="50.0" font-size="18" font-weight="700" text-anchor="middle" fill="#37352f">1 an</text><text x="280.0" y="76.0" font-size="14" font-weight="400" text-anchor="middle" fill="#37352f">au plus : le retrait</text><text x="280.0" y="96.0" font-size="14" font-weight="400" text-anchor="middle" fill="#37352f">temporaire</text><rect x="380" y="20" width="160" height="110" rx="6" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5" /><text x="460.0" y="50.0" font-size="18" font-weight="700" text-anchor="middle" fill="#37352f">3 ans</text><text x="460.0" y="76.0" font-size="14" font-weight="400" text-anchor="middle" fill="#37352f">avant de solliciter un</text><text x="460.0" y="96.0" font-size="14" font-weight="400" text-anchor="middle" fill="#37352f">nouveau permis, après</text><text x="460.0" y="116.0" font-size="14" font-weight="400" text-anchor="middle" fill="#37352f">un retrait définitif</text></svg>
