<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 340" width="560" height="340" role="img" font-family="Helvetica, Arial, sans-serif"><rect width="560" height="340" fill="#e4eef5" /><text x="12.0" y="20.0" font-size="16" font-weight="700" text-anchor="start" fill="#37352f">Incendie</text><rect x="11" y="32" width="130" height="112" rx="6" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5" /><text x="76.0" y="54.0" font-size="15" font-weight="700" text-anchor="middle" fill="#37352f">1. Couper</text><text x="76.0" y="72.0" font-size="15" font-weight="700" text-anchor="middle" fill="#37352f">l’alimentation</text><text x="76.0" y="96.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">vanne, batterie,</text><text x="76.0" y="113.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">robinet de gaz</text><line x1="141.0" y1="88.0" x2="139.0" y2="88.0" stroke="#37352f" stroke-width="2" stroke-linecap="round" /><polygon points="147.0,88.0 137.1,92.8 137.1,83.2" fill="#37352f" /><rect x="147" y="32" width="130" height="112" rx="6" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5" /><text x="212.0" y="54.0" font-size="15" font-weight="700" text-anchor="middle" fill="#37352f">2. Feu sous</text><text x="212.0" y="72.0" font-size="15" font-weight="700" text-anchor="middle" fill="#37352f">le vent</text><text x="212.0" y="96.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">manœuvrer pour</text><text x="212.0" y="113.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">venir au vent</text><line x1="277.0" y1="88.0" x2="275.0" y2="88.0" stroke="#37352f" stroke-width="2" stroke-linecap="round" /><polygon points="283.0,88.0 273.1,92.8 273.1,83.2" fill="#37352f" /><rect x="283" y="32" width="130" height="112" rx="6" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5" /><text x="348.0" y="54.0" font-size="15" font-weight="700" text-anchor="middle" fill="#37352f">3. Base des</text><text x="348.0" y="72.0" font-size="15" font-weight="700" text-anchor="middle" fill="#37352f">flammes</text><text x="348.0" y="96.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">capot fermé :</text><text x="348.0" y="113.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">pas d’appel d’air</text><line x1="413.0" y1="88.0" x2="411.0" y2="88.0" stroke="#37352f" stroke-width="2" stroke-linecap="round" /><polygon points="419.0,88.0 409.1,92.8 409.1,83.2" fill="#37352f" /><rect x="419" y="32" width="130" height="112" rx="6" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5" /><text x="484.0" y="54.0" font-size="15" font-weight="700" text-anchor="middle" fill="#37352f">4. Alerter</text><text x="484.0" y="78.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">feu non maîtrisé</text><text x="484.0" y="95.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">en quelques</text><text x="484.0" y="112.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">instants</text><text x="12.0" y="186.0" font-size="16" font-weight="700" text-anchor="start" fill="#37352f">Voie d’eau, après les brassières</text><rect x="11" y="198" width="130" height="112" rx="6" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5" /><text x="76.0" y="220.0" font-size="15" font-weight="700" text-anchor="middle" fill="#37352f">1. Localiser</text><text x="76.0" y="244.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">l’entrée d’eau :</text><text x="76.0" y="261.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">presse-étoupe,</text><text x="76.0" y="278.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">passe-coque,</text><text x="76.0" y="295.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">vanne</text><line x1="141.0" y1="254.0" x2="139.0" y2="254.0" stroke="#37352f" stroke-width="2" stroke-linecap="round" /><polygon points="147.0,254.0 137.1,258.8 137.1,249.2" fill="#37352f" /><rect x="147" y="198" width="130" height="112" rx="6" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5" /><text x="212.0" y="220.0" font-size="15" font-weight="700" text-anchor="middle" fill="#37352f">2. Aveugler</text><text x="212.0" y="244.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">de l’intérieur</text><text x="212.0" y="261.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">comme de</text><text x="212.0" y="278.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">l’extérieur</text><line x1="277.0" y1="254.0" x2="275.0" y2="254.0" stroke="#37352f" stroke-width="2" stroke-linecap="round" /><polygon points="283.0,254.0 273.1,258.8 273.1,249.2" fill="#37352f" /><rect x="283" y="198" width="130" height="112" rx="6" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5" /><text x="348.0" y="220.0" font-size="15" font-weight="700" text-anchor="middle" fill="#37352f">3. Assécher</text><text x="348.0" y="244.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">pompe et écope,</text><text x="348.0" y="261.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">le niveau</text><text x="348.0" y="278.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">doit baisser</text><line x1="413.0" y1="254.0" x2="411.0" y2="254.0" stroke="#37352f" stroke-width="2" stroke-linecap="round" /><polygon points="419.0,254.0 409.1,258.8 409.1,249.2" fill="#37352f" /><rect x="419" y="198" width="130" height="112" rx="6" fill="#ffffff" stroke="#c9c8c3" stroke-width="1.5" /><text x="484.0" y="220.0" font-size="15" font-weight="700" text-anchor="middle" fill="#37352f">4. Alerter</text><text x="484.0" y="244.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">rallier l’abri</text><text x="484.0" y="261.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">le plus proche</text></svg>
