<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 240" width="560" height="240" role="img" font-family="Helvetica, Arial, sans-serif"><rect width="560" height="240" fill="#e4eef5" /><text x="280.0" y="26.0" font-size="15" font-weight="700" text-anchor="middle" fill="#37352f">150 L utilisables, 25 L/h, 20 nœuds</text><rect x="40" y="46" width="160" height="50" fill="#ffffff" stroke="#37352f" stroke-width="2" /><text x="120.0" y="68.0" font-size="16" font-weight="700" text-anchor="middle" fill="#37352f">Aller</text><text x="120.0" y="87.0" font-size="14" font-weight="400" text-anchor="middle" fill="#37352f">50 L</text><rect x="200" y="46" width="160" height="50" fill="#ffffff" stroke="#37352f" stroke-width="2" /><text x="280.0" y="68.0" font-size="16" font-weight="700" text-anchor="middle" fill="#37352f">Retour</text><text x="280.0" y="87.0" font-size="14" font-weight="400" text-anchor="middle" fill="#37352f">50 L</text><rect x="360" y="46" width="160" height="50" fill="#8fb0c4" stroke="#37352f" stroke-width="2" /><text x="440.0" y="68.0" font-size="16" font-weight="700" text-anchor="middle" fill="#37352f">Réserve</text><text x="440.0" y="87.0" font-size="14" font-weight="400" text-anchor="middle" fill="#37352f">50 L</text><text x="40.0" y="128.0" font-size="14" font-weight="400" text-anchor="start" fill="#37352f">50 L ÷ 25 L/h = 2 h</text><text x="40.0" y="148.0" font-size="14" font-weight="400" text-anchor="start" fill="#37352f">2 h × 20 nœuds = 40 milles</text><text x="40.0" y="176.0" font-size="14" font-weight="700" text-anchor="start" fill="#37352f">Éloignement maximal</text><text x="40.0" y="194.0" font-size="14" font-weight="700" text-anchor="start" fill="#37352f">40 milles</text><text x="370.0" y="128.0" font-size="14" font-weight="700" text-anchor="start" fill="#37352f">L’imprévu :</text><text x="370.0" y="148.0" font-size="14" font-weight="400" text-anchor="start" fill="#37352f">vent, courant,</text><text x="370.0" y="166.0" font-size="14" font-weight="400" text-anchor="start" fill="#37352f">mer formée,</text><text x="370.0" y="184.0" font-size="14" font-weight="400" text-anchor="start" fill="#37352f">détour, assistance</text><text x="280.0" y="226.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">Plein : 150 ÷ 25 = 6 h, soit 120 milles de route</text></svg>
