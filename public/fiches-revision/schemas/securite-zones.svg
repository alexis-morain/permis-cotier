<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 292" width="560" height="292" role="img" font-family="Helvetica, Arial, sans-serif"><rect width="560" height="292" fill="#e4eef5" /><text x="280.0" y="22.0" font-size="15" font-weight="700" text-anchor="middle" fill="#37352f">La distance se compte depuis un abri, pas depuis la côte</text><rect x="0" y="36" width="70" height="196" fill="#e9e9e7" stroke="#a8a7a2" stroke-width="1.5" /><text x="35.0" y="138.0" font-size="16" font-weight="700" text-anchor="middle" fill="#37352f">Abri</text><rect x="70" y="36" width="122" height="196" fill="#cfe0ec" stroke="#c9c8c3" stroke-width="1.5" /><text x="131.0" y="62.0" font-size="16" font-weight="700" text-anchor="middle" fill="#37352f">Basique</text><text x="131.0" y="84.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">moins de</text><text x="131.0" y="101.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">2 milles</text><text x="131.0" y="134.0" font-size="15" font-weight="700" text-anchor="middle" fill="#37352f">Gilet 50</text><text x="131.0" y="160.0" font-size="14" font-weight="400" text-anchor="middle" fill="#37352f">extincteur</text><text x="131.0" y="179.0" font-size="14" font-weight="400" text-anchor="middle" fill="#37352f">mouillage</text><rect x="192" y="36" width="122" height="196" fill="#e4eef5" stroke="#c9c8c3" stroke-width="1.5" /><text x="253.0" y="62.0" font-size="16" font-weight="700" text-anchor="middle" fill="#37352f">Côtier</text><text x="253.0" y="84.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">2 à moins de</text><text x="253.0" y="101.0" font-size="14" font-weight="400" text-anchor="middle" fill="#6b6a65">6 milles</text><text x="253.0" y="134.0" font-size="15" font-weight="700" text-anchor="middle" fill="#37352f">Gilet 100</text><text x="253.0" y="160.0" font-size="14" font-weight="400" text-anchor="middle" fill="#37352f">+ 3 feux rouges</text><text x="253.0" y="179.0" font-size="1