<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" font-family="Helvetica, Arial, sans-serif"><rect width="400" height="300" fill="#ffffff" /><text x="20.0" y="22.0" font-size="14" font-weight="700" text-anchor="start" fill="#37352f">Le plus gêné, le plus privilégié</text><rect x="20" y="36" width="320" height="30" rx="4" fill="#e4eef5" stroke="#c9c8c3" stroke-width="1.5" /><text x="34.0" y="56.0" font-size="15" font-weight="700" text-anchor="start" fill="#37352f">1</text><text x="58.0" y="56.0" font-size="15" font-weight="400" text-anchor="start" fill="#37352f">Non maître de sa manœuvre</text><rect x="20" y="72" width="320" height="30" rx="4" fill="#e4eef5" stroke="#c9c8c3" stroke-width="1.5" /><text x="34.0" y="92.0" font-size="15" font-weight="700" text-anchor="start" fill="#37352f">2</text><text x="58.0" y="92.0" font-size="15" font-weight="400" text-anchor="start" fill="#37352f">Capacité de manœuvre restreinte</text><rect x="20" y="108" width="320" height="30" rx="4" fill="#e4eef5" stroke="#c9c8c3" stroke-width="1.5" /><text x="34.0" y="128.0" font-size="15" font-weight="700" text-anchor="start" fill="#37352f">3</text><text x="58.0" y="128.0" font-size="15" font-weight="400" text-anchor="start" fill="#37352f">Handicapé par son tirant d’eau</text><rect x="20" y="144" width="320" height="30" rx="4" fill="#e4eef5" stroke="#c9c8c3" stroke-width="1.5" /><text x="34.0" y="164.0" font-size="15" font-weight="700" text-anchor="start" fill="#37352f">4</text><text x="58.0" y="164.0" font-size="15" font-weight="400" text-anchor="start" fill="#37352f">En train de pêcher</text><rect x="20" y="180" width="320" height="30" rx="4" fill="#e4eef5" stroke="#c9c8c3" stroke-width="1.5" /><text x="34.0" y="200.0" font-size="15" font-weight="700" text-anchor="start" fill="#37352f">5</text><text x="58.0" y="200.0" font-size="15" font-weight="400" text-anchor="start" fill="#37352f">À voile</text><rect x="20" y="216" width="320" height="30" rx="4" fill="#e4eef5" stroke="#c9c8c3" stroke-width="1.5" /><text x="34.0" y="236.0" font-size="15" font-weight="700" text-anchor="start" fill="#37352f">6</text><text x="58.0" y="236.0" font-size="15" font-weight="400" text-anchor="start" fill="#37352f">À propulsion mécanique</text><line x1="372.0" y1="240.0" x2="372.0" y2="50.0" stroke="#37352f" stroke-width="3" stroke-linecap="round" /><polygon points="372.0,42.0 376.8,51.9 367.2,51.9" fill="#37352f" /><text x="20.0" y="268.0" font-size="14" font-weight="400" text-anchor="start" fill="#37352f">Chacun s’écarte de ceux qui sont au-dessus.</text><text x="20.0" y="288.0" font-size="14" font-weight="400" text-anchor="start" fill="#6b6a65">Les règles 9, 10 et 13 passent avant.</text></svg>
