name: CI

on:
  push:
    branches: [main]
  pull_request:

# Dépôt public : le jeton par défaut sait écrire. Rien ici n'écrit, et un
# workflow qui lit le dépôt n'a pas à pouvoir le modifier.
permissions:
  contents: read

# Deux poussées rapprochées sur la même branche se couraient après, et la plus
# ancienne rendait son verdict après la plus récente.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt

      # La banque d'abord : une question fausse de forme casse le déploiement.
      - name: Valider la banque
        run: python scripts/valider.py

      # Deux énoncés identiques au mot près peuvent tomber dans le même examen
      # blanc : la banque se met alors à bégayer sans qu'aucune question soit
      # fausse. Le champ `famille` l'empêche, encore faut-il l'avoir posé.
      - name: Vérifier les redites de la banque
        run: python scripts/doublons.py --verifier

      - name: Vérifier les crédits des visuels
        run: python scripts/credits.py --verifier

      # Les feux sont dessinés depuis leur description : si le dessin livré ne
      # correspond plus, c'est la description qui a bougé sans être régénérée.
      - name: Vérifier les visuels de feux
        run: python scripts/feux.py --verifier

      - name: Vérifier les marques de balisage
        run: python scripts/balisage.py --verifier

      - name: Vérifier les signaux d'écluse
        run: python scripts/ecluses.py --verifier

      - name: Vérifier les planches de carte marine
        run: python scripts/carte.py --verifier

      # Les rythmes et les situations sont animés : un motif retouché à la main
      # dans le SVG livré sortirait du contrôle de la source qui le décrit.
      - name: Vérifier les rythmes de feux
        run: python scripts/rythmes.py --verifier

      - name: Vérifier les situations de rencontre
        run: python scripts/situations.py --verifier

      - name: Vérifier les signaux sonores
        run: python scripts/sons.py --verifier

      # Les bruitages de l'app sont calculés, pas enregistrés : un WAV retouché
      # à la main sortirait du contrôle du script qui le synthétise.
      - name: Vérifier les sons de l'app
        run: python scripts/sons_app.py --verifier

      - name: Tests du validateur
        run: python -m pytest tests -q

      - name: Tests du moteur
        run: npm test

      - name: Types
        run: npx astro check --minimumSeverity error

      - name: Build
        run: npx astro build

      # Le site ne doit rien payer pour l'app : `verifier-cible.mjs` refuse un
      # `dist/` où un greffon Capacitor aurait fui.
      - name: Vérifier que rien de l'app n'est dans le site
        run: node scripts/verifier-cible.mjs

      # Ce que le build montre aux moteurs : titres coupés ou en double,
      # descriptions manquantes, canoniques qui désignent une autre adresse.
      # Rien de tout cela ne se voit à l'écran ni dans les tests.
      - name: Audit SEO du build
        run: node scripts/audit-seo.mjs

      # La coquille iOS sert `dist-app/`. Sans ce build, une page élaguée ou un
      # lien mort dans l'app ne cassait personne, et se voyait au simulateur
      # seulement. `elaguer-app.mjs` refuse le bundle si un lien pointe hors de
      # lui ou compte sur une redirection.
      - name: Build de la cible app
        run: npm run build:app
