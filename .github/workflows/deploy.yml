name: Déploiement

# Déploie sur Cloudflare Pages à chaque poussée sur main, une fois la CI verte.
# Prérequis, à créer une fois dans les secrets du dépôt :
#   CLOUDFLARE_API_TOKEN   jeton avec la permission « Cloudflare Pages: Edit »
#   CLOUDFLARE_ACCOUNT_ID  identifiant du compte, visible dans le tableau de bord
# Sans ces secrets, le job est simplement sauté : `npm run deploy` en local
# reste possible.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deployer:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Construire
        run: npm run build

      - name: Publier sur Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name permis-cotier --branch main
