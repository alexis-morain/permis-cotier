name: claude

# Revue et correctifs à la demande : Alexis écrit `@claude …` dans une PR ou
# une issue. Rien ne part tout seul, et personne d'autre ne peut déclencher :
# l'action vérifie les droits d'écriture, le `if` ne garde que le propriétaire.
#
# Sur la PR d'un contributeur extérieur, l'action refuse d'exécuter son code
# (npm, python, scripts) dans ce job, qui tient le jeton : Claude lit, modifie,
# commente, et lit le verdict de la CI. Aucune règle `Bash(...)` n'est ouverte
# ici, car une règle ouverte resterait permise sur un fork.
#
# Sur un fork, Claude pousse dans une branche `pr-<n>` de ce dépôt, qui porte
# aussi les commits du contributeur : on la relit avant de la fusionner, et on
# la supprime ensuite. Aucun workflow à secrets ne se déclenche sur `pr-*`.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: >-
      (github.event.comment.user.login == 'alexis-morain' && contains(github.event.comment.body, '@claude')) ||
      (github.event.review.user.login == 'alexis-morain' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 40
            --append-system-prompt "Tu relis ou corriges une PR de permis-cotier. Le CLAUDE.md du dépôt fait foi. Règles dures : (1) une question que tu écris ou retouches reste en relu_par: claude, n'écris jamais relu_par: alexis et ne passe jamais une question au statut publie ; (2) une question sans source réglementaire citée n'entre pas, signale-la ; (3) aucun visuel porteur de réponse généré par IA ; (4) ne fusionne jamais, ne pousse jamais sur main ; (5) les fichiers dérivés (PDF des fiches, SVG, CREDITS.md, empreintes.json) sont regénérés par autofix.ci, ne les édite pas à la main. Pour une revue : réponds en français, d'abord le verdict (fusionnable / à corriger / à refuser), puis les points bloquants avec fichier et ligne, puis le reste. Pour vérifier la CI, lis les logs des runs de la PR."
